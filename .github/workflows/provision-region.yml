name: Provision region

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region root under aws/terraform/regions/ (e.g. us-east-1)"
        required: true
        default: "us-east-1"

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate App Token for wasp-gitops
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: wasp-gitops

      - name: Checkout wasp-gitops (private action repo)
        uses: actions/checkout@v5
        with:
          repository: smsilva/wasp-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: .github/actions/wasp-gitops

      - name: Setup AWS auth, SAML, Terraform
        id: setup
        uses: ./.github/actions/wasp-gitops/actions/aws/setup
        with:
          cicd_role_arn: ${{ vars.CICD_ROLE_ARN }}
          network_role_arn: ${{ vars.NETWORK_ROLE_ARN }}
          role_session_name: gha-provision-region
          saml_metadata_xml: ${{ secrets.SAML_METADATA_XML }}

      - name: Provision hub + cell
        working-directory: aws/terraform
        env:
          REGION: ${{ inputs.region }}
          EGRESS_IP: ${{ steps.setup.outputs.egress_ip }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
        run: |
          ./scripts/up-02-region \
            --region "${REGION}" \
            --with-cell \
            --public-cidr "${EGRESS_IP}/32" \
            --state-bucket "${STATE_BUCKET}" \
            --yes

      - name: Close public endpoint
        if: always()
        working-directory: aws/terraform
        env:
          REGION: ${{ inputs.region }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
        run: |
          ./scripts/up-02-region \
            --region "${REGION}" \
            --with-cell \
            --close-public-access \
            --state-bucket "${STATE_BUCKET}" \
            --yes

      - name: Summary
        if: always()
        working-directory: aws/terraform
        env:
          REGION: ${{ inputs.region }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
        run: |
          cd "regions/${REGION}"
          terraform init -backend-config="bucket=${STATE_BUCKET}" -reconfigure >/dev/null 2>&1

          KUBECONFIG_CMD="$(terraform output -raw kubeconfig_command 2>/dev/null || true)"
          SERVICES_URL="$(terraform output -raw cell_services_url 2>/dev/null || true)"
          VPN_DOC="aws/docs/vpn/client-vpn-operations.md"
          VPN_DOC_URL="https://github.com/${GITHUB_REPOSITORY}/blob/main/${VPN_DOC}"

          {
            echo "## Region provisioned: \`${REGION}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **kubeconfig** | \`${KUBECONFIG_CMD:-not available}\` |"
            echo "| **Services URL** | ${SERVICES_URL:-not available} |"
            echo "| **VPN operations** | [${VPN_DOC}](${VPN_DOC_URL}) |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"