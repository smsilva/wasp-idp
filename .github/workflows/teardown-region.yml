name: Teardown region

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region root under aws/terraform/regions/ (no default — pick deliberately)"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate App Token for wasp-gitops
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: wasp-gitops

      - name: Checkout wasp-gitops (private action repo)
        uses: actions/checkout@v4
        with:
          repository: smsilva/wasp-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: .github/actions/wasp-gitops

      - name: Setup AWS auth, SAML, Terraform
        id: setup
        uses: ./.github/actions/wasp-gitops/actions/aws/setup
        with:
          cicd_role_arn: ${{ vars.CICD_ROLE_ARN }}
          network_role_arn: ${{ vars.NETWORK_ROLE_ARN }}
          role_session_name: gha-teardown-region
          saml_metadata_xml: ${{ secrets.SAML_METADATA_XML }}

      - name: Teardown cell
        working-directory: aws/terraform
        env:
          REGION: ${{ inputs.region }}
          EGRESS_IP: ${{ steps.setup.outputs.egress_ip }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
        run: |
          ./scripts/down-cell \
            --region "${REGION}" \
            --public-cidr "${EGRESS_IP}/32" \
            --state-bucket "${STATE_BUCKET}" \
            --yes

      - name: Close public endpoint
        if: always()
        working-directory: aws/terraform
        env:
          REGION: ${{ inputs.region }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
        run: |
          ./scripts/down-cell \
            --region "${REGION}" \
            --close-public-access \
            --state-bucket "${STATE_BUCKET}" \
            --yes