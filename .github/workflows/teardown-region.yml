name: Teardown region

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region root under aws/terraform/regions/ (e.g. us-east-1)"
        required: true
        default: "us-east-1"

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure OIDC credentials
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          CICD_ROLE_ARN: ${{ vars.CICD_ROLE_ARN }}
          NETWORK_ROLE_ARN: ${{ vars.NETWORK_ROLE_ARN }}
        run: |
          oidc_token="$(curl --silent --show-error --location \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')"

          # Trocamos o token OIDC do GitHub por credenciais da cicd UMA VEZ — ver
          # o mesmo comentario em provision-region.yml e aws/terraform/ci/README.md.
          creds="$(aws sts assume-role-with-web-identity \
            --role-arn "${CICD_ROLE_ARN}" \
            --role-session-name "gha-teardown-region" \
            --web-identity-token "${oidc_token}" \
            --duration-seconds 21600 \
            --output json)"

          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<EOF
          [cicd]
          aws_access_key_id = $(jq -r '.Credentials.AccessKeyId' <<<"${creds}")
          aws_secret_access_key = $(jq -r '.Credentials.SecretAccessKey' <<<"${creds}")
          aws_session_token = $(jq -r '.Credentials.SessionToken' <<<"${creds}")
          EOF

          cat > ~/.aws/config <<EOF
          [profile network]
          role_arn = ${NETWORK_ROLE_ARN}
          source_profile = cicd
          EOF

      - name: Write SAML metadata from secret
        env:
          SAML_METADATA_XML: ${{ secrets.SAML_METADATA_XML }}
        run: printf '%s' "${SAML_METADATA_XML}" > aws/terraform/variables/saml-metadata.xml

      - name: Discover runner egress IPv4
        id: egress-ip
        run: |
          ip="$(curl --silent --show-error https://checkip.amazonaws.com | tr -d '[:space:]')"
          if [[ ! "${ip}" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "runner egress IP is not IPv4: '${ip}' — refusing to build a malformed CIDR" >&2
            exit 1
          fi
          echo "ip=${ip}" >> "${GITHUB_OUTPUT}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Teardown cell
        working-directory: aws/terraform
        env:
          REGION: ${{ inputs.region }}
          EGRESS_IP: ${{ steps.egress-ip.outputs.ip }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
        run: |
          ./scripts/down-cell \
            --region "${REGION}" \
            --public-cidr "${EGRESS_IP}/32" \
            --state-bucket "${STATE_BUCKET}" \
            --yes

      - name: Close public endpoint
        if: always()
        working-directory: aws/terraform
        env:
          REGION: ${{ inputs.region }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
        run: |
          ./scripts/down-cell \
            --region "${REGION}" \
            --close-public-access \
            --state-bucket "${STATE_BUCKET}" \
            --yes