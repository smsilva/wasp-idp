# Tests, builds, scans, signs and publishes the 8 control-plane images and the Helm chart to GHCR
# (#599), so a `remote` init target (future work, #558) has images and a chart to point at instead
# of only the local Docker build + k3d image import path. Triggered by a tag push or by hand.
name: platform-control-plane-release

on:
  push:
    tags:
      - 'control-plane-v*'
  workflow_dispatch:
    inputs:
      chart-version:
        description: Chart version to publish, without the leading "control-plane-v"
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        project:
          - platform/api
          - platform/providers/local_vcluster
          - platform/providers/scm_github
          - platform/providers/workload
          - platform/providers/forager
          - platform/providers/registry
          - platform/providers/aws_account
          - platform/providers/crossplane_aws
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --directory ${{ matrix.project }} pytest

  build-images:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (OIDC to Sigstore's Fulcio)
    strategy:
      matrix:
        include:
          - image: platform-api
            context: platform
            dockerfile: platform/api/Dockerfile
          - image: local-vcluster-provider
            context: platform/providers/local_vcluster
            dockerfile: platform/providers/local_vcluster/Dockerfile
          - image: scm-github-provider
            context: platform
            dockerfile: platform/providers/scm_github/Dockerfile
          - image: workload-provider
            context: platform/providers/workload
            dockerfile: platform/providers/workload/Dockerfile
          - image: forager-provider
            context: platform/providers/forager
            dockerfile: platform/providers/forager/Dockerfile
          - image: registry-provider
            context: platform/providers/registry
            dockerfile: platform/providers/registry/Dockerfile
          - image: aws-account-provider
            context: platform/providers/aws_account
            dockerfile: platform/providers/aws_account/Dockerfile
          - image: crossplane-aws-provider
            context: platform/providers/crossplane_aws
            dockerfile: platform/providers/crossplane_aws/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Compute tag
        id: tag
        env:
          CHART_VERSION: ${{ inputs.chart-version }}
        run: |
          if [[ -n "${CHART_VERSION}" ]]; then
            echo "tag=${CHART_VERSION}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${GITHUB_REF_NAME#control-plane-v}" >> "${GITHUB_OUTPUT}"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # buildx with oci-mediatypes: the docker driver pushes a Docker v2 manifest and drops the
      # annotations without an error (GHCR keeps them only on an OCI manifest) — same reasoning as
      # the user-component build (platform-build.yaml), for the same OCI labels/annotations below.
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          outputs: type=image,push=true,oci-mediatypes=true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          annotations: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}

      # Scans the pushed image by digest (not by tag, which can move): fails the run on a CRITICAL
      # or HIGH vulnerability with a fix available, the same bar a supply-chain review expects.
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - uses: sigstore/cosign-installer@v3
      # Keyless signing (Sigstore/Fulcio via OIDC, `id-token: write` above): no key material to
      # manage or leak. Verify with:
      #   cosign verify ghcr.io/<repo>/<image>@<digest> \
      #     --certificate-identity-regexp 'https://github.com/<repo>/.github/workflows/platform-control-plane-release.yaml@.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - run: cosign sign --yes "ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}"

  publish-chart:
    needs: build-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (OIDC to Sigstore's Fulcio)
    steps:
      - uses: actions/checkout@v7
      - name: Compute version
        id: version
        env:
          CHART_VERSION: ${{ inputs.chart-version }}
        run: |
          if [[ -n "${CHART_VERSION}" ]]; then
            echo "version=${CHART_VERSION}" >> "${GITHUB_OUTPUT}"
          else
            echo "version=${GITHUB_REF_NAME#control-plane-v}" >> "${GITHUB_OUTPUT}"
          fi
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'
      - run: helm registry login ghcr.io --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
      - run: helm package platform/chart/platform-control-plane --version "${{ steps.version.outputs.version }}" --app-version "${{ steps.version.outputs.version }}" --destination /tmp
      - id: push
        run: |
          helm push "/tmp/platform-control-plane-${{ steps.version.outputs.version }}.tgz" "oci://ghcr.io/${{ github.repository }}/charts" 2>&1 | tee /tmp/push.log
          digest="$(grep --only-matching --extended-regexp 'sha256:[0-9a-f]{64}' /tmp/push.log | tail -1)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "ghcr.io/${{ github.repository }}/charts/platform-control-plane@${{ steps.push.outputs.digest }}"
