name: Recover Terraform lock

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region root under aws/terraform/regions/ whose lock is stuck (no default — pick deliberately)"
        required: true
      lock_id:
        description: "Lock ID from the 'Error acquiring the state lock' message (no default — pick deliberately)"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure OIDC credentials
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          CICD_ROLE_ARN: ${{ vars.CICD_ROLE_ARN }}
          NETWORK_ROLE_ARN: ${{ vars.NETWORK_ROLE_ARN }}
        run: |
          oidc_token="$(curl --silent --show-error --location \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')"

          # Trocamos o token OIDC do GitHub por credenciais estaticas da cicd UMA VEZ — ver
          # o mesmo comentario em provision-region.yml e aws/terraform/ci/README.md.
          creds="$(aws sts assume-role-with-web-identity \
            --role-arn "${CICD_ROLE_ARN}" \
            --role-session-name "gha-recover-lock" \
            --web-identity-token "${oidc_token}" \
            --duration-seconds 21600 \
            --output json)"

          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<EOF
          [cicd]
          aws_access_key_id = $(jq -r '.Credentials.AccessKeyId' <<<"${creds}")
          aws_secret_access_key = $(jq -r '.Credentials.SecretAccessKey' <<<"${creds}")
          aws_session_token = $(jq -r '.Credentials.SessionToken' <<<"${creds}")
          EOF

          cat > ~/.aws/config <<EOF
          [profile network]
          role_arn = ${NETWORK_ROLE_ARN}
          source_profile = cicd
          EOF

      - name: Write SAML metadata from secret
        env:
          SAML_METADATA_XML: ${{ secrets.SAML_METADATA_XML }}
        run: printf '%s' "${SAML_METADATA_XML}" > aws/terraform/variables/saml-metadata.xml

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: force-unlock and plan for human review
        working-directory: aws/terraform/regions/${{ inputs.region }}
        env:
          REGION: ${{ inputs.region }}
          LOCK_ID: ${{ inputs.lock_id }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
        run: |
          ln --symbolic --force ../../variables/values.tfvars values.auto.tfvars
          terraform init -reconfigure -backend-config="bucket=${STATE_BUCKET}" -input=false
          terraform force-unlock -force "${LOCK_ID}"

          echo "::notice::force-unlock done. Reviewing the plan below is mandatory before re-running provision-region — a plan proposing to CREATE a resource that should already exist means the recovery is 'terraform import', not force-unlock (see aws/terraform/CLAUDE.md)."
          terraform plan -no-color -input=false
