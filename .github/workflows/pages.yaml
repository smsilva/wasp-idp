name: pages

# Publishes the repo's GitHub Pages site. A repo has a single Pages site, so every part is built here
# and deployed together:
# - / : the IDP presentation (docs/presentation/), regenerated from idp.yaml, so the site never
#   depends on the committed HTML. Links to references/*.md point to the blob on GitHub — on Pages
#   the raw .md would show as plain text.
# - /cli/ : the platform CLI guide (cli/docs/, MkDocs).
on:
  push:
    branches: [main]
    paths:
      - docs/presentation/**
      - cli/docs/**
      - cli/mkdocs.yml
      - .github/workflows/pages.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # deploy-pages authenticates to Pages via OIDC

# One deploy at a time; a new push does not cancel the deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml mkdocs-material

      - name: Build the presentation
        working-directory: docs/presentation
        env:
          TOPICS_URL: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/presentation/references
        run: |
          site="${RUNNER_TEMP}/site"
          mkdir -p "${site}"
          ./render-outline idp.yaml \
            --output "${site}/index.html" \
            --topics-url "${TOPICS_URL}"

      - name: Build the CLI guide
        run: |
          mkdocs build \
            --strict \
            --config-file cli/mkdocs.yml \
            --site-dir "${RUNNER_TEMP}/site/cli"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
