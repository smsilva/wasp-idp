  - name: orchestrator
    act: integration-delivery
    topic: "Orchestrator"
    audiences: [platform]
    message: "O orquestrador lê a declaração da app, decide o que criar e mantém os recursos em dia; a ferramenta ainda está em avaliação."
    screen: ["**What:** _turns_ the declaration into resources", "**Keeps:** resources _in sync_ with it over time", "**Tool:** under evaluation"]
    dependsOn: [score-what-not]
    notes: |-
      O que queremos dizer: **o papel do orquestrador está definido; a ferramenta, não** — e isso é uma escolha consciente.

      **O papel:** é a camada de controle persistente entre a declaração e os recursos. Lê o `app-spec.yaml` do Developer Control, decide o que criar em cada ambiente e mantém os recursos em dia ao longo do tempo. Definição em Platform as a Product, **p. 16**: 'persistent control layer that coordinates capabilities across the platform, manages state, enforces policy, and enables safe evolution over time'.

      **A ferramenta:** está em avaliação por uma pessoa do time, e a divisão de papéis com o IaC ainda está em aberto. Por isso não aparece na tela — a mesma regra da landscape: **categoria antes de ferramenta**, para não enviesar a decisão.

      Se perguntarem "por que ainda não decidiram?": o papel não depende da ferramenta; escolhê-la é uma das frentes do time.

      Fonte: references/platform-as-a-product.md, references/base-deck.md, references/poc.md.

  - name: platform-facade
    act: integration-delivery
    topic: "Orchestrator"
    audiences: [executive, platform]
    message: "Portal mais pipeline parece plataforma — mas sem orquestração é só fachada."
    heading: "Platform façade"
    screen: ["**What:** portal + CI, no orchestration", "**Result:** a polished UI for fragile automation"]
    notes: |-
      O que queremos dizer: portal mais pipeline parece plataforma, mas **sem a camada que mantém estado e política é só fachada**.

      **Platform as a Product** (O'Reilly), **p. 15:** 'platform façade' é o anti-padrão de ter **portal + pipeline/workflow engine** sem a camada que mantém estado, aplica política e acompanha o ciclo de vida. Sem ela, o portal vira 'a polished UI for running fragile automation' (p. 16).

      **Pipelines** são 'execution tools' transientes (p. 19).

      Responde a pergunta 'por que não basta Backstage + GitHub Actions?'.

      **Ressalva para o apresentador:** o report é patrocinado pela **Syntasso, empresa do Kratix** — o argumento favorece a categoria orquestrador, que é exatamente o que eles vendem.

      Fonte: references/platform-as-a-product.md.
    dependsOn: [orchestrator]

  - name: puppy-for-christmas
    act: integration-delivery
    topic: "Orchestrator"
    audiences: [executive, platform]
    message: "Provisionar com um clique e ninguém cuidar depois: o filhote de Natal."
    heading: "Puppy for Christmas"
    screen: ["**What:** one click to create, nobody to care for it", "**Result:** platform decay"]
    notes: |-
      O que queremos dizer: **criar é fácil; o problema é quem cuida do recurso depois**.

      **Platform as a Product, p. 16:** 'puppy for Christmas' — o recurso é criado por clique e **abandonado, sem upgrade, política ou dono**. 'That is not empowerment. That is abandonment.' (p. 16).

      O sintoma de longo prazo é o **platform decay** (p. 18): snowflakes, ownership obscuro, backlog de quick fixes.

      Fonte: references/platform-as-a-product.md.
    dependsOn: [orchestrator, platform-facade]

