    notes: |-
      O que queremos dizer: **ninguém escreve esses arquivos do zero** — o golden path cria o repo já com o descritor do catálogo e a declaração da app, seguindo o jeito certo.

      É por isso que vem por último no Developer Control: ele **junta** catálogo e declaração, e entrega um repo — que é onde o próximo plane começa.

  - name: golden-paths
    act: developer-control
    topic: "Golden Paths"
    message: "O golden path junta catálogo e declaração: cria o repo já com os dois arquivos, pelo caminho pavimentado."
    heading: "Golden paths"
    screen: ["**Rule:** the easy way _is_ the right way", "**Shape:** optional and composable"]
    notes: |-
      O que queremos dizer: **o caminho certo precisa ser o mais fácil**, sem virar jaula — e **ninguém escreve o `catalog-info.yaml` e o `app-spec.yaml` do zero**: o golden path cria o repo já com os dois.

      Vem por último no Developer Control porque **junta** catálogo e declaração e entrega um repo — que é onde o próximo plane começa.

      **Golden path** é o caminho suportado pela plataforma para uma tarefa recorrente, como criar um serviço ou pedir um banco. Quando ele é o caminho mais fácil, seguir o padrão deixa de ser obrigação.

      'abstractions should be composable and optional. They should guide without constraining. They should reduce complexity without hiding critical details.' (Platform as a Product, p. 11).

      **Ressalva:** a 'golden cage' — caminho rígido imposto de cima gera shadow platforms, e não existe golden path universal (p. 11).

      A pergunta que decide a adoção, segundo 'The platform engineering illusion': **'Why would a developer, mid-deadline, exhausted, half paying attention, choose your paved road over the goat trail they already know?'** Impor o caminho não resolve: 'mandated usage generates resentment rather than advocacy, and resentment metastasizes into **shadow infrastructure**' — fonte independente da Syntasso para a mesma ressalva.

      Fonte: references/platform-as-a-product.md, references/platform-illusion.md.
    dependsOn: [platform-as-product, score-what-not]

