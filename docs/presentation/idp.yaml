    source: "platformengineering.org/platform-tooling · planes as parallel layers; the journey order is ours"
    notes: |-
      O que queremos dizer: **IaC cuida dos recursos; Delivery cuida da app** — qual versão roda em qual ambiente, e como ela chega lá.

      É o *CD* que a caixa de CI deixou de carregar: build e testes ficam na CI, a entrega fica aqui.

  - name: gitops
    act: integration-delivery
    topic: "Delivery"
    message: "A entrega é GitOps: o estado desejado de cada ambiente está no git."
    heading: "GitOps delivery"
    screen: ["**What:** desired state per environment _lives in_ git", "**Tool:** `Argo CD`"]
    notes: |-
      O que queremos dizer: **o git registra qual versão roda em qual ambiente** — fecha o fio de "Where versions live".

      **CD** (continuous delivery). É aqui que 'qual versão roda em qual ambiente' fica registrado, e é daqui que **um plugin traz essa informação de volta ao portal**.

