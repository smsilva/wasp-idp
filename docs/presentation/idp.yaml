    code: {file: snippets/catalog-info.yaml, focus: 12-15}
    dependsOn: [declare-apis]
    notes: |-
      O que queremos dizer: **a app declara do que depende pelo papel, nunca pelo serviço de nuvem.**

      Um banco relacional, um tópico de eventos e um bucket de imagens. **Nenhuma linha diz qual produto de nuvem** — o mesmo princípio que reaparece na declaração da app.

      Baseado em `idp/catalog/communication/catalog-info.yaml`, onde os três Resources do `greeter` declaram `dependencyOf` o `greeting-api` — a mesma aresta, vista do outro lado.

      Fonte: references/backstage-catalog.md.

  - name: declare-discovery
    act: developer-control
    topic: "Software Catalog"
    audiences: [engineering, platform]
    message: "O portal encontra o arquivo e mantém o catálogo em dia sozinho."
    heading: "How the file reaches the catalog"
    screen: ["**Source:** `catalog-info.yaml` in the repository", "**Discovery:** the portal scans the GitHub organization", "**Refresh:** reprocessed on a schedule, no manual edits"]
    dependsOn: [declare-dependencies]
    notes: |-
      O que queremos dizer: **ninguém edita o catálogo à mão**; o portal acha o arquivo e o mantém em dia.

      Siglas:
      - **PR** (pull request).

      **Descoberta:** o arquivo mora no repositório da app. O portal o encontra de dois jeitos: por uma **location** registrada (a URL do YAML) ou **varrendo a organização no GitHub** atrás de arquivos com esse nome. O exemplo da doc roda **a cada 30 minutos**.

      **Atualização:** o processing loop reprocessa cada entidade periodicamente. Mudou o arquivo no PR, o catálogo acompanha — ninguém edita o catálogo à mão.

      Fonte: references/backstage-catalog.md.

  - name: no-versions
    act: developer-control
