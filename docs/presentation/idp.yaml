    code: {file: snippets/catalog-info.yaml, focus: 10-11}
    dependsOn: [declare-ownership]
    notes: |-
      O que queremos dizer: **a app declara o contrato que oferece.** `providesApis` aponta para a entidade API `greeting-http`.

      Quem consome declara `consumesApis` do outro lado — **o catálogo desenha a aresta.**

      Fonte: references/backstage-catalog.md.

  - name: declare-dependencies
    act: developer-control
    topic: "Software Catalog"
    audiences: [engineering, platform]
