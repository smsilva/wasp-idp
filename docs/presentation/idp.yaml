    screen: ["**Not:** versions", "**Only:** the human concept", "**Example:**\n`playback-order` _is_ 1 component, N versions running"]
    notes: |-
      O que queremos dizer: **o catálogo é o modelo mental humano da plataforma**, não o estado vivo dela.

      Recomendação explícita da documentação do Backstage (FAQ do catálogo). `playback-order`, o serviço de ordem de reprodução do catálogo de demonstração, é **um Component, mesmo com várias versões rodando ao mesmo tempo**. O estado vivo fica em outro lugar.

      Fonte: references/backstage-catalog.md.
    dependsOn: [declare-discovery]

