  - name: iac
    act: integration-delivery
    topic: "IaC"
    audiences: [platform]
    message: "Os recursos são declarados como código e reconciliados continuamente."
    heading: "Infrastructure as code"
    screen: ["**What:** declared resources, continuously reconciled", "**Tools:** `Crossplane`, `Terraform`", "**Example:**\n1 `Environment` claim _becomes_ an EKS cluster"]
    notes: |-
      O que queremos dizer: **a infra é declarada como código** e um reconciliador a mantém no estado declarado.

      Siglas:
      - **IaC** (infrastructure as code): a infra descrita em arquivos versionados.
      - **EKS** (Elastic Kubernetes Service): o Kubernetes gerenciado da AWS.
      - **GitOps**: o estado desejado vive no Git e é aplicado por reconciliação.

      **Exemplo real da PoC:** um claim `Environment` vira **um cluster EKS inteiro**, com rede, DNS, certificado, identidade e GitOps (Platform/IaC).

      **Reconciliação contínua:** se alguém mudar à mão, o Crossplane **devolve ao estado declarado**.

      Fonte: references/base-deck.md, references/poc.md.
    dependsOn: [puppy-for-christmas]

  - name: landscape-ind-6
    act: integration-delivery
    topic: "Delivery"
    message: "A entrega leva a versão da app a cada ambiente, com o estado desejado no git e o rollout em anéis."
    heading: "Delivery"
    divider: false
    diagram: "diagrams/landscape/landscape.svg"
    show: [dev-plane, ind-plane, res-plane, obs-plane, sec-plane, ind.1, ind.2, ind.3, ind.4, ind.5]
    dim: [dev]
