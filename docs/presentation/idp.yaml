      O banco aparece aqui porque **a spec pediu**: o dev não abriu ticket nem escolheu serviço de nuvem.

      **Forma da CLI:** `platform <recurso> <verbo>` com a app como escopo (`--app`), como `gh release create`, `gcloud builds list`, `fly releases --app`. O deploy devolve a URL na saída, como o `gcloud run deploy`: não há comando só para buscá-la.

