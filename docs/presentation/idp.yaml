    notes: |-
      O que queremos dizer: **quebrou o contrato, mudou o conceito** — e os consumidores precisam migrar de forma explícita.

      Exemplo da própria FAQ do Backstage: `customerinfo` → `customerinfo2`.

      Fonte: references/backstage-catalog.md.
    dependsOn: [no-versions]

