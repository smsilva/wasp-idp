      O que queremos dizer: **o agente trabalha com o contexto que a plataforma deu** — o PRD, o `AGENTS.md`, a spec e a entrada do catálogo.

      **A spec veio do golden path** (`app-spec.yaml`): container, porta, rota e um banco `postgres`. As variáveis do container **referenciam o recurso** (`${resources.db.host}`, `username`, `password`): a app não sabe onde o banco vai rodar nem guarda senha — a plataforma preenche no release.

      **`platform app clone`** acha o repo pelo nome da app no catálogo (como `heroku git:clone --app`): o dev não precisa saber em que org ou host o código mora. O `git clone` que ela executa aparece em cinza.

      Tudo numa branch: nada chega à `main` sem PR.

