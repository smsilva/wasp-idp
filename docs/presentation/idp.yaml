  - name: journey-build
    act: journey
    topic: "From idea to running product"
    message: "Uma branch vira uma versão no registry, sem esperar o merge."
    heading: "Build: a version from a branch"
    diagram: "diagrams/journey/build.svg"
    show: [strip]
    start: "empty"
    empty: [prompt]
    reveal: [cmd.1, cmd.1-out, cmd.2, cmd.2-out]
    accumulate: true
    notes: |-
      O que queremos dizer: **qualquer branch pode virar artefato versionado** — a versão carrega a branch e o commit.

      O catálogo não guarda versões; quem guarda é o registry.

      **A spec é validada no build** — gate determinístico e obrigatório: spec inválida não vira versão, e o erro volta com o motivo. O mesmo validador pode rodar localmente para errar mais cedo, mas é opcional; a garantia é a da CI. No release a plataforma valida de novo ao aplicar (`unknown field`, como no slide do gate determinístico).

  - name: journey-env
    act: journey
    topic: "From idea to running product"
    message: "O dev lista os ambientes e cria um novo, descartável, com prazo."
    heading: "Environment: pick or create"
    diagram: "diagrams/journey/env.svg"
    show: [strip]
    start: "empty"
    empty: [prompt]
    reveal: [cmd.1, cmd.1-out, cmd.2, cmd.2-out]
    accumulate: true
    notes: |-
      O que queremos dizer: **ambiente é self-service** — listar o que existe e criar um novo sem ticket.

      `--expires` evita ambiente ocioso: custo que ninguém vê (ver o slide de FinOps).

      **O dev escolhe o tipo de ambiente, não onde ele roda.** O perfil (`ephemeral`) é o golden path do ambiente, definido pela plataforma: nuvem, região, tamanho, observabilidade e política de custo vêm nele. Pedir `--provider` ao dev contradiria a spec, que diz o que a app precisa sem dizer onde.

  - name: journey-release
    act: journey
    topic: "From idea to running product"
