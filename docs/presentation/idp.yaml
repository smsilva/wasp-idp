    audiences: [engineering, platform]
    message: "A que sistema pertence e de que tipo é."
    code: {file: snippets/catalog-info.yaml, focus: 6-7}
    dependsOn: [declare-name]
    notes: |-
      O que queremos dizer: **`system` posiciona a app na árvore** — liga ao System `greeter`, que liga ao Domain `communication`.

      `type: service` diz o tipo de Component: poderia ser `website` ou `library`.

      Fonte: references/backstage-catalog.md.

  - name: declare-ownership
    act: developer-control
    topic: "Software Catalog"
    audiences: [engineering, platform]
    message: "De quem é e em que ponto da jornada está."
    code: {file: snippets/catalog-info.yaml, focus: 8-9}
    dependsOn: [declare-system]
    notes: |-
      O que queremos dizer: **`owner` diz quem responde pela app** — liga ao Group `team-alpha`.

      `lifecycle: experimental` diz **o quanto dá para confiar** nela; para um Internal Product, em que ponto da jornada ele está.

      Fonte: references/backstage-catalog.md.

  - name: ip-lifecycle
    act: developer-control
    topic: "Software Catalog"
    message: "O lifecycle marca a jornada de um Internal Product: de ideia a produto compartilhado, até a descontinuação."
    heading: "Lifecycle of an Internal Product"
    screen: ["`experimental`: _an idea_ being built", "`production`: validated, _shared_ with the org", "`deprecated`: _being retired_"]
    notes: |-
      O que queremos dizer: **compartilhar com a organização é uma mudança de estado**, e o catálogo já tem o campo para isso.

      **Valores bem conhecidos do Backstage:** `experimental`, `production` e `deprecated`, no `spec.lifecycle` de Component, API, Resource e System. Hoje **todo o nosso catálogo está em `experimental`**.

      **Proposta** (ideia, não decidida):
      - `experimental`: o dono provisiona, testa e refina.
      - `production`: validado e **compartilhado**; outros times podem depender dele.
      - `deprecated`: em descontinuação; quem depende recebe aviso e prazo.

      **Subir para `production` pode virar gate da plataforma:** dono, observabilidade, custo atribuído e segurança em dia.

      Fonte: references/internal-products.md, https://backstage.io/docs/features/software-catalog/descriptor-format.
    dependsOn: [declare-ownership, idea-to-product]

  - name: declare-apis
    act: developer-control
    topic: "Software Catalog"
    audiences: [engineering, platform]
