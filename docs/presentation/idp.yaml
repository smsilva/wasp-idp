  - name: j-curve
    act: where-we-are
    topic: "MVP 1"
    audiences: [executive]
    message: "Espere a queda antes do ganho: a adoção de IA segue uma J-Curve."
    heading: "J-Curve"
    screen: ["**First:** a dip, then the gain", "**Why:** the verification tax", "**Plan:** budget it as tuition"]
    source: "DORA ROI of AI-assisted Software Development (2026), pp. 4, 8-10"
    notes: |-
      O que queremos dizer: a adoção de IA tem **uma queda antes do ganho**, e é preciso **orçar essa queda**.

      Siglas:
      - **DORA** (DevOps Research and Assessment): o programa de pesquisa por trás do relatório.
      - **ROI** (return on investment): retorno sobre o investimento.
      - **CFR** (change failure rate): taxa de falha de mudanças.

      **Citação** (DORA ROI, p. 4, p. 8-9): 'a temporary productivity dip and period of instability associated with early adoption. Think of this dip as the tuition cost of transformation.'

      **Três causas:**
      - learning curve
      - **verification tax** (revisar código gerado)
      - pipeline adaptation

      **Profundidade:** depende da 'baseline health of its internal developer platforms' (p. 10). Iniciativas **falham quando a liderança corta o investimento na queda** (p. 8).

      **Ressalva:** a curva é modelo conceitual; os números da calculadora (ROI 39%, CFR 5% → 6%) são **premissas ilustrativas**, não achados.

      Fonte: references/dora-roi-ai.md.
    dependsOn: [mvp1-level]

  - name: platform-api-next
    act: where-we-are
    topic: "Next steps"
    align: true
    message: "Próximo: uma Platform API como fronteira única, com uma identidade só para todos os clients."
    heading: "One API, one identity"
    screen: ["**API:** the single boundary", "**Identity:** `Keycloak` as broker", "**State:** the Kubernetes API"]
    notes: |-
      O que queremos dizer: **o próximo passo é a fronteira**: uma Platform API na frente de tudo, com identidade única.

      Siglas:
      - **JWT** (JSON Web Token): o token que a API valida.
      - **PKCE** (Proof Key for Code Exchange): login da CLI pelo navegador.

      **Platform API:** CLI, portal e agentes falam só com ela; Crossplane e Argo CD ficam atrás, como implementação.

      **Identidade:** Keycloak como broker — o Google autentica, o Keycloak guarda os grupos (`platform-admins`, `platform-users`), a API valida o JWT. A avaliação inicial com Dex foi descartada: o Dex não guarda usuários nem grupos.

      **Estado:** a API do Kubernetes como fonte da verdade (watch, `spec`/`status`, finalizers, RBAC); Postgres como journal e projeção para as consultas do portal.

      Decisões em proposta (ADR 0021 e 0022 no board).

      Fonte: references/current-state.md, references/sso-dex.md.
    dependsOn: [mvp1-level, single-sign-on, landscape-api]

  - name: next-steps
    act: where-we-are
    topic: "Next steps"
    align: true
    message: "Próximo: vários clients sobre a mesma plataforma."
    heading: "Many clients, one platform"
    screen: ["**CLI:** `platform login`, `whoami`", "**Portal:** catalog + plugins", "**Agent:** the catalog via `MCP`"]
    notes: |-
      O que queremos dizer: **vários clients sobre a mesma plataforma**.

      Siglas:
      - **MCP** (Model Context Protocol): como o agente lê o catálogo.
      - **CLI** (command-line interface): a interface de terminal.
      - **DORA ROI**: relatório DORA (DevOps Research and Assessment) sobre ROI (return on investment) de IA.

      **CLI:** a `platform` começa por `init`, `login` (PKCE e device code) e `whoami`, e cresce junto com as capacidades da API.

      **Portal:** o Backstage como **developer portal**: guarda o modelo mental humano (catálogo) e conversa com a plataforma por plugins — a próxima fatia é a aba Environments na página de Component.

      **Agente:** lê **o mesmo catálogo por MCP**.

      O catálogo exposto por MCP é a **context layer** que o DORA ROI manda construir primeiro (p. 44).

      Fonte: references/current-state.md, references/dora-roi-ai.md.
    dependsOn: [platform-api-next, catalog-as-context]

  - name: takeaways
    act: where-we-are
    topic: "Next steps"
    audiences: [executive]
    message: "Plataforma como produto, começando pela context layer, construída em fatias finas."
    heading: "What to take away"
    screen: ["**Build:** platform as a product", "**Start:** with the context layer", "**Grow:** in thin slices"]
    notes: |-
      O que queremos dizer: **três ideias para levar**.

      Siglas:
      - **DORA** (DevOps Research and Assessment): programa de pesquisa.
      - **ROI** (return on investment): retorno sobre o investimento.

      **Âncoras externas:** 'Quality internal platforms' é uma das **7 capacidades** do DORA AI Capabilities Model; DORA ROI (p. 49): 'the true risk for technology leaders is not failing at AI but failing to build the organizational system and culture that allow AI to deliver value.'

      **O papel do platform engineer está mudando:** **43%** esperam foco em governança e guardrails, **36%** em plataformas para agentes (State of AI, p. 44).

      **Adoção se conquista, não se impõe.** Em 'The platform engineering illusion', times que contam a outro time que a plataforma economizou um dia valem mais que um memorando — 'that word-of-mouth compounds in a way no mandate memo ever does'.

      Fonte: references/dora-ai-report.md, references/dora-roi-ai.md, references/state-of-ai-in-platform-engineering.md, references/platform-illusion.md.
    dependsOn: [next-steps]

