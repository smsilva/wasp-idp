  - name: golden-signals
    act: operate
    topic: "Runtime health"
    audiences: [engineering, platform]
    message: "Todo ambiente nasce observado pelos mesmos quatro sinais."
    heading: "Four golden signals"
    screen: ["**Latency:** time to serve a request", "**Traffic:** demand on the system", "**Errors:** rate of failed requests", "**Saturation:** how full the system is"]
    notes: |-
      O que queremos dizer: todo ambiente nasce observado pelos **mesmos quatro sinais**, sem o time ter de montar nada.

      **Google SRE book, cap. 6 'Monitoring Distributed Systems'** (Rob Ewaschuk): 'The four golden signals of monitoring are latency, traffic, errors, and saturation.' E: 'If you measure all four golden signals and page a human when one signal is problematic … your service will be at least decently covered.'

      **Alertar por sintoma** (o que quebrou), não por causa (por quê). A plataforma entrega esse mínimo pronto para todo ambiente e recurso que gera. Para um gateway de modelos como o LiteLLM: latência, requisições/tokens, erros e saturação.

      Fonte: references/golden-signals.md.
    dependsOn: [signals]

  - name: fitness-functions
    act: operate
    topic: "Runtime health"
    audiences: [platform]
    message: "A plataforma e cada ambiente que ela cria precisam provar, o tempo todo, que estão no estado desejado."
    heading: "Fitness functions"
    screen: ["**What:** checks the system _is still_ as declared", "**Example:**\n`echo` _returns_ HTTP 200 on every IP"]
    notes: |-
      O que queremos dizer: a plataforma e cada ambiente precisam **provar, continuamente, que ainda estão no estado desejado**.

      **Building Evolutionary Architectures** (Ford, Parsons, Kua; 2ª ed. com Sadalage), cap. 2: 'An architectural fitness function provides an objective integrity assessment of some architectural characteristic(s).'

      **Fundamentals of Software Architecture** (Richards, Ford) dá o vocabulário — escolher poucas characteristics (as três mais importantes) entre operational, structural e cross-cutting. Building Evolutionary dá o mecanismo para mantê-las ao longo do tempo (guarded evolution).

      **Exemplos que já existem na PoC:**
      - Condições Ready/Synced do Crossplane (contínua).
      - `echo` HTTP 200 em todos os IPs (holística).

      Os **golden signals** viram as fitness functions de runtime de cada ambiente. Com agentes, a fitness function que hoje alerta o humano **vira o feedback do validation loop** (slide `deterministic-gate`): 'first-pass failure is convergence, not defect' (State of AI, p. 30).

      Conferir a citação na edição do livro antes de pôr na tela.

      Fonte: references/fitness-functions.md.
    dependsOn: [golden-signals, iac]

  - name: data-ownership
    act: operate
    topic: "Runtime health"
    audiences: [platform]
    message: "O mesmo vale para dado: sem dono e sem contrato, ele falha em silêncio."
    heading: "Data ownership"
    screen: ["**Owner:** someone answers for the data", "**Contract:** schema, alerts, retention", "**Gate:** CI rejects a PR without it"]
    notes: |-
      O que queremos dizer: **dado sem dono e sem contrato falha em silêncio**; a plataforma exige os dois.

      **Tharun Mathew,** 'Platform teams own the pipeline. Nobody owns the data' (platformengineering.com, 2026-09-23): 'A service fails loudly and syntactically... A data system fails quietly and semantically.'

      **Proposta:** contrato de dado como infraestrutura declarativa, com a CI/CD (continuous integration/continuous delivery) rejeitando o pull request sem schema, roteamento de alerta e retenção.

      No caso do autor, achar o dono de um dataset caiu de **cerca de três dias para menos de uma hora**, e **um terço** dos datasets catalogados não tinha consumidor vivo — foram aposentados (mesmo raciocínio do ambiente ocioso, adiante).

      **Ressalva:** relato de um caso, não pesquisa.

      Fonte: references/data-ownership.md.
    dependsOn: [fitness-functions, entity-resource, major-breaking]

  - name: token-finops
    act: operate
    topic: "Cost & AI usage"
    audiences: [executive, platform]
    message: "Com IA, custo de token é sinal de operação como qualquer outro."
    heading: "Token spend"
    screen: ["**What:** an ops signal, like CPU", "**How:** tracked per team"]
    notes: |-
      O que queremos dizer: com IA, **gasto de token é sinal de operação**, atribuído por time.

      **State of AI Vol. 2, p. 35:** **13%** não rastreiam gasto de tokens e **14%** não sabem se alguém rastreia; só **17%** distribuem o custo por time.

      Gestão de custo de IA é um dos principais desejos dos times hoje — um gateway de modelos como o LiteLLM proxy entrega isso por time.

      Medir **'cost per accepted output'**, não custo por token (p. 36): valor, não volume.

      **DORA ROI** (p. 36): com a inferência cada vez mais barata, o custo real migrou para governança — verification tax, workflows e capacitação.

      Siglas:
      - **FinOps:** gestão financeira de custo de nuvem.
      - **DORA** (DevOps Research and Assessment).
      - **ROI** (return on investment).

      **Ressalva:** dado autorrelatado.

      Fonte: references/state-of-ai-in-platform-engineering.md, references/dora-roi-ai.md.
    dependsOn: [signals]

  - name: ai-gateway
    act: operate
    topic: "Cost & AI usage"
    audiences: [executive, platform]
    message: "Um gateway de modelos dá visibilidade antes de restringir."
    heading: "AI gateway"
    screen: ["**Problem:** 27% report significant shadow AI", "**First:** see the usage", "**Then:** block what's risky"]
    source: "State of AI in Platform Engineering, Vol. 2 (2026), p. 40"
    notes: |-
      O que queremos dizer: **um gateway de modelos dá visibilidade antes de restringir**.

      **Shadow AI** é o uso de ferramentas e modelos de IA fora do que a organização aprovou ou enxerga. A pesquisa pergunta quanto disso existe (State of AI Vol. 2, p. 40): **27%** admitem que é significativo, **47%** dizem que é mínimo e **8%** não têm visibilidade nenhuma.

      A recomendação do relatório é **'observability has to precede restriction'** (p. 41); **37%** governam por política e só **13%** bloqueiam.

      Um gateway de modelos como o LiteLLM proxy deixa de ser só gestão de custo: é o **ponto único de acesso a modelos**, com atribuição por time e trilha de auditoria.

      **Ressalva:** dado autorrelatado.

      Fonte: references/state-of-ai-in-platform-engineering.md.
    dependsOn: [token-finops]

  - name: idle-environments
    act: operate
    topic: "Cost & AI usage"
    audiences: [executive, platform]
    message: "A plataforma percebe o ambiente esquecido e pergunta ao dono se ainda precisa dele."
    heading: "Idle environments"
    screen: ["**Signal:** unused, still costing", "**Action:** ask the owner before deleting"]
    notes: |-
      O que queremos dizer: a plataforma percebe o ambiente esquecido, e **o dono decide se ele fica**.

      **Caso real:** o Fury, IDP (Internal Developer Platform) do Mercado Livre, monitora se um ambiente provisionado não está sendo usado e **sugere a exclusão ao owner**.

      É a resposta ao 'puppy for Christmas': o recurso não fica abandonado depois do clique. Só funciona porque **o catálogo sabe quem é o dono**. A plataforma sugere, o dono decide — **guardrail, não gate**.

      No MVP 1 cada Environment é um cluster EKS com custo correndo, então ambiente ocioso é **custo sem valor**.

      É também um exemplo do Level 3 (ato seguinte): agir a partir de um sinal observado, com o humano decidindo por exceção.

      Fonte: references/mercadolibre-fury.md, https://www.youtube.com/watch?v=aFJTxKak6sM.
    dependsOn: [token-finops, puppy-for-christmas, catalog-ownership]

  - name: platform-as-product-signals
    act: operate
    topic: "Platform as a product"
    audiences: [executive, platform]
    message: "A plataforma também se observa como produto: satisfação, onde o dev desiste e quando ele a contorna."
    heading: "The platform measures itself"
    align: true
    screen: ["**Satisfaction:** NPS at key moments", "**Behavior:** session replay", "**Drop-off:** funnel per offer", "**Bypass:** how often devs route around it"]
    notes: |-
      O que queremos dizer: **o que a plataforma mede é a experiência do dev**, não o volume de uso.

      **Caso real:** a Stone, no IDP (Internal Developer Platform) Caravela, usa Hotjar para **NPS** (Net Promoter Score) em momentos-chave, gravação de sessão e análise de cliques (31:05–35:00). Usa Amplitude para **funis de conversão de cada oferta** — os templates de provisionamento —, mostrando onde o dev abandona o fluxo (35:30–43:00).

      É a **user observability** do Platform as a Product (pp. 17-18) na prática; evita **vanity metrics** (p. 35), como número de serviços no catálogo ou page views do portal.

      Mesma ideia em 'The empathy gap' (platformengineering.org): **medir o sentimento do dev** junto com as métricas **DORA** (DevOps Research and Assessment).

      **Bypass:** quantas vezes o dev **contorna a plataforma**. Para 'The platform engineering illusion', é 'the platform's real adoption curve', e quase nunca está no dashboard mostrado à liderança.

      Fonte: references/stone-caravela.md, references/platform-as-a-product.md, references/empathy-gap.md, https://www.youtube.com/live/xACNR0cBzTQ, references/platform-illusion.md.
    dependsOn: [platform-as-product, signals]

  - name: north-star-metric
    act: operate
    topic: "Platform as a product"
    audiences: [executive, platform]
    message: "A métrica que importa: quantos dias um dev novo leva para mergear o 10º pull request."
    heading: "Days until a new hire merges their 10th PR"
    align: true
    screen: ["**Spotify, before:** 60 days", "**Spotify, after Backstage:** under 20 days"]
    source: "Spotify, How we measure Backstage success (2021, updated 2026)"
    notes: |-
      O que queremos dizer: a métrica que importa **mede a complexidade que o dev novo enfrenta**, não o uso do portal.

      Siglas:
      - **PR** (pull request).
      - **KPI** (Key Performance Indicator).
      - **MTTR** (Mean Time To Recovery).
      - **eNPS** (employee Net Promoter Score).

      **Onboarding time:** quantos dias um dev recém-chegado leva até mergear o **10º PR**. No Spotify tinha chegado a **60 dias**; com o Backstage, caiu para **menos de 20** (blog 'How we measure Backstage success at Spotify', Helen Greul, 2021, atualizado em 2026).

      A doc oficial do Backstage ('Strategies for adopting', seção KPIs and metrics) cita a mesma métrica com **queda de 55%** dois anos após a adoção. **São números de momentos diferentes:** citar a fonte do número usado.

      É proxy da **complexidade do ecossistema**, não de uso do portal.

      **Ressalvas para o apresentador:**
      - A própria Pia Nilsson (Spotify) disse que falta nuance e que a métrica foi copiada da Meta.
      - É o caso de quem criou o Backstage.

      **Outros KPIs da doc:** deploys, MTTR, context switching, eNPS, fragmentação.

      **Para esta plataforma,** candidata: tempo do pedido de um Environment até a primeira URL respondendo.

      Fonte: references/adoption-metrics.md.
    dependsOn: [platform-as-product-signals]

  - name: dora-metrics
    act: operate
    topic: "Platform as a product"
    audiences: [executive, engineering, platform]
    message: "Para a entrega, o mercado já tem a régua: as métricas DORA."
    heading: "DORA metrics"
    screen: ["**Lead time:** commit to production", "**Deploy frequency:** how often", "**Recovery time:** after a failed deploy", "**Change fail rate:** deploys that fail", "**Rework rate:** unplanned deploys after incidents"]
    notes: |-
      O que queremos dizer: para a entrega, **já existe régua de mercado**: as métricas DORA (DevOps Research and Assessment).

      DORA (dora.dev, 2026):
      - **Throughput:** change lead time, deployment frequency, failed deployment recovery time.
      - **Instability:** change fail rate, deployment rework rate.

      Eram quatro ('four keys'); **hoje são cinco**, e recovery time substituiu o **MTTR** (Mean Time To Recovery). A plataforma coleta e devolve ao portal por plugin.

      **Guia do próprio DORA:** não virar meta, não comparar times nem aplicações diferentes, não medir por uma métrica só.

      Complementa o **time to 10th PR** (onboarding; PR = pull request) e o **sentimento do dev** (empathy gap).

      Fonte: references/dora-metrics.md.
    dependsOn: [north-star-metric]

  - name: feature-flags
    act: operate
    topic: "Platform as a product"
    audiences: [platform]
    message: "Funcionalidade nova da plataforma chega aos poucos, sem segurar o release."
    heading: "Gradual delivery"
    align: true
    screen: ["**Feature flags:** turn on per user", "**A/B tests:** compare two versions", "**Rollout:** a few users first"]
    notes: |-
      O que queremos dizer: **funcionalidade nova da plataforma chega aos poucos**, sem segurar o release.

      A Stone usa a parte de experimentação do Amplitude para **feature flags e testes A/B**: SDK (Software Development Kit) no IDP (Internal Developer Platform) e hooks no frontend condicionam o comportamento. O **rollout é gradual** e o release não espera (59:00–1:03:00).

      Fonte: https://www.youtube.com/live/xACNR0cBzTQ (references/stone-caravela.md).
    dependsOn: [platform-as-product-signals]

  - name: landscape-sec-1
    act: operate
    topic: "Guardrails"
    message: "Security também atravessa tudo: código, segredos, identidade, política e rede."
    heading: "Guarding every plane"
    divider: "Security"
    diagram: "diagrams/landscape/landscape.svg"
    show: [dev-plane, ind-plane, res-plane, obs-plane, sec-plane]
    dim: [dev, ind, res, obs]
    start: "empty"
    reveal: [sec.1, sec.2, sec.3, sec.4, sec.5]
    accumulate: true
    source: "platformengineering.org/platform-tooling · planes as parallel layers; the journey order is ours"
    notes: |-
      O que queremos dizer: **segurança atravessa todos os planes**; cada risco tem seu guardrail.

  - name: guardrails
    act: operate
    topic: "Guardrails"
    audiences: [platform]
    message: "Código, segredos, identidade, política e rede — cada um com seu guardrail."
    align: true
    heading: "One guardrail per risk"
    screen: ["**Code:** `SonarQube`, `Snyk`", "**Secrets:** `Key Vault`", "**Identity:** `Auth0`", "**Policy:** `Kyverno`, `Azure Policy`", "**Network:** `Cilium`"]
    notes: |-
      O que queremos dizer: **segurança atravessa todos os planes**: cada risco tem seu guardrail.

      Segurança não é um passo no fim. **Guardrails, não gates.**

      **Prisma Cloud** como suíte transversal. São as tools da arquitetura de referência (slide 2 do deck base).

      **Segurança entra no design, não na auditoria.** Em 'The platform engineering illusion', requisito de segurança que chega depois do lançamento é remendado e piora a experiência; o dev aprende que a plataforma é **'where good ideas go to get slower'**. Policy-as-code e segurança no template desde o primeiro desenho.

      Fonte: references/base-deck.md, references/platform-illusion.md.

  - name: single-sign-on
    act: operate
    topic: "Identity & access"
    audiences: [platform]
    message: "Vários clients exigem uma identidade só: quem é você e o que pode ver e fazer, igual em todo lugar."
    heading: "Single sign-on"
    screen: ["**What:** one login for every client", "**Result:** same permissions everywhere"]
    notes: |-
      O que queremos dizer: portal, CLI, Argo CD, LiteLLM e clusters precisam da **mesma identidade e dos mesmos grupos**.

      Siglas:
      - **CLI** (command-line interface).
      - **EKS** (Elastic Kubernetes Service) e **AKS** (Azure Kubernetes Service).
      - **OIDC** (OpenID Connect).

      Vários clientes — portal, CLI, Argo CD, LiteLLM e o acesso aos clusters (**EKS hoje; AKS e GCP no futuro**) precisam da mesma autenticação e dos mesmos grupos.

      **Login direto no GitHub resolve só o portal:** GitHub OAuth não é **OIDC** para usuários, e o EKS não o aceita.

      Fonte: references/sso-dex.md.
    dependsOn: [guardrails]

  - name: one-issuer
    act: operate
    topic: "Identity & access"
    audiences: [platform]
    message: "Um único emissor de tokens para toda a plataforma; a origem da identidade é um conector trocável."
    heading: "One token issuer"
    align: true
    screen: ["**What:** one OIDC issuer for the platform", "**Source:** a swappable connector", "**Candidate:** `Dex` _(first evaluation)_"]
    notes: |-
      O que queremos dizer: **um único emissor de tokens**; trocar a origem da identidade não mexe em nenhum client.

      Siglas:
      - **OIDC** (OpenID Connect).
      - **ADR** (Architecture Decision Record): uma decisão de arquitetura.
      - **PoC** (proof of concept).
      - **CLI** (command-line interface).
      - **EKS** (Elastic Kubernetes Service).

      **Avaliação inicial** (ADR proposto numa PoC de referência; nesta plataforma, substituído por Keycloak — ver o fechamento): Dex standalone como único OIDC issuer, com um client por consumidor — portal, CLI (PKCE), Argo CD e clusters (EKS registra o Dex como OIDC identity provider).

      **Trocar a fonte** (GitHub, Entra ID, Google Workspace, LDAP) **é trocar o connector**; nenhum client muda.

      **O inverso é caro:** trocar o issuer mexe em todos os clients e clusters. Por isso o IdP de produção se escolhe antes de multiplicar clusters.

      **Alternativas descartadas:** Cognito (não federa GitHub, issuer preso à AWS) e o Dex embutido do Argo CD (acoplado ao ciclo de vida dele).

      Fonte: references/sso-dex.md.
    dependsOn: [single-sign-on]

  - name: who-decides
    act: operate
    topic: "Identity & access"
    audiences: [platform]
    message: "No portal, quem decide é o catálogo; no cluster, é o grupo que vem no token."
    heading: "Who decides access"
    screen: ["**Portal:** the catalog", "**Cluster:** the groups in the token"]
    notes: |-
      O que queremos dizer: **cada lado decide com o que conhece**: o portal pelo catálogo, o cluster pelo token.

      **Portal:** o login casa com a entidade `User` do catálogo; o ownership sai do `memberOf` (teams ingeridos da fonte de identidade).

      **Cluster:** o API server do Kubernetes não conhece o catálogo, então decide pelo **claim `groups`**. Os dois só divergem no intervalo de sync — **aceito**.

      Liga de volta ao ato do catálogo: `User` e `Group` também são entidades.

      Fonte: references/sso-dex.md.
    dependsOn: [one-issuer, catalog-ownership]

  - name: break-glass
    act: operate
    topic: "Identity & access"
    audiences: [platform]
    message: "O acesso de emergência nunca depende do próprio SSO."
    heading: "Break-glass"
    screen: ["**What:** emergency access", "**How:** via IAM, never via SSO"]
    notes: |-
      O que queremos dizer: **o acesso de emergência nunca depende do próprio SSO** (Single Sign-On).

      **Dex:** roda no hub como componente do **Security Plane** (não acessório do portal), com issuer estável (`id.<domínio>`) independente de onde roda.

      **Break-glass:** todo cluster, inclusive o hub, mantém acesso administrativo via **IAM** (Identity and Access Management; EKS access entries). Se o hub cair, **nenhum token novo é emitido**; os clusters seguem rodando e o break-glass cobre o intervalo.

      Fonte: references/sso-dex.md.
    dependsOn: [one-issuer]

  - name: audit-trail
    act: operate
    topic: "Identity & access"
    audiences: [executive, platform]
    message: "Quem fez o quê fica registrado fora do catálogo, com uma chave que não muda."
    heading: "Audit trail"
    screen: ["**Key:** the immutable account ID", "**Where:** outside the catalog"]
    notes: |-
      O que queremos dizer: **quem fez o quê fica registrado fora do catálogo**, com uma chave que não muda.

      **Chave:** o login pode ser renomeado e reaproveitado por outra pessoa; a chave imutável é o **ID numérico da conta**. A cada login, o par login ↔ ID vai para um **audit sink**.

      **Trilha:** o **journal da Platform API** (append-only, cada pedido com spec, autor e horário, gravado antes de ser aplicado), os audit logs do cluster e os events do Argo CD e do Crossplane — tudo num **sink central no Observability Plane**. GitOps fica como evolução possível, trocando o `StateWriter`. **O catálogo não é trilha de auditoria.**

      Fonte: references/sso-dex.md, docs/adr/0022-kube-api-as-platform-source-of-truth.md.
    dependsOn: [who-decides]

  - name: agent-identity
    act: operate
    topic: "Identity & access"
    audiences: [executive, platform]
    message: "Agentes também precisam de identidade própria — e hoje a maioria empresta a de alguém."
    heading: "Agent identity"
    screen: ["**Today:** 25% lend agents a human's login", "**Needed:** an identity of their own"]
    source: "State of AI in Platform Engineering, Vol. 2 (2026), p. 38"
    notes: |-
      O que queremos dizer: **agente precisa de identidade própria**; hoje um em cada quatro empresta a de uma pessoa.

      **O que a pesquisa mostra:** como as identidades de IA são geridas na plataforma (Figure 16, State of AI Vol. 2, p. 38).
      - **25%** entregam aos agentes as credenciais de uma pessoa.
      - **12%** compartilham uma única service account entre todas as tools de IA.
      - **18%** não sabem.
      - **Menos de um em três** dá ao agente uma identidade própria com escopo; outras **19%** gerenciam essa identidade dinamicamente por política.

      **Por que importa:** um agente com o login de uma pessoa **não pode ser auditado, ter o escopo limitado nem ser desligado** sem desligar quem o emprestou (p. 38).

      **Identidade com escopo** é um dos quatro pré-requisitos do Level 3 (p. 10, p. 50). Reforça o slide anterior: a identidade única também precisa cobrir agentes.

      **Ressalva:** dado autorrelatado.

      Fonte: references/state-of-ai-in-platform-engineering.md.
    dependsOn: [single-sign-on]

  # ── Platform API ────────────────────────────────────
  - name: landscape-api
    act: api
    topic: "One API"
    message: "Uma Platform API envolve os cinco planes — é por ela que tudo entra."
    heading: "One API in front of every plane"
    diagram: "diagrams/landscape/landscape.svg"
    show: [dev-plane, ind-plane, res-plane, obs-plane, sec-plane, dev, ind, res, obs, sec]
    reveal: [api]
    source: "platformengineering.org/platform-tooling · planes as parallel layers; the journey order is ours"
    notes: |-
      O que queremos dizer: **uma API única na frente dos cinco planes**.

      Esta camada é **proposta nossa**, não faz parte do landscape de referência: quem pede algo à plataforma fala com a API, nunca direto com uma ferramenta.

  - name: landscape-clients
    act: api
    topic: "Clients"
    message: "IDE, CLI, Portal e agentes são clientes da mesma API."
    heading: "Many clients, one API"
    diagram: "diagrams/landscape/landscape.svg"
    show: [dev-plane, ind-plane, res-plane, obs-plane, sec-plane, dev, ind, res, obs, sec, api]
    reveal: [clients.1, clients.2, clients.3, clients.4]
    accumulate: true
    source: "platformengineering.org/platform-tooling · planes as parallel layers; the journey order is ours"
    notes: |-
      O que queremos dizer: **as interfaces viram clientes da API**, inclusive o Portal.

      Os exemplos são **ilustrativos**: a CLI `platform` não existe com esses verbos; é a forma que propomos.

      **A plataforma é o contrato, não a interface:** todos consomem a mesma API, e a plataforma **não mora em nenhuma das interfaces**. A CLI e as mensagens de erro também são UX (User Experience): **nenhum client é cidadão de segunda classe.**

      Fonte: references/poc.md, references/empathy-gap.md.

  - name: editor-and-agent
    act: api
    topic: "Clients"
    audiences: [engineering, platform]
    message: "O dev começa no editor — e cada vez mais com um agente ao lado."
    heading: "Where developers work"
    align: true
    screen: ["**Editor:** `VS Code`", "**Terminal:** `platform CLI`", "**Agent:** `Claude Code`"]
    dependsOn: [landscape-clients]
    notes: |-
      O que queremos dizer: a plataforma **encontra o dev onde ele já trabalha**: editor, terminal e agente.

      Categorias IDE/CDE e Copilots/Agents/LLM do deck base, mais o terminal: a **CLI** (command line interface) da plataforma é o que o dev usa sem sair do fluxo. O agente muda a interface: **o pedido passa a ser em linguagem natural**.

      São os clientes do desenho: editor, CLI e agente falam com a mesma API que o portal.

      State of AI Vol. 2, p. 43: agentes já são clientes da plataforma em **29%** das organizações — a plataforma precisa servir humanos e agentes.

      Fonte: references/base-deck.md, references/state-of-ai-in-platform-engineering.md.

  - name: portal
    act: api
    topic: "Clients"
    message: "Antes de criar, o dev precisa descobrir o que já existe: o portal é a vitrine da plataforma."
    heading: "Discovery first"
    screen: ["**Question:** what already exists?", "**Tool:** `Backstage`"]
    dependsOn: [landscape-clients]
    notes: |-
      O que queremos dizer: **antes de criar, o dev precisa descobrir o que já existe**.

      Pergunta que motiva o portal. Sem descoberta, **cada time recria o que outro já tem**.

      Categoria Portal: catálogo, templates, docs e plugins.

      **Atenção:** o portal é a vitrine, não a plataforma — o mesmo ponto do slide do orquestrador ('platform façade').

      Fonte: references/base-deck.md.

  - name: portal-is-not-platform
    act: api
    topic: "Clients"
    message: "Portal e plataforma não são a mesma coisa: o portal é a interface, a plataforma é o que está atrás dela."
    heading: "Portal is not the platform"
    screen: ["**Portal:** the interface", "**Platform:** the capabilities behind it"]
    notes: |-
      O que queremos dizer: **o portal é a interface; a plataforma é o que está atrás dela**.

      Guia da Port 'The practical guide to internal developer portals' (2024), pp. 6-7: **'An internal developer platform is necessary but not sufficient'** — precisa de uma interface com as abstrações certas para o dev. E: 'the portal can't dictate the organization's use cases and priorities' (p. 7).

      Fecha dois fios: o portal é **um dos clientes** da API, e portal sem orquestração atrás é fachada (`platform-facade`).

      Definições curtas e citáveis (configure8, 2023):
      - **Plataforma:** 'the collection of tooling built by platform engineers and used by developers'.
      - **Portal:** 'the singular interface to your developer platform'.

      Discordar em voz alta do 'singular': aqui **o portal é uma das interfaces** (próximos slides).

      Definição da Gartner, citada em internaldeveloperplatform.org: 'Internal developer portals serve as the interface through which developers can discover and access internal developer platform capabilities.'

      **Ressalva:** Port e configure8 vendem portal; os dois textos são portal-cêntricos.

      Fonte: references/port-portal-guide.md, references/configure8-portal-vs-platform.md, references/internaldeveloperplatform-org.md.
    dependsOn: [portal, platform-facade]

  - name: cli-example
    act: api
    topic: "Clients"
    audiences: [engineering, platform]
    message: "Uma boa CLI mostra as mesmas entidades do portal — para gente, para pipeline e para agente."
    heading: "What a good platform CLI does"
    screen: ["**Query:** entities by type and owner", "**Output:** a table for humans, JSON for pipelines", "**Same API:** behind the CLI and the agent (MCP)"]
    notes: |-
      O que queremos dizer: **a CLI não é um atalho improvisado, é um client de primeira classe**, com as mesmas entidades do portal.

      Siglas:
      - **CLI** (Command Line Interface).
      - **IaC** (Infrastructure as Code).
      - **MCP** (Model Context Protocol).

      **Exemplo:** a CLI do formae (IaC open source da Platform Engineering Labs; a release 0.88 redesenhou a CLI).

      **Comandos:**
      - `formae inventory resources --query "type:AWS::S3::Bucket stack:prod"` lista entidades por tipo com filtro `key:value`.
      - `--output-consumer machine` troca a tabela por **JSON para pipeline**.
      - **O mesmo agente** atende a CLI e um servidor MCP para Claude Code.

      Propriedades tipadas viram flags **validadas antes de tocar a nuvem**, e o apply **sempre simula antes**.

      **Inspiração para a CLI da plataforma:** listar Environments por owner, saída JSON, simular antes de aplicar. A forma que propomos, `platform <recurso> <verbo>`, aparece na jornada a seguir — com comandos **ilustrativos**.

      **Ressalva:** formae é ferramenta de IaC, não portal — o paralelo é de design de CLI.

      Fonte: references/formae-cli.md.
    dependsOn: [landscape-clients]

  - name: catalog-as-context
    act: api
    topic: "Clients"
    audiences: [engineering, platform]
    message: "O mesmo catálogo serve o portal, a CLI e o agente."
    heading: "One catalog"
    screen: ["**Portal:** for humans", "**CLI:** for scripts and pipelines", "**MCP:** for agents"]
    notes: |-
      O que queremos dizer: **as três portas leem o mesmo dado**. Quem é dono, do que a app depende e quais APIs ela oferece têm **uma resposta só**, seja no browser, no terminal ou no agente.

      Siglas:
      - **MCP** (Model Context Protocol): como o agente acessa ferramentas e dados.
      - **CLI** (command-line interface): a porta para scripts e pipelines.
      - **LLM** (large language model): o modelo que o agente usa.
      - **DORA ROI**: relatório do DORA (DevOps Research and Assessment) sobre retorno de investimento em IA.

      **CLI:** leva o catálogo para a automação. Um script ou pipeline **consulta o owner de um serviço** para abrir um alerta, ou lista os Components de um System antes de um deploy, sem ninguém abrir o portal.

      **MCP:** é Backstage **upstream (não vendor)**. Desde a **v1.40.0 (2025-06-17)** o plugin `mcp-actions-backend` expõe as actions do catálogo como MCP tools: `get-catalog-entity`, `query-catalog-entities` (inclusive filtro por `relations.ownedby`) e `get-catalog-model-description` ('useful for informing LLMs'). O mesmo permission framework do portal filtra as tools do agente.

      **DORA ROI (p. 44):** o primeiro investimento é a **context layer**, para os agentes terem 'a clear, standardized map of the organization's technical landscape' — é a descrição do catálogo.

      **Ressalva:** o plugin ainda é **0.x** e nasceu 'highly experimental'.

      Fonte: references/mcp-platform-interface.md, references/dora-roi-ai.md.
    dependsOn: [cli-example]

  - name: context-next-to-code
    act: api
    topic: "Clients"
    audiences: [engineering, platform]
    message: "O repo diz ao agente como trabalhar no código: comandos, convenções e guardrails."
    heading: "What the repo tells the agent"
    screen: ["**Commands:** how to build, test and run", "**Conventions:** what is not obvious from the code", "**Guardrails:** what the platform forbids"]
    notes: |-
      O que queremos dizer: o agente precisa saber trabalhar no código, e isso **mora num arquivo versionado junto dele, o `AGENTS.md`**.

      **`AGENTS.md`:** 'a simple, open format for guiding coding agents', mantido pela **Agentic AI Foundation** (Linux Foundation) junto com o **MCP** (Model Context Protocol) desde **2025-12-09**.

      **`CLAUDE.md`:** tem hierarquia (managed policy, user, project, local) — a camada org-wide é da plataforma. O **golden path gera os dois arquivos** ao criar o repo.

      **Divisão de papéis:** o `catalog-info.yaml` descreve a app para o portal; o `AGENTS.md` orienta o agente no código; o que o agente precisa saber do catálogo ele consulta pelo MCP (slide anterior). **Arquivo diz como; MCP responde o quê, agora.**

      Conteúdo curto e específico (comandos, convenções não óbvias), não overview do repo.

      **Ressalva honesta:** três estudos no arXiv **não mostram ganho de acerto** (Gloaguen: custo +20%; Khatri: sem efeito mensurável); o ganho medido é de **eficiência** (Lulla: runtime mediano -28,64%).

      Fonte: references/agents-md.md.
    dependsOn: [catalog-as-context, declare-name]

