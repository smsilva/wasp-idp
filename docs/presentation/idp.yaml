  - name: release-rings
    act: integration-delivery
    topic: "Delivery"
    message: "Com centenas de ambientes, a versão nova chega em anéis — e a plataforma para e volta sozinha quando um sinal piora."
    heading: "Rollout in rings"
    screen: ["**Today:** a daily train to hundreds of environments", "**Rings:** dev → early adopters → production waves", "**Guard:** _stop_ and _roll back_ on bad signals"]
    notes: |-
      O que queremos dizer: um release train diário já é GitOps com muita automação; **o próximo passo é entregar por anéis**, com a plataforma vigiando os sinais entre um anel e o próximo.

      **Cenário comum:** um release train diário. Versões novas se acumulam num PR, a janela abre em horário comercial e **o approve do time libera o trem**; o Argo CD aplica em **centenas de ambientes**. Segurar o trem é não aprovar. É um mecanismo que funciona.

      **O que ainda é manual:** a validação depois do deploy (health checks, logs, relatos do suporte) e o **rollback**, feito por PR revertendo os manifests. O risco é o rollback parcial, quando só parte dos ambientes já foi atualizada.

      **Proposta** (ideia, não decidida):
      - **Anel 0:** dev e homolog.
      - **Anel 1:** early adopters, times que aceitam receber primeiro.
      - **Anéis seguintes:** produção em ondas crescentes.
      - Entre anéis, **verificação em tempo real** (golden signals, erros): a plataforma **para o rollout** e **faz rollback** do anel afetado sozinha — duas capacidades que hoje não existem.

      Fonte: references/golden-signals.md.
    dependsOn: [gitops, one-size-environment]

  - name: ci-bottleneck
    act: integration-delivery
    topic: "Verification before the PR"
    audiences: [executive, platform]
    message: "Com agentes, a CI virou o gargalo — e acelerá-la não muda o que ela verifica."
    heading: "CI became the bottleneck"
    screen: ["**Example:**\n`Anthropic`: CI jobs _grew_ 25x with agents", "**But:** green CI _is not_ a working system"]
    source: "The New Stack (2026-10-04), sponsored by Signadot"
    notes: |-
      O que queremos dizer: agentes multiplicaram o volume de mudanças, e a **CI** (continuous integration) — que roda tarde e com o resto mockado — **não acompanha nem verifica o que importa**.

      **O 25x não é pesquisa:** é o caso de uma empresa, a Anthropic, citado num artigo. Mede o volume de jobs de CI depois que agentes passaram a abrir mudanças. Arjun Iyer, The New Stack, 2026-10-04: 'Agents pushed CI job volume up 25x at Anthropic'; no Linear a suíte de testes 'has nearly quadrupled since January'.

      A CI roda **depois do PR** (pull request; o agente já perdeu o contexto) e checa um repo com o resto mockado, enquanto **as falhas reais vivem nas fronteiras entre serviços**.

      'Making the gate faster does not change what it checks.'

      A fonte primária, **DORA** (DevOps Research and Assessment) 2025 (p. 4), confirma: 'AI adoption now improves software delivery throughput, a key shift from last year. However, it still increases delivery instability.'

      Liga com o State of AI: só **17%** têm validation loops automatizados (p. 26).

      **Ressalva:** post patrocinado pela Signadot, que vende a solução dos próximos slides.

      Fonte: references/sandbox-routing.md, references/dora-ai-report.md.
    dependsOn: [gitops, rebuild-platform]

  - name: request-sandbox
    act: integration-delivery
    topic: "Verification before the PR"
    audiences: [platform]
    message: "Verificar antes do PR, contra o sistema real: só a requisição marcada passa pela versão em teste."
    heading: "Request sandbox"
    screen: ["**What:** only tagged requests _hit_ the new version", "**How:** the tag _travels in_ `OTel` baggage", "**Cost:** ~1 pod"]
    notes: |-
      O que queremos dizer: dá para **verificar antes do PR, contra o sistema real**, subindo só o serviço alterado.

      Siglas:
      - **OTel** (OpenTelemetry): padrão de instrumentação; o Baggage carrega o header de sandbox entre serviços.
      - **PR** (pull request).

      **Roteamento:** num cluster compartilhado com as versões estáveis, sobe só o serviço alterado (C'). A regra do mesh (Istio VirtualService + DestinationRule) manda para ele **apenas as requisições com o header de sandbox**; o resto segue para o estável.

      **Custo:** cerca de **um pod**, sobe em segundos; cinquenta agentes compartilham um ambiente em vez de clonar cinquenta.

      **Ponto crítico:** o header precisa ser propagado por **TODOS os serviços** (OpenTelemetry Baggage faz isso nos SDKs instrumentados). Um serviço que não propaga quebra o roteamento em silêncio, por isso vira fitness function de 'good citizen'.

      Cuidados: mensageria, dados com efeito colateral, waypoint no ambient mode, gateway validando o header.

      Fonte: references/sandbox-routing.md.
    dependsOn: [ci-bottleneck]

  - name: environment-vs-sandbox
    act: integration-delivery
    topic: "Verification before the PR"
    audiences: [platform]
    message: "A plataforma oferece os dois: ambiente completo para mudar a infra, sandbox por requisição para mudar o serviço."
    heading: "Two ways to verify"
    screen: ["**Full environment:** minutes, for infra changes", "**Request sandbox:** seconds, for service changes"]
    notes: |-
      O que queremos dizer: **a plataforma oferece os dois**, e o tipo de mudança escolhe qual usar.

      **Ambiente efêmero completo:** o Environment do MVP 1 é um cluster EKS inteiro, **~28-30 min**. Isolamento total, caro, necessário para mudanças de infra e da própria plataforma.

      **Sandbox por requisição:** **~um pod, segundos**, testa as fronteiras reais; exige propagação de contexto.

      A verificação é governada pela plataforma: passos aprovados escritos uma vez, chamados pelo agente via skills e hooks (Claude Code, Cursor). O registro do que foi testado serve de evidência no review e no merge gate — **a CI vira confirmação**.

      Build vs. buy (Signadot × Istio + OTel) em aberto.

      Siglas:
      - **EKS** (Elastic Kubernetes Service).
      - **CI** (continuous integration).
      - **OTel** (OpenTelemetry).

      Fonte: references/sandbox-routing.md.
    dependsOn: [request-sandbox, iac]

