# Campos por slide:
#   name       slug estável (referenciado por dependsOn; reordenar não quebra)
#   act        nome do ato
#   audiences  públicos para os quais o slide é mais relevante; ausente = todos
#   dependsOn  slides que precisam ter sido vistos antes (o encadeamento do raciocínio)
#   heading    título do slide: aparece sozinho no 1º passo e fica no alto, esmaecido, enquanto os itens de screen entram
#   source     origem curta mostrada no rodapé do slide (obrigatória quando há número na tela)
#   align      true: itens **Rótulo:** valor viram tabela invisível (valores alinhados à esquerda)
#   subitems   together: subitens "- " de um valor aparecem todos de uma vez (default: um por passo)
#   code       {file, lines?, focus?}: bloco de código estilo IDE no lugar de `screen`;
#              `focus` realça linhas e esmaece o resto (mostrar um arquivo por partes)
# Idioma: `screen` (keywords) em inglês; `message` e `notes` em pt-BR.





slides:
  # ── Abertura ────────────────────────────────────────
  - name: title
    act: opening
    animations: none
    message: "Construir um IDP é uma jornada compartilhada, com objetivos claros — não um desenho a entregar."
    screen: ["Internal Developer Platform"]
    subtitle: "A shared journey to a platform for humans and agents"
    notes: |-
      O que queremos dizer: **construir um IDP não é implantar o desenho final**. É uma jornada que fazemos juntos, com objetivos claros e um primeiro passo já entregue.

      **Quando começamos, a ideia era mostrar o desenho dos 5 planes.** No caminho ficou claro que ele envolve muito mais: catálogo e ownership, contratos e gates, identidade, custo, segurança, e agentes como novos usuários da plataforma.

      **Roteiro:** o problema, cada plane peça por peça, a API e seus clientes, a jornada da ideia ao `curl`, o desenho completo, o que muda com agentes, e onde estamos hoje com o MVP 1 e os próximos passos.

      **Objetivo:** alinhar o que a plataforma é e o que não é, e sair daqui com aliados.

  # ── O problema ──────────────────────────────────────
  - name: delivery-friction
    act: problem
    topic: "Our starting point"
    message: "Times de infraestrutura cuidam da infra para os times de aplicação — e quem tem uma ideia ainda precisa pedir a outro time."
    heading: "Asking for infrastructure today"
    screen: ["**Request:** to another team", "**Receives:** a whole environment", "**Knowledge:** documented, _not self-service_"]
    notes: |-
      O que queremos dizer: **o dev não carrega a infra sozinho** — um time de infraestrutura cuida dela. O que ainda pesa é o caminho: **quem tem uma ideia precisa pedir**, e recebe o pacote que existe.

      **Pedido:** mesmo quando a criação de um ambiente já é automatizada para quem opera (um PR conduzido por um operator, por exemplo), continua sendo um pedido a outro time, que precisa ter agenda.

      **O que se recebe:** um **ambiente inteiro** (rede, gateway, apps, mensageria). Um recurso avulso, como um banco ou uma fila, segue outro caminho, também por pedido.

      **Conhecimento:** o "como se faz" está escrito — how-tos, runbooks — e parte dele já roda sozinho. Mas foi escrito **para quem opera**: quem tem a ideia não o executa por conta própria. A plataforma leva esse mesmo conhecimento a um **golden path** que o dev usa sem pedir — e que um agente também usa, porque ele **só usa o que está escrito num formato que a máquina lê** (DORA, p. 41). DORA = DevOps Research and Assessment.

      Pedir à plateia um exemplo próprio funciona bem aqui.

      Fonte: references/dora-roi-ai.md.

  - name: one-size-environment
    act: problem
    topic: "Our starting point"
    message: "O modelo de um ambiente completo por cliente funciona e escala; o uso mudou, e o pacote ficou grande para o uso mais comum de hoje."
    heading: "One environment fits all"
    screen: ["**Works:** one isolated environment per client", "**Shape:** the full stack, every time", "**Today:** many only need `LiteLLM` for `Claude Code`"]
    notes: |-
      O que queremos dizer: um modelo comum de plataforma interna — **um ambiente completo e isolado por cliente** — **funciona e escala**. O que muda é o uso: hoje muitos só querem apontar o Claude Code para um gateway de modelos (LiteLLM), e **recebem o ambiente inteiro**.

      **Forma:** cada ambiente sobe rede, runtime, as apps e mensageria; serviços compartilhados ficam num ambiente central, alcançado por um gateway.

      **Por que a transição é gradual:** clientes com VPN própria e faixas de IP reservadas, login federado por cliente, apps que dependem do ambiente central. Os dois modelos convivem por um tempo.

      **Não é correção de erro:** cada escolha teve um motivo no momento — decisões de baixo custo no início que o crescimento tornou caras. A plataforma nova **leva adiante o que o modelo anterior provou**.

      Fonte: references/platform-illusion.md.

  - name: cognitive-load
    act: problem
    topic: "Developer friction"
    message: "Hoje a complexidade é absorvida por gente, um ticket por vez; a plataforma a absorve uma vez, como self-service."
    heading: "Who absorbs the complexity"
    screen: ["**Today:** infra teams, one ticket at a time", "**Platform:** once, as self-service"]
    notes: |-
      O que queremos dizer: no cenário de partida **o dev não carrega a stack inteira** — os times de infraestrutura carregam, **um pedido por vez**. A plataforma absorve essa complexidade **uma vez**, e o pedido vira self-service.

      A complexidade do cloud native não some: **ou é absorvida por pessoas a cada pedido, ou uma vez por quem constrói a plataforma**. O primeiro modelo escala com o número de pessoas de infraestrutura; o segundo, não.

      **DORA ROI** (DevOps Research and Assessment, retorno sobre investimento, p. 40): 'a platform that treats the developer—or any builder—as the user, minimizing the cognitive load required to move code from an agent's prompt to a production environment.'

      David Iyanu Jonathan, 'The platform engineering illusion' (platformengineering.com, 2026-07-31): o 'you build it, you run it' virou **'you build it, you run it, you secure it, you monitor it, you cost-optimize it, and you keep current on eleven CVE feeds.'** O trabalho da plataforma é **'reduce unnecessary complexity while preserving necessary complexity'** — sem esconder tanto que depurar vire arqueologia.

      Fonte: references/dora-roi-ai.md, references/platform-illusion.md.
    dependsOn: [one-size-environment]

  - name: empathy-gap
    act: problem
    topic: "Developer friction"
    message: "Plataforma poderosa e difícil de usar não é adotada: falta empatia, não API."
    heading: "The empathy gap"
    screen: ["**Symptom:** powerful but hard to use", "**Question:** how does it feel to use?"]
    notes: |-
      O que queremos dizer: plataforma poderosa e difícil de usar não é adotada; **falta empatia, não API**.

      Tatiana Mikhaleva, 'The empathy gap: Why your platform needs UX, not just APIs' (platformengineering.org, 2026-03-23): **IDPs falham por investir na infraestrutura e esquecer quem a usa**. IDP = Internal Developer Platform.

      Duas citações do artigo:
      - 'We forget the most critical component in the stack. We forget the human being trying to use it.'
      - 'A backend engineer should not need deep Kubernetes knowledge to get a URL for their service.' — é exatamente o que a PoC faz.

      **Ressalva:** artigo de opinião; os números citados no texto não têm fonte original, não usar.

      Segunda voz, mesma tese, em 'The platform engineering illusion': **'the platform was correct and nobody wanted it.'** O time construiu a plataforma como quem constrói uma ponte, e o dev a viveu como um pedágio ('the way you experience a toll booth'). Também opinião: os números do relato (14 meses, adoção abaixo de 20%) não vão para a tela.

      Fonte: references/empathy-gap.md, references/platform-illusion.md.
    dependsOn: [cognitive-load]

  - name: ai-gap
    act: problem
    topic: "AI needs a platform"
    audiences: [executive]
    message: "A IA acelerou a escrita de código, mas o retorno ainda não veio para a maioria."
    heading: "Since adopting AI, organizations report"
    screen: ["**Throughput:** 38% ship 2x or more", "**Return:** only 8% call it transformative"]
    source: "State of AI in Platform Engineering, Vol. 2 (2026), pp. 20-22"
    notes: |-
      O que queremos dizer: a IA aumentou o volume entregue, mas **quase ninguém viu o retorno no negócio**.

      São duas perguntas diferentes da pesquisa (State of AI in Platform Engineering Vol. 2, Weave Intelligence, 2026).

      **Throughput:** quanto a engenharia passou a entregar desde que adotou IA (Figure 7, p. 20). Os **38%** somam quem relatou 2x a 3x (29%) e 5x ou mais (9%).

      **Retorno:** o impacto da IA no ciclo de vida inteiro (Figure 9, p. 22). Só **8%** o descrevem como transformador; 29% ainda estão em experimentação, sem valor realizado, e 14% têm retorno negativo quando se contam licenças, tokens e revisão.

      A mensagem é a do próprio relatório: **"Throughput is not return"** (p. 22). Entregar mais features não é o mesmo que entregar mais resultado de negócio. Essa lacuna é o fio do relatório inteiro (p. 8).

      **Ressalva:** dado autorrelatado, 350 respondentes.

      Fonte: references/state-of-ai-in-platform-engineering.md.
    dependsOn: [cognitive-load]

  - name: platform-readiness
    act: problem
    topic: "AI needs a platform"
    audiences: [executive]
    message: "O obstáculo não é o modelo, é a plataforma ao redor dele."
    heading: "Main blockers to scaling AI"
    screen: ["**#1 Platform readiness:** cited by 27%", "**#4 Model capability:** cited by 11%"]
    source: "State of AI in Platform Engineering, Vol. 2 (2026), p. 24"
    notes: |-
      O que queremos dizer: o que trava a IA é **a plataforma em volta do modelo**, não o modelo.

      State of AI Vol. 2, p. 24: 'platform readiness' lidera os obstáculos para escalar IA (**27%**); 'model capability' fica em quarto (**11%**).

      Citação de apoio: 'It's because they have the platform around the model.' (Rickey Zachary, Thoughtworks, p. 24). **Ninguém está esperando um modelo melhor.**

      Fonte: references/state-of-ai-in-platform-engineering.md.
    dependsOn: [ai-gap]

  - name: rebuild-platform
    act: problem
    topic: "AI needs a platform"
    audiences: [executive]
    message: "Agentes sem reconstruir a plataforma rendem pouco; reconstruir a plataforma rende quatro vezes mais."
    heading: "Share that at least doubled throughput"
    screen: ["**Agents added** (Level 1 → 2): 30% → 36%", "**Platform rebuilt** (Level 2 → 3): 36% → 60%"]
    source: "State of AI in Platform Engineering, Vol. 2 (2026), pp. 18, 21"
    notes: |-
      O que queremos dizer: pôr agentes sobre a mesma plataforma rende pouco; **o salto vem de reconstruir a plataforma**.

      Mesma pergunta de throughput do slide anterior, agora cortada por nível de maturidade agêntica (Figure 8, p. 21): que parcela de cada nível **pelo menos dobrou a entrega** desde que adotou IA.

      Os níveis medem quanto trabalho o agente carrega (Figure 5, p. 18):
      - **Level 1:** a IA sugere e o humano executa.
      - **Level 2:** agentes abrem PRs (pull requests) em paralelo, o humano dispara e verifica.
      - **Level 3:** agentes trabalham continuamente a partir de sinais observados, e o review vira exceção.

      **Level 1 para 2:** entram os agentes, a plataforma continua igual, **+6 p.p.** (pontos percentuais). **Level 2 para 3:** a plataforma é reconstruída, com paths governados e executáveis por máquina em código, review e teste, **+24 p.p.** A maturidade paga em degrau, não em gradiente.

      **Ressalvas** (dizer ao apresentar, não pôr na tela):
      - Os níveis e os ganhos são autorrelatados (p. 18, p. 21).
      - A amostra do Level 3 é pequena, **n = 50** (Level 1: 143; Level 2: 110; Level 4: só 14).
      - A Syntasso, empresa do Kratix, é parceira do relatório.

      É direção, não medição precisa.

      Fonte: references/state-of-ai-in-platform-engineering.md.
    dependsOn: [platform-readiness]

  - name: platform-amplifier
    act: problem
    topic: "AI needs a platform"
    audiences: [executive]
    message: "A IA amplifica o sistema que já existe: com plataforma fraca, o efeito some."
    heading: "AI amplifies what exists"
    screen: ["**Weak platform:** no effect", "**Quality platform:** strong effect"]
    source: "DORA State of AI-assisted Software Development (2025), p. 71"
    notes: |-
      O que queremos dizer: a IA amplifica o sistema que já existe; **sem plataforma de qualidade, o efeito some**.

      DORA 2025, p. 71: 'AI adoption has a negligible effect on organizational performance when platform quality is low, but when platform quality is high, the effect is strong and positive.' DORA = DevOps Research and Assessment.

      É uma **fonte neutra** (Google/DORA, 4.867 respondentes) que confirma o slide anterior sem o viés da Syntasso.

      Imagem concreta do DORA ROI (p. 13): o código gerado mais rápido 'simply piles up in front of manual security reviews or brittle deployment pipelines'.

      **Ressalva:** plataforma de qualidade também traz um pouco mais de instabilidade e fricção (DORA 2025, p. 62 e p. 70).

      **Contraponto** em 'The platform engineering illusion': a IA não resolve adoção, porque 'adoption was never a tooling problem to begin with — it was a trust and design problem'. A ferramenta que gera a config ficou mais esperta; a confiança do dev não anda mais rápido por isso.

      Fonte: references/dora-ai-report.md, references/dora-roi-ai.md, references/platform-illusion.md.
    dependsOn: [rebuild-platform]

  - name: platform-as-product
    act: problem
    topic: "Platform as a product"
    message: "Tratar a plataforma como produto: o dev é cliente, não quem abre ticket."
    heading: "Developers are the customers"
    screen: ["**Self-service**, not ticket queues", "**Enablement**, not enforcement"]
    notes: |-
      O que queremos dizer: **a plataforma é um produto, e o dev é o cliente** dela.

      Volta ao primeiro slide do ato: tickets e esperas viram self-service, e o "como se faz" que era conhecimento tribal vira produto. O relatório resume: **'The model is based on enablement rather than enforcement and self-service rather than ticket queues.'** (Platform as a Product, p. 3).

      Produto tem usuários, proposta de valor, feedback loop e foco em adoção (pp. 3-4, 9-11). Não é projeto de infraestrutura com data de entrega: **tem roadmap e é medido por quem usa**.

      **Ressalva:** os quatro autores são da Syntasso, empresa do Kratix.

      Na mesma linha, em 'The platform engineering illusion': **'A technology platform is infrastructure with an API. A developer platform is a product with users'** — com preferências, workarounds e memória de cada vez que a ferramenta os deixou mal. E: **'every manual step in a "self-service" system is really just a support queue wearing a costume.'**

      Fonte: references/platform-as-a-product.md, references/platform-illusion.md.
    dependsOn: [rebuild-platform, empathy-gap]

  # ── Para onde vamos ─────────────────────────────────
  - name: idea-to-product
    act: direction
    topic: "The goal"
    message: "O objetivo vai além de provisionar mais rápido: qualquer pessoa leva uma ideia a um produto compartilhado."
    heading: "From idea to Internal Product"
    screen: ["**Today:** good products start as someone's idea", "**Goal:** anyone takes an idea to a shared product"]
    notes: |-
      O que queremos dizer: o MVP 1 facilita provisionar ambiente, mas **o objetivo é estimular a criatividade**: tornar fácil criar produto novo dentro da empresa.

      Siglas:
      - **IP** (Internal Product): aplicação ou solução criada internamente.

      **Hoje:** muitos produtos internos **nascem como ideias** de alguém e viram produtos — mérito de quem os construiu. A plataforma quer tornar esse caminho **repetível** para qualquer pessoa.

      **A jornada que a plataforma habilita:**
      - **registrar** a ideia na plataforma, com dono;
      - **provisionar** recursos e fazer **deploy**;
      - **testar**, **monitorar** e **refinar**;
      - **compartilhar** com o restante da organização.

      **Compartilhar tem estado:** o catálogo já marca cada app com um `lifecycle` (`experimental`, `production`, `deprecated`). Um IP validado passa para `production`; voltamos a isso ao declarar uma app.

      Fonte: references/internal-products.md.
    dependsOn: [platform-as-product, one-size-environment]

  - name: landscape-empty
    act: direction
    topic: "The proposal"
    message: "Uma plataforma se organiza em cinco planes — três fazem o fluxo, dois sustentam os três."
    heading: "5 planes"
    diagram: "diagrams/landscape/landscape.svg"
    reveal: [dev-plane, ind-plane, res-plane, obs-plane, sec-plane]
    accumulate: true
    source: "platformengineering.org/platform-tooling · planes as parallel layers; the journey order is ours"
    dependsOn: [idea-to-product]
    notes: |-
      O que queremos dizer: **a plataforma se organiza em cinco planes**, e aqui eles aparecem vazios de propósito.

      As setas entram com as caixas: **a intenção do dev atravessa três planes até virar software rodando**.
      - **Developer Control:** onde o dev declara o que quer.
      - **Integration & Delivery:** onde a declaração vira artefato e entrega.
      - **Resource:** onde roda.

      Observability e Security não são etapas do fluxo: **sustentam** os três o tempo todo.

      Os planes vêm da arquitetura de referência do platformengineering.org; **a ordem da jornada é nossa**. Nenhuma ferramenta na tela de propósito: as categorias valem para qualquer escolha de stack.

  # ── Developer Control Plane ─────────────────────────
  - name: landscape-dev-1
    act: developer-control
    topic: "Software Catalog"
    message: "O catálogo diz o que existe e quem é dono."
    heading: "Software Catalog"
    divider: "Developer Control Plane"
    diagram: "diagrams/landscape/landscape.svg"
    show: [dev-plane, ind-plane, res-plane, obs-plane, sec-plane]
    start: "empty"
    reveal: [dev.1]
    accumulate: true
    source: "platformengineering.org/platform-tooling · planes as parallel layers; the journey order is ours"
    notes: |-
      O que queremos dizer: **o primeiro item do Developer Control é o catálogo** — o mapa do que existe e de quem responde por cada coisa.

      Diferente do landscape do platformengineering.org, **o Portal não está aqui dentro**: ele vira um cliente da plataforma, como a CLI e os agentes — mostramos isso depois dos planes.

  - name: catalog-ownership
    act: developer-control
    topic: "Software Catalog"
    message: "O catálogo diz o que existe e quem é dono."
    heading: "The catalog answers"
    screen: ["What exists?", "Who owns it?"]
    notes: |-
      O que queremos dizer: o catálogo responde **o que existe e quem é dono**.

      O catálogo é o registro do software da organização, mantido junto do código. O portal é uma das formas de vê-lo — ele volta depois dos planes, como cliente da plataforma.

      **O que existe:** o inventário de serviços, APIs, bancos e filas de hoje.

      **Quem é dono:** a pergunta que mais vale. Todo Component, API, Resource e System tem `owner` (modelo do Backstage). **Sem dono, o catálogo vira lista morta.**

      Volta ao conhecimento tribal do primeiro ato: "a quem eu pergunto?" deixa de depender de quem sabe e passa a ter **resposta escrita, que serve ao dev e ao agente**.

      **Um relato** de 'The platform engineering illusion': um Backstage lançado com 43 serviços no catálogo, 12 deles desatualizados — e todo mundo comemorando o lançamento.

      Fonte: references/backstage-catalog.md, references/platform-illusion.md.

  - name: catalog-levels
    act: developer-control
    topic: "Software Catalog"
    message: "O catálogo enxerga o software de dois jeitos: pelo negócio e pela engenharia."
    heading: "The catalog has two views"
    screen: ["**Business view:** how leadership sees it", "**Engineering view:** how teams build it"]
    notes: |-
      O que queremos dizer: **o mesmo catálogo serve a quem fala de negócio e a quem constrói**.

      - **Visão de negócio:** como produto e liderança enxergam o software.
      - **Visão de engenharia:** como os times o constroem.

      O mesmo catálogo liga as duas: **cada peça construída pertence a uma capacidade de negócio**. Os próximos dois slides abrem cada visão.

      Fonte: references/backstage-catalog.md.
    dependsOn: [catalog-ownership]

  - name: catalog-business-view
    act: developer-control
    topic: "Software Catalog"
    message: "A visão de negócio agrupa o software por área e por capacidade."
    heading: "Business view"
    screen: ["**Domain:** a business area", "**System:** a capability with public APIs"]
    notes: |-
      O que queremos dizer: a visão de negócio **agrupa o software por área e por capacidade**.

      **Domain:** agrupa Systems que compartilham terminologia, modelo e propósito de negócio — um bounded context.

      **System:** o conjunto de Components e Resources que entrega uma capacidade e expõe uma ou mais APIs públicas, **escondendo a implementação de quem consome**.

      Fonte: references/backstage-catalog.md.
    dependsOn: [catalog-levels]

  - name: catalog-engineering-view
    act: developer-control
    topic: "Software Catalog"
    message: "A visão de engenharia mostra o que se constrói, como as peças conversam e do que dependem."
    heading: "Engineering view"
    screen: ["**Component:** what you _build_ and _deploy_", "**API:** the _boundary_ between components", "**Resource:** what it _needs_ at runtime"]
    notes: |-
      O que queremos dizer: **a visão de engenharia mostra o que se constrói**, como as peças conversam e do que dependem.

      Siglas:
      - **API** (Application Programming Interface): a fronteira entre Components.

      **Component:** a peça de software — serviço, site, pipeline de dados.

      **API:** a **fronteira entre Components**, em formato legível por máquina.

      **Resource:** a infraestrutura de que o Component precisa **em runtime** — banco, fila, bucket.

      Cada Component pertence a um System, que pertence a um Domain — **é aí que as duas visões se encontram**. Os próximos slides mostram cada entidade com um exemplo conhecido.

      Fonte: references/backstage-catalog.md.
    dependsOn: [catalog-business-view]

  - name: entity-component
    act: developer-control
    topic: "Software Catalog"
    audiences: [engineering, platform]
    message: "Component é uma peça de software que alguém mantém e entrega."
    heading: "Component"
    screen: ["**What:** software you build and deploy", "**Example:**\nThe `shuffle-api` _shuffles_ the play queue"]
    notes: |-
      O que queremos dizer: **Component é o software que um time mantém e entrega** — serviço, site, biblioteca, pipeline de dados.

      **Exemplo:** `shuffle-api`, o serviço que embaralha a fila de reprodução. Vem do **catálogo de demonstração do Backstage**, que modela um Spotify (onde o Backstage nasceu).

      Fonte: references/backstage-catalog.md.
    dependsOn: [catalog-engineering-view]

  - name: entity-api
    act: developer-control
    topic: "Software Catalog"
    audiences: [engineering, platform]
    message: "API é o contrato entre Components."
    heading: "API"
    screen: ["**What:** the contract between components", "**Example:**\n`www-artist` site _consumes_ `artist-lookup` service"]
    notes: |-
      O que queremos dizer: **API é o contrato**; quem consome depende dele, não da implementação.

      Siglas:
      - **API** (Application Programming Interface).

      É uma **fronteira legível por máquina** (OpenAPI, AsyncAPI, gRPC, GraphQL).

      **Exemplo:** o site `www-artist` (`type: website`) consome o que o microsserviço `artist-lookup` (`type: service`, em Java) expõe. O tipo vem do campo `spec.type` de cada Component no catálogo de demonstração.

      Fonte: references/backstage-catalog.md.
    dependsOn: [entity-component]

  - name: entity-resource
    act: developer-control
    topic: "Software Catalog"
    audiences: [engineering, platform]
    message: "Resource é a infraestrutura de que o Component precisa para rodar."
    heading: "Resource"
    screen: ["**What:** infrastructure needed at runtime", "**Example:**\nThe `artists-db` database _used by_ `artist-lookup`"]
    notes: |-
      O que queremos dizer: **Resource é a infraestrutura de que o Component precisa para rodar** — banco, fila, bucket.

      **Exemplo:** o microsserviço `artist-lookup` (`type: service`) depende de `artists-db` (`type: database`), que guarda os dados dos artistas.

      **Gancho para o Resource Plane:** aqui o Resource é descrito **pelo papel** (database); lá vira um serviço concreto.

      Fonte: references/backstage-catalog.md.
    dependsOn: [entity-api]

  - name: entity-system
    act: developer-control
    topic: "Software Catalog"
    audiences: [engineering, platform]
    message: "System junta Components, APIs e Resources que entregam uma capacidade — e esconde o resto."
    heading: "System"
    subitems: together
    screen: ["**What:** components that deliver a capability", "**Example:**\nThe `artist-engagement-portal` system _groups_:\n- `www-artist` site\n- `artist-lookup` service\n- `artists-db` database"]
    notes: |-
      O que queremos dizer: **System junta as peças que entregam uma capacidade** e esconde o que há dentro.

      **Exemplo:** o System `artist-engagement-portal` reúne o site `www-artist`, o microsserviço `artist-lookup` e o banco `artists-db` — as três peças dos slides anteriores. Um System junta **Components e Resources**.

      Quem está fora enxerga **só as APIs públicas** do System; o que há dentro pode mudar sem avisar ninguém.

      É a **unidade de ownership** de um time.

      Fonte: references/backstage-catalog.md.
    dependsOn: [entity-resource]

  - name: entity-domain
    act: developer-control
    topic: "Software Catalog"
    audiences: [engineering, platform]
    message: "Domain agrupa Systems da mesma área de negócio."
    heading: "Domain"
    subitems: together
    screen: ["**What:** systems of one business area", "**Example:**\nThe `audio` domain _contains_:\n- `artists` subdomain\n- `playback` subdomain"]
    notes: |-
      O que queremos dizer: **Domain agrupa Systems da mesma área de negócio.**

      Domain = **bounded context**: mesma terminologia, mesmas métricas, mesmo propósito.

      **Exemplo:** `audio` tem dois subdomínios (`subdomainOf`): `artists` e `playback`.

      Domain é **como a liderança conversa sobre o produto**.

      Fonte: references/backstage-catalog.md.
    dependsOn: [entity-system]

  - name: spotify-tree
    act: developer-control
    topic: "Software Catalog"
    message: "Juntando: do negócio ao banco de dados, uma árvore só."
    align: true
    heading: "Spotify demo catalog"
    screen: ["**Domain:** `audio`", "**Subdomain:** `playback`", "**System:** `podcast`", "**Component:** `podcast-api`"]
    notes: |-
      O que queremos dizer: **do negócio ao código, o catálogo é uma árvore só.**

      **Árvore:** Domain `audio` → subdomínio `playback` → System `podcast` → Component `podcast-api`. Vem de `packages/catalog-model/examples`, no repositório do Backstage.

      Para o público executive, este slide **substitui os cinco anteriores**: o exemplo sem a teoria.

      Possível demo ao vivo: o mesmo catálogo no Backstage vanilla (`backstage/` na raiz do repo) — não decidido.

      Fonte: references/backstage-catalog.md.
    dependsOn: [catalog-levels]

  - name: catalog-tree
    act: developer-control
    topic: "Software Catalog"
    message: "No exemplo deste repo: o Domain communication com os Systems greeter e notifier."
    heading: "Our catalog"
    subitems: together
    screen: ["**Example:**\nThe `communication` domain _contains_:\n- `greeter` system\n- `notifier` system"]
    notes: |-
      O que queremos dizer: **a mesma árvore descreve um software real.**

      É a mesma árvore, aplicada ao **catálogo de exemplo deste repo** (`idp/catalog/communication/`): o `greeter` publica saudações e um evento por saudação; o `notifier` consome esse evento e entrega notificações. Os Resources são descritos **pelo papel** (banco, tópico, fila, bucket), não pelo serviço de nuvem.

      Fonte: references/backstage-catalog.md.
    dependsOn: [spotify-tree]

  - name: declare-name
    act: developer-control
    topic: "Software Catalog"
    audiences: [engineering, platform]
    message: "No catálogo, a app é um arquivo curto junto do código — começando pelo nome e pelo que ela faz."
    code: {file: snippets/catalog-info.yaml, focus: 3-4}
    dependsOn: [catalog-tree]
    notes: |-
      O que queremos dizer: **cada app se declara no catálogo com um arquivo curto, junto do código**; as primeiras linhas dizem o nome e o que a app faz, em linguagem humana — é o que aparece na busca do catálogo.

      Fonte: references/backstage-catalog.md.

  - name: declare-system
    act: developer-control
