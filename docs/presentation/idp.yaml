  # ── Humanos e agentes ───────────────────────────────
  - name: agents-as-users
    act: agentic
    topic: "Agents as users"
    message: "Agentes já são usuários da plataforma — e ela vira o contexto e o freio deles."
    heading: "Agents as users"
    screen: ["**Context:** the platform _feeds_ the agent", "**Brakes:** the platform _limits_ the agent", "**Today:** platform clients in 29% of orgs"]
    source: "DORA ROI of AI-assisted Software Development (2026), p. 40; State of AI in Platform Engineering, Vol. 2 (2026), p. 43"
    notes: |-
      O que queremos dizer: **agentes já são usuários da plataforma**, e ela vira o contexto e o freio deles.

      **DORA ROI** (DevOps Research and Assessment; ROI = return on investment), p. 40: 'In the agentic era, an IDP is no longer just a portal for infrastructure, it is the risk mitigator and the context provider for AI agents.' E: 'the platform provides the guardrails for the agents who are also users of the platform.'

      **State of AI** (p. 43): agentes já são clientes da plataforma em **29%** das organizações.

      **Ressalva:** o DORA ROI é coautorado pela consultoria do Google Cloud.

      Fonte: references/dora-roi-ai.md, references/state-of-ai-in-platform-engineering.md.
    dependsOn: [journey-run, landscape-clients]

  - name: spec-is-contract
    act: agentic
    topic: "Contracts & gates"
    message: "Spec declarativa é contrato validável — por isso um agente consegue usá-la."
    heading: "Spec as contract"
    screen: ["**What:** a declarative spec _is_ a validated contract", "**Who writes:** a human or an agent"]
    notes: |-
      O que queremos dizer: **spec declarativa tem schema**, então a plataforma valida igual quem quer que a escreva — pessoa ou agente.

      `catalog-info.yaml`, Score e o claim do Crossplane têm schema: quem escreve pode ser uma pessoa ou um agente, e a plataforma valida igual. É o que separa **um golden path executável por máquina de um wiki**.

      Liga o catálogo e a declaração da app ao IaC (Infrastructure as Code) — agora com o agente como autor.

      Fonte: references/agent-evals.md, references/poc.md.
    dependsOn: [environment-vs-sandbox, iac]

  - name: path-types
    act: agentic
    topic: "Contracts & gates"
    audiences: [platform]
    message: "Nem todo caminho é igual: determinístico, probabilístico ou híbrido."
    heading: "Three kinds of path"
    screen: ["**Deterministic:** same input, same output", "**Probabilistic:** an agent; evals _are_ the tests", "**Hybrid:** agent output, deterministic gates"]
    notes: |-
      O que queremos dizer: cada golden path tem um tipo, e **o tipo decide como ele é testado e onde precisa de gate**.

      **State of AI Vol. 2, p. 29:**
      - **Deterministic:** pipeline, mesma saída para a mesma entrada.
      - **Probabilistic:** agente; 'Evals become the test suite'.
      - **Hybrid:** geração probabilística com gates determinísticos em loop.

      **Recomendação:** nomear o tipo de cada path e **exigir gate determinístico em efeito irreversível** (p. 51).

      **Evals como regressão:** 'Regression evals ... should have a nearly 100% pass rate' (Anthropic).

      Fonte: references/state-of-ai-in-platform-engineering.md, references/agent-evals.md.
    dependsOn: [spec-is-contract]

  - name: deterministic-gate
    act: agentic
    topic: "Contracts & gates"
    audiences: [engineering, platform]
    message: "O agente escreve; a plataforma recusa o que está errado e devolve o motivo."
    heading: "Deterministic gate"
    screen: ["**Agent:** writes the spec", "**Platform:** rejects with `unknown field`", "**Agent:** fixes and retries"]
    notes: |-
      O que queremos dizer: a plataforma **recusa o que está errado e diz o motivo**; é isso que deixa o agente se corrigir sozinho.

      Siglas:
      - **XRD** (Composite Resource Definition do Crossplane): o schema do `Environment`.
      - **IaC** (Infrastructure as Code).

      **Exemplo da PoC:** quando o campo `domain.parentZoneId` saiu do XRD do `Environment`, o servidor passou a rejeitar claim antigo com 'unknown field' — **falha alta, não silenciosa**.

      **Kubernetes** (strict field validation, default do `kubectl`): 'rejects the request with a 400 Bad Request error' e lista os campos. `crossplane resource validate` faz a mesma checagem offline.

      É o **validation loop**: 'Claude does the work, runs the check, reads the result, and iterates until the check passes' (doc do Claude Code). A falha precisa ser 'specific and actionable', não código opaco (Anthropic).

      A ligação gate de IaC ↔ agente é **inferência nossa**: nenhuma fonte a faz diretamente.

      Fonte: references/agent-evals.md.
    dependsOn: [path-types]

  - name: irreversible-gate
    act: agentic
    topic: "Contracts & gates"
    message: "Efeito irreversível exige gate explícito — e humano decidindo."
    heading: "Irreversible action"
    screen: ["**Gate:** explicit `--yes-destroy` flag", "**Who decides:** a human, every time"]
    notes: |-
      O que queremos dizer: **o que não tem volta exige gate explícito** e uma pessoa decidindo, a cada vez.

      **OpenAI, A practical guide to building agents:** 'Actions that are sensitive, irreversible, or have high stakes should trigger human oversight until confidence in the agent's reliability grows.' Risco por tool considera 'reversibility'.

      **Exemplo da PoC:** o `teardown` do ambiente exige `--yes-destroy` (e `make clean` recusa sem `CONFIRM=1`), e a regra do repo é que **só o humano autoriza destruir, a cada vez**. Gate por consequência, não por categoria (State of AI, p. 51).

      Fonte: references/agent-evals.md, references/state-of-ai-in-platform-engineering.md.
    dependsOn: [deterministic-gate]

  - name: guardrails-brakes
    act: agentic
    topic: "Contracts & gates"
    audiences: [executive, platform]
    message: "Guardrails automatizados são o freio que permite ir mais rápido."
    heading: "Guardrails as brakes"
    screen: ["**What:** automated, non-optional gates", "**Result:** go faster, safely"]
    source: "DORA ROI of AI-assisted Software Development (2026), p. 42"
    notes: |-
      O que queremos dizer: **gate automatizado não atrasa — é o freio que permite acelerar**.

      **DORA ROI** (p. 42): 'shifting from manual checkpoints to automated nonoptional security and quality gates. In an agentic world, these guardrails act as the brakes that allow the engineering engine to go faster safely.'

      **State of AI** (p. 41): 'tighter governance actually raises the autonomy ceiling instead of lowering it.'

      Fecha o ato: a verificação sai da leitura humana (**35%** só revisam lendo, State of AI p. 26) para **gates que o agente consegue usar**.

      Siglas:
      - **DORA** (DevOps Research and Assessment).
      - **ROI** (return on investment).

      Fonte: references/dora-roi-ai.md, references/state-of-ai-in-platform-engineering.md.
    dependsOn: [irreversible-gate]

  - name: aep-layers
    act: agentic
    topic: "Layers for agents"
    message: "O IDP não é substituído: ganha duas camadas por cima dos cinco planes."
    heading: "Two layers on top"
    screen: ["**Tooling:** the 5 planes", "**Paths:** defined once, run by humans and agents", "**Agent infrastructure:** what agents need"]
    source: "State of AI in Platform Engineering, Vol. 2 (2026), p. 29"
    notes: |-
      O que queremos dizer: **o IDP não é substituído**: ganha duas camadas por cima dos cinco planes.

      Siglas:
      - **IDP** (Internal Developer Platform).
      - **AEP** (Agentic Engineering Platform).

      **Desenho final:** os cinco planes viram a **tooling layer** e duas camadas entram por cima.

      **Fonte das camadas:** State of AI Vol. 2, p. 29 (três camadas do AEP) e p. 28: 'The Agentic Engineering Platform is the evolution of the IDP, not the replacement of it.' (Kaspar von Grünberg).

      **Paths:** 'Define the path once, govern it, and let everyone run it' (p. 16) — **everyone inclui agentes**. Path = 'repeatable route from intent to usable output' (p. 29). É o **golden path** do ato 1, agora com o tipo nomeado (determinístico, probabilístico, híbrido) e **gates no lugar de leitura humana**.

      **Agent infrastructure:** o que o agente precisa para trabalhar com segurança — identidade, contexto, execução e avaliação, **tudo como código** (p. 29). Os próximos slides dizem quanto disso é preciso e quando.

      **Ressalva:** Syntasso é parceira do relatório.

      Fonte: references/state-of-ai-in-platform-engineering.md.
    dependsOn: [agents-as-users, reference-architecture, golden-paths, path-types]

  - name: maturity-levels
    act: agentic
    topic: "Maturity"
    message: "A escala de maturidade vai do humano como loop ao humano como orquestrador."
    heading: "AI maturity levels"
    screen: ["**Level 0:** no agents", "**Level 1:** AI suggests, human executes", "**Level 2:** agents open PRs in parallel", "**Level 3:** agents act on signals", "**Level 4:** autonomous within guardrails"]
    source: "State of AI in Platform Engineering, Vol. 2 (2026), p. 18"
    notes: |-
      O que queremos dizer: a escala vai **do humano como o próprio loop ao humano como orquestrador**.

      É a escala do slide `rebuild-platform`, do primeiro ato: **o salto do Level 2 para o 3** é o que exige reconstruir a plataforma.

      State of AI Vol. 2, p. 18-19 (PR = pull request):
      - **L0:** sem agentes.
      - **L1:** a IA sugere e o humano executa.
      - **L2:** agentes geram PRs em paralelo.
      - **L3:** agentes trabalham a partir de sinais observados, **review por exceção**.
      - **L4:** autônomos dentro de guardrails desenhados por humanos.

      **Distribuição:** 41% L1, 31% L2, 14% L3, 4% L4 — **só 18% acima do L2**. Previsão do relatório: **mais de 30% em L3+** no próximo ano.

      **Ressalva:** autorrelatado.

      Fonte: references/state-of-ai-in-platform-engineering.md.
    dependsOn: [aep-layers, rebuild-platform]

  - name: level3-prerequisites
    act: agentic
    topic: "Maturity"
    message: "Para chegar ao Level 3, a agent infrastructure precisa de quatro peças — e elas só pagam juntas."
    heading: "What Level 3 needs"
    screen: ["**Dispatch path:** a request becomes work", "**Validation loop:** automatic checks", "**Scoped identity:** per agent", "**Sandboxed environments:** isolated runs"]
    source: "State of AI in Platform Engineering, Vol. 2 (2026), p. 50"
    notes: |-
      O que queremos dizer: para o agente agir a partir de sinais (Level 3), a plataforma precisa de **quatro peças, e elas só dão retorno juntas**.

      Siglas:
      - **MCP** (Model Context Protocol).
      - **XRD** (Composite Resource Definition do Crossplane).
      - **SSO** (Single Sign-On).
      - **PoC** (proof of concept).

      São a camada de **agent infrastructure** do slide anterior, na forma de pré-requisito. **O contexto** (o catálogo via MCP) **é a base de todos**: sem ele o agente não sabe o que existe nem de quem é.

      State of AI Vol. 2, p. 10 e p. 50: os quatro pré-requisitos do Level 3 só dão retorno em conjunto.

      **O que a PoC já tem de cada um:**
      - **Dispatch path:** claim `Environment` (um pedido vira infra).
      - **Validation loop:** schema do XRD + fitness functions (Ready/Synced, echo 200).
      - **Scoped identity:** SSO com Keycloak em proposta; o agente com identidade própria **ainda não**.
      - **Sandboxed environments:** `Environment` efêmero e sandbox por requisição.

      **Avaliação:** evals como suíte de regressão; o que se avalia é **o estado final no ambiente**, não a fala do agente (Anthropic).

      Fonte: references/state-of-ai-in-platform-engineering.md, references/poc.md, references/agent-evals.md.
    dependsOn: [maturity-levels, deterministic-gate, request-sandbox, agent-identity, catalog-as-context]

  - name: coverage-check
    act: agentic
    topic: "Maturity"
    audiences: [executive, platform]
    message: "O objetivo: cada etapa da entrega tem um caminho governado pela plataforma, que pessoa ou agente executa com segurança."
    heading: "A governed path per stage"
    screen: ["**Plan:** a **PRD** and the app _declared_ in the catalog", "**Code:** people and agents _follow_ **ADRs** and `AGENTS.md`", "**Review:** each **PR** or **app version** _runs in_ a **shared sandbox**", "**Test:** a failed **check** _returns_ to its author", "**Deploy:** an app version _promoted_ across Environments", "**Monitor:** **golden signals** _watch_ every Environment"]
    source: "State of AI in Platform Engineering, Vol. 2 (2026), p. 50"
    notes: |-
      O que queremos dizer: **cada etapa tem um caminho governado** pela plataforma, que pessoa ou agente executa com segurança. A autonomia segue a consequência: **o irreversível continua com uma pessoa** (slide `irreversible-gate`).

      Siglas:
      - **PRD** (Product Requirements Document): o que construir e por quê.
      - **ADR** (Architecture Decision Record): uma decisão de arquitetura, com contexto e consequências.
      - **PR** (pull request).

      **Plan e Code:** PRD, ADR e `AGENTS.md` são **contexto versionado no repo**. O agente lê o requisito antes de codar e respeita a decisão já tomada — a context layer do DORA ROI (p. 44).

      **Review:** o sandbox compartilhado roda o PR — ou uma versão da app ainda sem PR — **contra os serviços reais** — é onde ficam os testes end-to-end.

      **Test** é o **validation loop**: unit tests, contract tests, schema da spec e evals. Se algo falha, **o motivo volta para quem escreveu** até passar. Só **17%** têm esse loop; **35%** ainda validam só lendo (State of AI, p. 26, p. 30).

      **Monitor:** além dos golden signals, as **fitness functions** provam que o Environment segue como declarado.

      Pergunta para a plateia: **em quantas das seis etapas o seu time já tem caminho governado?**
      - **0 a 2:** construir a base primeiro.
      - **3 a 4:** o "expensive middle" — o trabalho empilha nas etapas sem caminho.
      - **5 a 6:** o limite passa a ser custo e arquitetura.

      As etapas e as faixas são do relatório (p. 50); os exemplos são a nossa proposta.

      Fonte: references/state-of-ai-in-platform-engineering.md, references/agent-evals.md, references/sandbox-routing.md, references/agents-md.md, references/dora-roi-ai.md.
    dependsOn: [level3-prerequisites]

  # ── Onde estamos e próximos passos ──────────────────
  - name: mvp1
    act: where-we-are
    topic: "MVP 1"
    message: "MVP 1: quem pede um ambiente recebe um cluster pronto, com rede, DNS, certificado, identidade e GitOps — sem ticket."
    heading: "What the dev gets"
    screen: ["**Asks for:** an `Environment`", "**Gets:** a ready cluster with a URL", "**Without:** a ticket"]
    notes: |-
      O que queremos dizer: **o primeiro passo entregue é o ambiente sob demanda** — pedir e receber, sem ticket.

      **Pedido:** um claim `Environment`, declarado em YAML.

      **Entrega:** um cluster EKS (Elastic Kubernetes Service) com rede, DNS numa sub-zona própria, certificado, Gateway, identidade e GitOps já ligados.

      É o conselho de 'The platform engineering illusion': **'Build the smallest platform that resolves a real, named problem'**. O problema nomeado aqui: ter um ambiente completo sem depender de outro time.

      Fonte: references/current-state.md, references/poc.md, references/platform-illusion.md.
    dependsOn: [journey-run]

  - name: mvp1-core-component
    act: where-we-are
    topic: "MVP 1"
    audiences: [executive, platform]
    message: "O MVP 1 entrega um dos componentes centrais de qualquer IDP: ambientes sob demanda."
    heading: "Environment management"
    screen: ["**What:** self-service environments on demand", "**Context:** 1 of 5 core IDP components"]
    notes: |-
      O que queremos dizer: o MVP 1 entrega **um dos componentes centrais de qualquer IDP** (Internal Developer Platform).

      **Os cinco core components** (internaldeveloperplatform.org):
      - application configuration
      - infrastructure orchestration
      - **environment management**
      - deployment management
      - **RBAC** (role-based access control)

      **Environment management:** 'developers can self-serve fully provisioned environments on demand', 'provisioned as defined by the platform team', criados por UI, **CLI** (command-line interface) ou **API** (application programming interface), com 'automated teardown or pausing' para evitar custo. É **exatamente o recorte do MVP 1**.

      **Cuidado:** os cinco componentes (por capacidade) **não são os cinco planes** (por camada) — não misturar os dois 'cinco'.

      **Ressalva:** o site é ligado à Humanitec, que vende platform orchestrator.

      Fonte: references/internaldeveloperplatform-org.md.
    dependsOn: [mvp1]

  - name: mvp1-architecture
    act: where-we-are
    topic: "MVP 1"
    audiences: [platform]
    message: "Um control plane provisiona os Environments na AWS, numa topologia hub-and-spoke."
    heading: "Hub and spokes"
    screen: ["**Control plane:** runs `Crossplane`, `Argo CD`", "**Hub:** shared network and ingress", "**Spoke:** an Environment on AWS"]
    notes: |-
      O que queremos dizer: **um control plane provisiona os Environments**; a rede é hub-and-spoke.

      Siglas:
      - **EKS** (Elastic Kubernetes Service): o cluster de cada Environment.
      - **DNS** (Domain Name System): nomes numa sub-zona delegada no Route 53.

      **Control plane:** roda **Crossplane e Argo CD**. Hoje é um **k3d local**.

      **Hub:** a conta `network` concentra conectividade e ingress; cada região tem células (spokes).

      **Claim:** um claim `Environment` vira um **cluster EKS** com rede, DNS, certificado, identidade e GitOps.

      As decisões de topologia estão registradas como ADRs no repo (`docs/adr/`).

      Fonte: references/poc.md.
    dependsOn: [mvp1, iac]

