<svg viewBox="100 170 1400 702" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif"><g data-part="cli"><g class="st" data-step="1"><rect x="120" y="182" width="1360" height="670" rx="16" fill="#070b14" stroke="#1f2937" stroke-width="2" /><path d="M120,198 a16,16 0 0 1 16,-16 h1328 a16,16 0 0 1 16,16 v30 h-1360 z" fill="#111827"/><circle cx="148" cy="205" r="7" fill="#ff5f57"/><circle cx="172" cy="205" r="7" fill="#febc2e"/><circle cx="196" cy="205" r="7" fill="#28c840"/><text x="800.0" y="205" font-size="17" font-weight="700" fill="#9fb3c8" text-anchor="middle" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace"><tspan x="800.0" dy="0.0">platform — one CLI, every plane</tspan></text><text x="160" y="282" font-size="18" font-weight="800" fill="#4a9ef4" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace"><tspan x="160" dy="0.0"># Developer Control</tspan></text><text x="160" y="322" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"><tspan x="160" dy="0.0">$ platform init greeting-api --template api</tspan></text><text x="184" y="350" font-size="16" font-weight="500" fill="#6b7a8d" text-anchor="start" letter-spacing="0" dominant-baseline="middle" ><tspan x="184" dy="0.0">new app from a golden path</tspan></text><text x="160" y="392" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"><tspan x="160" dy="0.0">$ platform catalog search payments</tspan></text><text x="184" y="420" font-size="16" font-weight="500" fill="#6b7a8d" text-anchor="start" letter-spacing="0" dominant-baseline="middle" ><tspan x="184" dy="0.0">who owns what</tspan></text><text x="160" y="478" font-size="18" font-weight="800" fill="#4a9ef4" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace"><tspan x="160" dy="0.0"># Integration &amp; Delivery</tspan></text><text x="160" y="518" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"><tspan x="160" dy="0.0">$ platform deploy --env dev</tspan></text><text x="184" y="546" font-size="16" font-weight="500" fill="#6b7a8d" text-anchor="start" letter-spacing="0" dominant-baseline="middle" ><tspan x="184" dy="0.0">build, ship, expose</tspan></text><text x="160" y="588" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"><tspan x="160" dy="0.0">$ platform promote --to prod</tspan></text><text x="184" y="616" font-size="16" font-weight="500" fill="#6b7a8d" text-anchor="start" letter-spacing="0" dominant-baseline="middle" ><tspan x="184" dy="0.0">same artifact, next ring</tspan></text><text x="160" y="674" font-size="18" font-weight="800" fill="#4a9ef4" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace"><tspan x="160" dy="0.0"># Resource</tspan></text><text x="160" y="714" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"><tspan x="160" dy="0.0">$ platform db create postgres</tspan></text><text x="184" y="742" font-size="16" font-weight="500" fill="#6b7a8d" text-anchor="start" letter-spacing="0" dominant-baseline="middle" ><tspan x="184" dy="0.0">database for the app</tspan></text><text x="160" y="784" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"><tspan x="160" dy="0.0">$ platform llm enable --model claude</tspan></text><text x="184" y="812" font-size="16" font-weight="500" fill="#6b7a8d" text-anchor="start" letter-spacing="0" dominant-baseline="middle" ><tspan x="184" dy="0.0">AI through the gateway</tspan></text><text x="820" y="282" font-size="18" font-weight="800" fill="#e5c07b" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace"><tspan x="820" dy="0.0"># Observability</tspan></text><text x="820" y="322" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"><tspan x="820" dy="0.0">$ platform logs --follow</tspan></text><text x="844" y="350" font-size="16" font-weight="500" fill="#6b7a8d" text-anchor="start" letter-spacing="0" dominant-baseline="middle" ><tspan x="844" dy="0.0">live logs</tspan></text><text x="820" y="392" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"><tspan x="820" dy="0.0">$ platform cost --last 30d</tspan></text><text x="844" y="420" font-size="16" font-weight="500" fill="#6b7a8d" text-anchor="start" letter-spacing="0" dominant-baseline="middle" ><tspan x="844" dy="0.0">what this app costs</tspan></text><text x="820" y="478" font-size="18" font-weight="800" fill="#e5c07b" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace"><tspan x="820" dy="0.0"># Security</tspan></text><text x="820" y="518" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"><tspan x="820" dy="0.0">$ platform secrets set API_KEY</tspan></text><text x="844" y="546" font-size="16" font-weight="500" fill="#6b7a8d" text-anchor="start" letter-spacing="0" dominant-baseline="middle" ><tspan x="844" dy="0.0">into the vault, never the repo</tspan></text><text x="820" y="588" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="0" dominant-baseline="middle" font-family="DejaVu Sans Mono, monospace" xml:space="preserve"><tspan x="820" dy="0.0">$ platform access request --env prod</tspan></text><text x="844" y="616" font-size="16" font-weight="500" fill="#6b7a8d" text-anchor="start" letter-spacing="0" dominant-baseline="middle" ><tspan x="844" dy="0.0">audited, time-boxed</tspan></text></g></g></svg>
