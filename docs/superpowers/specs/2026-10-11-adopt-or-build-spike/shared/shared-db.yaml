apiVersion: v1
kind: Namespace
metadata:
  name: shared-db
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin
  namespace: shared-db
stringData:
  POSTGRES_PASSWORD: spike-admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shared-db
spec:
  serviceName: postgres
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        envFrom:
        - secretRef: {name: postgres-admin}
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shared-db
spec:
  selector: {app: postgres}
  ports:
  - port: 5432
