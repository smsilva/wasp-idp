apiVersion: platform.kratix.io/v1alpha1
kind: Destination
metadata:
  name: aws-crossplane
  labels:
    provisioning-method: crossplane
spec:
  path: aws-crossplane
  strictMatchLabels: true
  stateStoreRef:
    name: default
    kind: BucketStateStore
