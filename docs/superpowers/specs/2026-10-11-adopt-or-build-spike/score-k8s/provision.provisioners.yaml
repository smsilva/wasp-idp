- uri: template://spike/postgres-provision
  type: postgres
  description: Provision - a dedicated PostgreSQL instance for this workload.
  init: |
    randomPassword: {{ randAlphaNum 16 | quote }}
  state: |
    service: pg-{{ .SourceWorkload }}-{{ substr 0 8 .Guid | lower }}
    password: {{ dig "password" .Init.randomPassword .State | quote }}
  outputs: |
    host: {{ .State.service }}
    port: 5432
    name: app
    database: app
    username: app
    password: {{ encodeSecretRef .State.service "password" }}
  manifests: |
    - apiVersion: v1
      kind: Secret
      metadata:
        name: {{ .State.service }}
      data:
        password: {{ .State.password | b64enc }}
    - apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: {{ .State.service }}
      spec:
        serviceName: {{ .State.service }}
        selector:
          matchLabels: {app: {{ .State.service }}}
        template:
          metadata:
            labels: {app: {{ .State.service }}}
          spec:
            containers:
            - name: postgres
              image: postgres:17-alpine
              env:
              - {name: POSTGRES_USER, value: app}
              - {name: POSTGRES_DB, value: app}
              - name: POSTGRES_PASSWORD
                valueFrom: {secretKeyRef: {name: {{ .State.service }}, key: password}}
    - apiVersion: v1
      kind: Service
      metadata:
        name: {{ .State.service }}
      spec:
        selector: {app: {{ .State.service }}}
        ports:
        - port: 5432
