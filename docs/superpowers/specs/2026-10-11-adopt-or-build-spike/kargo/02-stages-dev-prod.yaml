---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo-spike
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: releases
    sources:
      direct: true
  promotionTemplate:
    spec:
      vars:
      - name: imageRepo
        value: ghcr.io/smsilva/kargo-spike
      - name: apiServer
        value: https://vcluster.env-kargo-dev.svc.cluster.local:7100
      - name: secretName
        value: vcluster-dev
      steps:
      - uses: http
        as: patch-image
        config:
          method: PATCH
          url: ${{ vars.apiServer }}/apis/apps/v1/namespaces/app/deployments/kargo-spike
          insecureSkipTLSVerify: true
          headers:
          - name: Authorization
            value: Bearer ${{ secret(vars.secretName).token }}
          - name: Content-Type
            value: application/strategic-merge-patch+json
          body: '${{ quote({"spec": {"template": {"spec": {"containers": [{"name": "kargo-spike", "image": vars.imageRepo + ":" + imageFrom(vars.imageRepo).Tag } ] } } } } ) }}'
          successExpression: response.status == 200
          failureExpression: response.status != 200
          errorExpression: 'string(response.status) + " " + string(response.body)'
          outputs:
          - name: image
            fromExpression: response.body.spec.template.spec.containers[0].image
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-spike
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: releases
    sources:
      stages: [dev]
  promotionTemplate:
    spec:
      vars:
      - name: imageRepo
        value: ghcr.io/smsilva/kargo-spike
      - name: apiServer
        value: https://vcluster.env-kargo-prod.svc.cluster.local:7101
      - name: secretName
        value: vcluster-prod
      steps:
      - uses: http
        as: patch-image
        config:
          method: PATCH
          url: ${{ vars.apiServer }}/apis/apps/v1/namespaces/app/deployments/kargo-spike
          insecureSkipTLSVerify: true
          headers:
          - name: Authorization
            value: Bearer ${{ secret(vars.secretName).token }}
          - name: Content-Type
            value: application/strategic-merge-patch+json
          body: '${{ quote({"spec": {"template": {"spec": {"containers": [{"name": "kargo-spike", "image": vars.imageRepo + ":" + imageFrom(vars.imageRepo).Tag } ] } } } } ) }}'
          successExpression: response.status == 200
          failureExpression: response.status != 200
          errorExpression: 'string(response.status) + " " + string(response.body)'
          outputs:
          - name: image
            fromExpression: response.body.spec.template.spec.containers[0].image
