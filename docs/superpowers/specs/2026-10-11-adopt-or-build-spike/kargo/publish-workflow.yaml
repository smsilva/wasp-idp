name: publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Image tag (semver)
        required: true
      request-id:
        description: Platform request id, stored as an OCI annotation
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BASE_VERSION: "0.2.0"
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          else
            branch="$(echo "${GITHUB_REF_NAME}" | tr '/_' '--' | tr -cd 'a-zA-Z0-9-')"
            version="${BASE_VERSION}-${branch}.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.skip != 'true'
      - uses: docker/login-action@v3
        if: steps.version.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.version.outputs.skip != 'true'
        with:
          provenance: false
          outputs: type=image,push=true,oci-mediatypes=true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          annotations: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            me.silvios.wasp.request-id=${{ inputs.request-id }}
