apiVersion: apps/v1
kind: Deployment
metadata:
  name: details
  labels:
    app.kubernetes.io/name: details
    backstage.io/kubernetes-id: details
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: details
  template:
    metadata:
      labels:
        app.kubernetes.io/name: details
        backstage.io/kubernetes-id: details
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: details
          image: app
          ports:
            - name: http
              containerPort: 9080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
