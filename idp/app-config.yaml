app:
  title: Scaffolded Backstage App
  baseUrl: http://localhost:3000

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # Disable default themes and use custom blue themes
    - theme:app/light: false
    - theme:app/dark: false

    # Configure the catalog index page to be the root page, this is normally mounted on /catalog
    - page:catalog:
        config:
          path: /

    # Compact filter column (packages/app/src/modules/catalogPage) replaces
    # the stock pickers, which stack one block per filter
    - catalog-filter:catalog/kind: false
    - catalog-filter:catalog/type: false
    - catalog-filter:catalog/list: false
    - catalog-filter:catalog/mode: false
    - catalog-filter:catalog/lifecycle: false
    - catalog-filter:catalog/tag: false
    - catalog-filter:catalog/processing-status: false
    - catalog-filter:catalog/namespace: false

    # The APIs tab (entity-content:api-docs/apis) already lists provided and
    # consumed APIs; drop the duplicate cards from the Overview tab
    - entity-card:api-docs/provided-apis: false
    - entity-card:api-docs/consumed-apis: false

    # Relation cards on the Overview, above the relations graph, with the same
    # layout on every entity page (#130). Each card only renders when the entity
    # has at least one relation of its kind, so empty tables are hidden. Order
    # here is the order rendered.
    - entity-card:catalog/depends-on-components:
        config:
          filter:
            kind: component
            relations: { $contains: { type: dependsOn, targetRef: { $hasPrefix: 'component:' } } }
    - entity-card:catalog/depends-on-resources:
        config:
          filter:
            kind: component
            relations: { $contains: { type: dependsOn, targetRef: { $hasPrefix: 'resource:' } } }
    - entity-card:catalog/has-subcomponents:
        config:
          filter:
            kind: component
            relations: { $contains: { type: hasPart, targetRef: { $hasPrefix: 'component:' } } }
    - entity-card:catalog/has-components:
        config:
          filter:
            kind: system
            relations: { $contains: { type: hasPart, targetRef: { $hasPrefix: 'component:' } } }
    - entity-card:catalog/has-resources:
        config:
          filter:
            kind: system
            relations: { $contains: { type: hasPart, targetRef: { $hasPrefix: 'resource:' } } }

    # Entity header (#124, #130, packages/app/src/modules/entityHeader): the
    # custom header layout shows breadcrumb, description, Owner/Lifecycle and
    # the Source link, plus the context menu, so the About card goes away.
    # TechDocs is already a tab, so its icon link stays off the header. Order
    # here is the order rendered.
    - entity-card:catalog/about: false
    - entity-icon-link:catalog/view-source:
        attachTo: { id: entity-header-layout:catalog/wasp, input: iconLinks }
    - entity-icon-link:techdocs/read-docs: false
    - entity-context-menu-item:catalog/refresh-entity
    - entity-context-menu-item:catalog/edit-entity
    - entity-context-menu-item:catalog/copy-entity-url:
        attachTo: { id: entity-header-layout:catalog/wasp, input: contextMenuItems }
    - entity-context-menu-item:catalog/inspect-entity:
        attachTo: { id: entity-header-layout:catalog/wasp, input: contextMenuItems }
    - entity-context-menu-item:catalog/unregister-entity:
        attachTo: { id: entity-header-layout:catalog/wasp, input: contextMenuItems }

    # Domain page (#129): the stock has-subdomains/has-systems tables, each
    # only when the domain has at least one relation of its kind, so a domain
    # without subdomains shows no empty table.
    - entity-card:catalog/has-subdomains:
        config:
          filter:
            kind: domain
            relations: { $contains: { type: hasPart, targetRef: { $hasPrefix: 'domain:' } } }
    - entity-card:catalog/has-systems:
        config:
          filter:
            kind: domain
            relations: { $contains: { type: hasPart, targetRef: { $hasPrefix: 'system:' } } }

organization:
  name: My Company

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection: ':memory:'
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # GitHub App wasp-foundry-backstage, created with `yarn backstage-cli create-github-app wasp-foundry`.
      # The credentials file is gitignored (idp/.gitignore: *-credentials.yaml).
      apps:
        - $include: github-app-wasp-foundry-backstage-credentials.yaml
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  environment: development
  providers:
    guest: {}
    google:
      development:
        clientId: ${GOOGLE_CLIENT_ID}
        clientSecret: ${GOOGLE_CLIENT_SECRET}

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  providers:
    github:
      waspFoundry:
        organization: wasp-foundry
        catalogPath: /catalog-info.yaml
        filters:
          branch: main
        schedule:
          frequency: { minutes: 5 }
          timeout: { minutes: 3 }
          initialDelay: { seconds: 15 }
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    # Local example data, file locations are relative to the backend process, typically `packages/backend`
    - type: file
      target: ../../examples/entities.yaml

    # Local example template
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]

    # Foundry templates (apps created in the wasp-foundry GitHub org)
    - type: file
      target: ../../templates/python-service/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    # Product teams (owners in the python-service template)
    - type: file
      target: ../../catalog/org.yaml
      rules:
        - allow: [Group]

    # Bookinfo domain and system
    - type: file
      target: ../../catalog/bookinfo.yaml
      rules:
        - allow: [Domain, System]

    # Platform system and the k3d environment clusters as resources (#118)
    - type: file
      target: ../../catalog/platform.yaml
      rules:
        - allow: [System, Resource]

    # Communication domain: subdomains, systems and resources around greeting-api/notification-api (#114)
    - type: file
      target: ../../catalog/communication/catalog-info.yaml
      rules:
        - allow: [Domain, System, Resource]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options
  # Local k3d clusters from scripts/cluster-zero. Credentials, before yarn start:
  #   eval "$(scripts/cluster-zero/backstage-reader --cluster development)"
  #   eval "$(scripts/cluster-zero/backstage-reader --cluster production)"
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: development
          url: https://127.0.0.1:6551
          authProvider: serviceAccount
          serviceAccountToken: ${K8S_DEVELOPMENT_TOKEN}
          caData: ${K8S_DEVELOPMENT_CA}
        - name: production
          url: https://127.0.0.1:6552
          authProvider: serviceAccount
          serviceAccountToken: ${K8S_PRODUCTION_TOKEN}
          caData: ${K8S_PRODUCTION_CA}

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true
