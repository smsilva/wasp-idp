# Example domain with subdomains around greeting-api and notification-api (#114).
# The resources are descriptive only and cloud-agnostic (described by role,
# never by cloud service): nothing here provisions a database, queue, topic or
# bucket. The Components live in their own repos
# (wasp-foundry/greeting-api, wasp-foundry/notification-api) and point back here via
# spec.system; the Resources attach to them with dependencyOf.
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-domain
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: communication
  description: Everything that sends a message to someone — greetings and the notifications they trigger
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: group:default/team-alpha
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: messaging
  description: Producing greetings and publishing an event for each one
spec:
  owner: group:default/team-alpha
  subdomainOf: communication
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: notifications
  description: Reacting to greeting events and producing reports
spec:
  owner: group:default/team-beta
  subdomainOf: communication
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: greeter
  description: Greets callers, stores each greeting and publishes a greeting event
  annotations:
    backstage.io/techdocs-ref: dir:./greeter
spec:
  owner: group:default/team-alpha
  domain: messaging
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: notifier
  description: Consumes greeting events from a queue and writes periodic reports
spec:
  owner: group:default/team-beta
  domain: notifications
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-resource
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: greeting-db
  description: Relational database with the greetings table
spec:
  type: database
  owner: group:default/team-alpha
  system: greeter
  dependencyOf:
    - component:default/greeting-api
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: greeting-events
  description: Pub/sub topic with one greeting.created event per greeting
spec:
  type: topic
  owner: group:default/team-alpha
  system: greeter
  dependencyOf:
    - component:default/greeting-api
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: greeting-avatars
  description: Object storage bucket for avatar images attached to greetings
spec:
  type: object-storage
  owner: group:default/team-alpha
  system: greeter
  dependencyOf:
    - component:default/greeting-api
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: notification-db
  description: Relational database with delivered notifications
spec:
  type: database
  owner: group:default/team-beta
  system: notifier
  dependencyOf:
    - component:default/notification-api
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: notification-jobs
  description: Message queue subscribed to greeting-events (topic → queue fan-out)
spec:
  type: queue
  owner: group:default/team-beta
  system: notifier
  dependsOn:
    - resource:default/greeting-events
  dependencyOf:
    - component:default/notification-api
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: notification-reports
  description: Object storage bucket with the daily notification reports
spec:
  type: object-storage
  owner: group:default/team-beta
  system: notifier
  dependencyOf:
    - component:default/notification-api
