---
# The platform team's own area: the shared infrastructure every product deploys to.
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-domain
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: platform
  description: The platform team's own area — shared infrastructure for every product
spec:
  owner: group:default/team-platform
---
# Shared platform infrastructure. The k3d environment clusters are not part of any
# product System: every Component created by the python-service template depends on
# them (#118).
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: platform
  description: Shared platform infrastructure — the environment clusters every app deploys to
spec:
  owner: group:default/team-platform
  domain: platform
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-resource
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: development
  description: k3d cluster "development" (API 127.0.0.1:6551, apps on localhost:9081), deployed by the cluster-zero ArgoCD
spec:
  type: kubernetes-cluster
  owner: group:default/team-platform
  system: platform
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: production
  description: k3d cluster "production" (API 127.0.0.1:6552, apps on localhost:9082), deployed by the cluster-zero ArgoCD
spec:
  type: kubernetes-cluster
  owner: group:default/team-platform
  system: platform
---
# The shared Postgres of the platform (#305): postgres in mode compose makes a role and a database
# per workload in it. Deployed by `platform init` (platform/providers/forager/deploy/shared-pg.yaml).
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: shared-pg
  description: Shared Postgres in platform-local (namespace platform-resources), where postgres in mode compose creates one database per workload
spec:
  type: postgres
  owner: group:default/team-platform
  system: platform
