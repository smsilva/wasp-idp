---
# Composition Functions usadas pelas Compositions em aws/eks/resources/.
# Aplicadas por aws/eks/scripts/install-functions (passo entre install-providers e
# configure-aws-creds). São pkg.crossplane.io como os Providers — mesmo conceito de
# pacote OCI, puxadas de xpkg.* e reconciliadas até condition=Healthy.
#
# Versões fixadas (nunca :latest, para reprodutibilidade). Fonte: skill kubernetes
# (values-functions.yaml) para as 3 primeiras; marketplace para environment-configs.
#
# Quem usa o quê (grep name: function- em resources/*/composition.yaml):
#   patch-and-transform -> network, cluster, environment, argocd (única exigida pela Network)
#   environment-configs -> cluster
#   auto-ready, kcl     -> pipelines de cluster/environment
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.10.8
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-environment-configs
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-environment-configs:v0.7.3
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.7.0
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-kcl
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-kcl:v0.12.2
