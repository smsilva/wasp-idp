---
# ProviderConfig "hub": credencial direta do IAM user crossplane-poc (conta hub). Recursos
# que referenciarem providerConfigName: hub são criados NA CONTA HUB. Aplicado pelo
# configure-aws-creds (junto com o Secret aws-iam-credential).
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: hub
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-iam-credential
      key: creds
