kind: Provider
metadata:
  name: upbound-provider-aws-route53
spec:
  package: xpkg.upbound.io/upbound/provider-aws-route53:v2.5.1
# Providers da fatia 2: entregam a plataforma DENTRO do EKS remoto. O provider-helm
# instala charts (Release) e o provider-kubernetes aplica CRs (Object); ambos autenticam
# via o Secret kubeconfig do ClusterAuth (ver chart/templates/72-cluster-auth.yaml +
# 74-remote-providerconfigs.yaml). Versões espelham o lab de referência
# (~/git/kubernetes/lab/crossplane/packages/providers-others.yaml).
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-helm
spec:
  package: xpkg.upbound.io/upbound/provider-helm:v1
---
