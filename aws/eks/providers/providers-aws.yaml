# provider-aws-route53 (fatia 2): sub-zona delegada por ambiente +
# registro wildcard (ADR-delta 2026-08-13, reverte a decisão 3). Mesma família/versão dos
# demais AWS. Fornece os Kinds Zone e Record (route53.aws.upbound.io).
---
