---
# ProviderConfig cross-account: mesma credencial base do crossplane-poc (hub), mas assume
# a role crossplane-sandbox na conta sandbox (spoke) via STS. Recursos que referenciarem
# este ProviderConfig (providerConfigRef.name: spoke-sandbox) são criados NA SANDBOX, não
# na hub. Bootstrap da role: aws/eks/providers/spoke-trust-policy.json + bootstrap-iam-policy.json.
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: spoke-sandbox
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-iam-credential
      key: creds
  assumeRoleChain:
    - roleARN: arn:aws:iam::<spoke-account-id>:role/crossplane-sandbox
