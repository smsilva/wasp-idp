# Valores do platform-bootstrap. Espelham os specs dos XRs em resources/{network,cluster}.
#
# id compartilhado: Network e Cluster DEVEM ter o mesmo id — é o label
# environment.example.com/env=<id> que casa as subnets do Network com o EKS do Cluster.
id: net01
prefix: poc-eks
region: us-east-1

# ---------- Grupo 100: Network (VPC/subnets/NAT) ----------
network:
  # vpcCidrSecondOctet: N em 10.<N>.0.0/16 (supernet 10.0.0.0/12). N=0 reservado p/ Org.
  vpcCidrSecondOctet: 1

# ---------- Grupo 200: Cluster (EKS/IAM/ponte) ----------
cluster:
  # habilita/desabilita o grupo 200 (EnvironmentConfig + XR Cluster + waiter). Custo alto
  # (EKS control plane + nodes) — deixe false até querer provisionar o EKS.
  enabled: false
  # crossplaneArn: ARN do IAM user do Crossplane, consumido pela Composition do Cluster
  # (via function-environment-configs) para dar acesso admin. Placeholder genérico no repo;
  # passe o valor real via --set cluster.crossplaneArn=... ou values-local (não versionar).
  crossplaneArn: arn:aws:iam::<account-id>:user/crossplane-poc
  nodeGroup:
    instanceType: t3.medium
    desiredSize: 3
    minSize: 3
    maxSize: 4

# waiter: Job (hook) que espera o XR ficar Ready antes de o Helm concluir a fase.
waiter:
  # imagem com kubectl. Oficial do projeto k8s (registry.k8s.io) — bitnami/kubectl
  # deixou de resolver no Docker Hub. Trocar se o cluster tiver mirror/registry próprio.
  image: registry.k8s.io/kubectl:v1.35.7
  # timeout do kubectl wait no XR Network (NAT Gateway domina; ~2-5 min típico).
  networkTimeout: 600s
  # timeout do kubectl wait no XR Cluster (EKS ~15min + NodeGroup ~10min).
  clusterTimeout: 1800s
