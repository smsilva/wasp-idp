{{- if .Values.cluster.enabled }}
{{/*
EnvironmentConfig do hub — RECURSO NORMAL. Valores compartilhados por todos os Clusters
deste hub; hoje só o crossplaneArn (ARN do IAM user do Crossplane), consumido pela
Composition do Cluster via o step function-environment-configs para dar acesso admin
(AccessEntry/AccessPolicyAssociation).

Nome FIXO poc-eks-hub-config: a Composition (cluster/composition.yaml) referencia o
EnvironmentConfig por esse nome (type: Reference), não por label. Não renomear.

crossplaneArn vem de .Values.cluster.crossplaneArn — default genérico no repo
(<account-id>); passe o real via --set ou values-local (não versionar o account-id).
*/}}
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: poc-eks-hub-config
  labels:
    platform.example.com/hub: poc-idp
data:
  crossplaneArn: {{ .Values.cluster.crossplaneArn | quote }}
{{- end }}
