{{/*
XR Network — RECURSO NORMAL do release (não é hook), para que helm upgrade reconcilie
mudanças e helm uninstall dispare o teardown da VPC/subnets/NAT via Crossplane.
A ORDEM/barreira é dada pelo waiter hook (120-wait-network.yaml), não por este recurso.
*/}}
apiVersion: platform.example.com/v1alpha1
kind: Network
metadata:
  name: {{ include "platform-bootstrap.networkName" . }}
spec:
  id: {{ .Values.network.id }}
  prefix: {{ .Values.network.prefix }}
  region: {{ .Values.network.region }}
  vpcCidrSecondOctet: {{ .Values.network.vpcCidrSecondOctet }}
