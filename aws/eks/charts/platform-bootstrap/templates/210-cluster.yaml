{{- if .Values.cluster.enabled }}
{{/*
XR Cluster — RECURSO NORMAL do release (não é hook), como o Network: helm upgrade
reconcilia e helm uninstall dispara o teardown do EKS/NodeGroup/IAM via Crossplane.

CONSOME a rede do Network de MESMO id por label environment.example.com/env=<id> (as
subnets são casadas por matchLabels na Composition). Pré-requisito: o Network de mesmo id
já Ready no hub (grupo 100). A barreira é o waiter hook (230-wait-cluster.yaml).

⚠️ EKS REAL: ~28-30 min, control plane (~$0.10/h) + nodeGroup (3× t3.medium por default)
+ usa o NAT do Network. Só com cluster.enabled=true e sob autorização explícita.
*/}}
apiVersion: platform.example.com/v1alpha1
kind: Cluster
metadata:
  name: {{ include "platform-bootstrap.clusterName" . }}
spec:
  id: {{ .Values.id }}
  prefix: {{ .Values.prefix }}
  region: {{ .Values.region }}
  nodeGroup:
    instanceType: {{ .Values.cluster.nodeGroup.instanceType }}
    desiredSize: {{ .Values.cluster.nodeGroup.desiredSize }}
    minSize: {{ .Values.cluster.nodeGroup.minSize }}
    maxSize: {{ .Values.cluster.nodeGroup.maxSize }}
{{- end }}
