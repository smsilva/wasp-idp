apiVersion: v2
name: platform-bootstrap
description: >-
  Orquestra os XRs de plataforma (resources/) em sequência via Helm hooks.
  Cada XR é recurso normal do release (teardown/upgrade limpos); um Job
  "waiter" como post-install/post-upgrade hook bloqueia até o XR ficar Ready
  antes do próximo passo. Fatia atual: só Network.
type: application
