# Exemplo do Cluster isolado — 2ª fatia da decomposição.
# Provisiona EKS + IAM + NodeGroup + ponte (14 MRs), CONSUMINDO a rede de um Network com o
# MESMO metadata.name (as subnets são casadas por label environment.example.com/env=<metadata.name>).
#
# PRÉ-REQUISITO: um Network com metadata.name igual ao daqui já Ready no Control Plane (ex.: net01). Sem
# ele, o EKS Cluster/NodeGroup ficam esperando o selector resolver (nenhuma subnet casa).
#
# ⚠️ EKS REAL: ~28-30 min, custo control plane (~$0.10/h) + 3×t3.medium + usa o NAT do Network.
# Só aplicar sob autorização explícita.
apiVersion: platform.example.com/v1alpha1
kind: Cluster
metadata:
  name: net01           # DEVE bater com o metadata.name do Network (casa as subnets por label)
spec:
  providerConfigName: network   # DEVE bater com o providerConfigName do Network de mesmo metadata.name
  # prefix (poc-eks), region (us-east-1), nodeGroup (t3.medium 3/3/4): defaults do XRD.
