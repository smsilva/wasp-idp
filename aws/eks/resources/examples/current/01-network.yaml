# Claim de exemplo do Network isolado — teste da 1ª fatia da decomposição.
# Provisiona SÓ a pegada de rede (16 MRs: VPC→RTA). Sem custo relevante (VPC/subnets/RT são
# grátis; NAT+EIP têm custo pequeno de hora). external-names determinísticos: poc-eks-net01-*.
#
# Para o teste de comportamento-idêntico com o env01, use id: env01 (mesmos CIDRs/AZs/tags).
# Aqui usamos net01 para não colidir com a destruição do env01 em andamento.
apiVersion: platform.example.com/v1alpha1
kind: Network
metadata:
  name: net01
spec:
  id: net01
  # prefix (poc-eks) e region (us-east-1): defaults do XRD.
