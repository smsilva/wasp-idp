apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: clusters.platform.example.com
spec:
  # Cluster-scoped, como Environment/Network: um Cluster é o EKS + identidade (IAM) + ponte
  # (ClusterAuth/AccessEntry/ProviderConfigs) de um Environment. Segunda das 2 abstrações da
  # decomposição. CONSOME a rede de um Network por LABEL (matchLabels env=<metadata.name>,
  # sem matchControllerRef). IDENTIDADE = metadata.name (Crossplane v2, XR sem claim → nome
  # estável): este Cluster DEVE ter o MESMO metadata.name do Network cuja rede consome.
  # (O que o Crossplane hasheia é o nome dos MRs COMPOSTOS, não o do XR — por isso o cruzamento
  # é por label, mas a identidade do XR em si é o metadata.name.) Ver brainstorm 2026-08-14
  # (Decisão 2) + blueprint XEKSCluster.
  #
  # Kind "Cluster" colide em nome curto com eks.aws.upbound.io/Cluster e outros — sempre
  # qualificar por grupo (cluster.platform.example.com) em kubectl. Aceito: o brainstorm
  # fixou o nome sem prefixo X (convenção do repo). Revisar se atrapalhar na prática.
  scope: Cluster
  group: platform.example.com
  names:
    kind: Cluster
    plural: clusters
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - providerConfigName
              properties:
                prefix:
                  type: string
                  default: poc-eks
                region:
                  type: string
                  default: us-east-1
                providerConfigName:
                  type: string
                  description: >-
                    Nome do ProviderConfig AWS que os MRs de IAM/EKS usam. "hub" cria na conta
                    do crossplane-poc (hub); "sandbox" (assumeRoleChain) cria na conta spoke.
                    DEVE bater com o providerConfigName do Network de mesmo metadata.name.
                    Não afeta os ProviderConfigs remotos helm/kubernetes (in-cluster).
                    OBRIGATÓRIO (sem default): um XR sem este campo é rejeitado — falha-fechado.
                    O enum é o ALLOWLIST de ProviderConfigs desta instância (defense-in-depth);
                    ajustar a lista ao adotar em outra conta/instância.
                  enum:
                    - hub
                    - sandbox
                nodeGroup:
                  type: object
                  description: Configuração do NodeGroup gerenciado.
                  properties:
                    instanceType:
                      type: string
                      default: t3.medium
                    desiredSize:
                      type: integer
                      default: 3
                    minSize:
                      type: integer
                      default: 3
                    maxSize:
                      type: integer
                      default: 4
                  default: {}
            status:
              type: object
              properties:
                ready:
                  type: boolean
                clusterName:
                  type: string
                  description: Nome do EKS (<prefix>-<metadata.name>).
                clusterArn:
                  type: string
                  description: ARN do cluster (status.atProvider.arn).
                oidcIssuer:
                  type: string
                  description: >-
                    OIDC issuer URL (status.atProvider.identity[0].oidc[0].issuer) — base de
                    IRSA/Pod Identity para a plataforma-no-spoke (fatia futura).
                kubeconfigSecret:
                  type: string
                  description: >-
                    Nome do Secret-kubeconfig publicado pelo MR ClusterAuth em crossplane-system
                    (<prefix>-<metadata.name>-kubeconfig). É o CONTRATO consumido por satélites (ArgoCDInstance).
