apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: networks.platform.example.com
spec:
  # Cluster-scoped, como o Environment: um Network é a pegada de REDE durável de um
  # cluster (control-plane-owned). Primeira das 2 abstrações da decomposição (a outra é
  # Cluster). O Environment vira orquestrador fino que compõe Network + Cluster.
  #
  # Contrato de saída (Pilar 5 PE 2.0, "API-first contract"): o Network taggeia TODAS as
  # subnets com environment.example.com/env=<metadata.name> + cluster-subnet/tier, e o Cluster
  # as seleciona por matchLabels (SEM matchControllerRef, pois atravessam XRs). Publica também
  # vpcId/subnetIds no status para diagnóstico sem inspecionar os 16 MRs um a um.
  #
  # IDENTIDADE = metadata.name (Crossplane v2, XR namespaced/cluster-scoped SEM claim → nome
  # estável e controlado por quem cria). Não há spec.id: o metadata.name deriva os external-names
  # (<prefix>-<metadata.name>-*) e o label env. O Cluster de MESMO metadata.name casa as subnets.
  scope: Cluster
  group: platform.example.com
  names:
    kind: Network
    plural: networks
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - providerConfigName
              properties:
                prefix:
                  type: string
                  description: Prefixo do naming (configurável p/ adoção por outros times).
                  default: poc-eks
                region:
                  type: string
                  default: us-east-1
                providerConfigName:
                  type: string
                  description: >-
                    Nome do ProviderConfig AWS que cada MR usa = nome da CONTA de destino.
                    "network" cria na conta do crossplane-poc (Connectivity Account);
                    "wasp-nonprod" (assumeRoleChain) cria na conta spoke.
                    Ver aws/eks/providers/provider-config-network.yaml e provider-config-wasp-nonprod.yaml.
                    OBRIGATÓRIO (sem default): um XR sem este campo é rejeitado — falha-fechado,
                    não vaza para a conta network por omissão. O enum é o ALLOWLIST de
                    ProviderConfigs desta instância (defense-in-depth); ajustar a lista ao adotar
                    em outra conta/instância — os nomes de spoke são por-instância.
                  enum:
                    - network
                    - wasp-nonprod
                vpcCidrSecondOctet:
                  type: integer
                  description: >-
                    Segundo octeto do /16 do spoke na supernet 10.0.0.0/12
                    (10.<N>.0.0/16). N=0 é reservado para a Org/raiz; spokes usam
                    1..15 (limite do /12). As 4 subnets derivam por string-format:
                    10.<N>.{1,2,3,4}.0/24. Endereçamento é a decisão IRREVERSÍVEL
                    (re-endereçar exige recriar a VPC) — ver
                    ../../../docs/network/01-cidr-addressing.md.
                    Spokes de tamanho != /16 são extensão futura (function-kcl); hoje
                    só /16 alinhado.
                  minimum: 1
                  maximum: 15
                  default: 1
            status:
              type: object
              properties:
                ready:
                  type: boolean
                vpcId:
                  type: string
                  description: ID real da VPC (status.atProvider.id do MR vpc), publicado p/ diagnóstico.
                subnetIds:
                  type: object
                  description: IDs reais das 4 subnets, por papel. Consumo humano/diagnóstico (o Cluster casa por label, não por estes IDs).
                  properties:
                    publicA:
                      type: string
                    publicB:
                      type: string
                    privateA:
                      type: string
                    privateB:
                      type: string
