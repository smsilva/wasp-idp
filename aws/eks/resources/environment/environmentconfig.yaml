# Config global do Control Plane (opção b do README/crossplaneArn): valores compartilhados por
# TODOS os Environments deste Control Plane — hoje só o ARN do IAM user do Crossplane
# (crossplane-poc), consumido pela fase 72 (ClusterAuth/AccessEntry) via o step
# function-environment-configs da Composition. Aplicar uma vez no Control Plane, antes do 1º claim
# Environment:
#   kubectl apply -f aws/eks/resources/environment/environmentconfig.yaml
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: control-plane-config
  labels:
    platform.example.com/control-plane: control-plane
data:
  # Conta <account-id> (ver aws/CLAUDE.md) — IAM user dedicada do Crossplane.
  crossplaneArn: arn:aws:iam::<account-id>:user/crossplane-poc
