# Backend httpbin: Namespace + Deployment + Service no ns da aplicação (echo).
# Servidor trivial e descartável — só ecoa a request para provar o caminho E2E
# (browser → Route53 → NLB → ingressgateway → VirtualService → httpbin → 200).
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: poc-cloud-idp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: {{ .Values.namespace }}
  labels:
    app: echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: httpbin
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          readinessProbe:
            httpGet:
              path: /status/200
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: {{ .Values.namespace }}
  labels:
    app: echo
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: http
