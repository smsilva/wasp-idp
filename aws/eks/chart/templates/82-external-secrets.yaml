{{- $fullClusterName := include "eks.fullClusterName" . -}}
{{- $es := .Values.externalSecrets -}}
{{- if $es.enabled }}
# external-secrets (ESO) instalado via provider-helm no EKS remoto (fatia 2).
# Release = MR do Crossplane (helm.crossplane.io), aplicado pelo mesmo Crossplane que
# provisiona o EKS (ADR decisão 5 — plataforma via provider-helm). O SA do chart
# (serviceAccount.name) é o alvo da PodIdentityAssociation da fase 80, aplicada ANTES
# deste Release — assim os pods do ESO já nascem com a Pod Identity resolvida (sem a race
# que exigiria rollout restart; a validação confirmou). Por isso NÃO setamos
# serviceAccount.annotations (Pod Identity não usa annotation de role, ao contrário de
# IRSA). wait=true segura até os deployments ficarem prontos.
---
apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: {{ $fullClusterName }}-external-secrets
spec:
  forProvider:
    namespace: {{ $es.namespace | quote }}
    chart:
      name: {{ $es.chartName | quote }}
      repository: {{ $es.chartRepository | quote }}
      version: {{ $es.chartVersion | quote }}
    values:
      installCRDs: true
      serviceAccount:
        create: true
        name: {{ $es.serviceAccount | quote }}
  rollbackLimit: 3
  providerConfigRef:
    name: {{ $fullClusterName }}-helm
{{- end }}