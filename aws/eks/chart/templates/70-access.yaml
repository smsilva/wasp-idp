{{- $fullClusterName := include "eks.fullClusterName" . -}}
{{- if not .Values.callerArn }}
{{- fail "callerArn is empty — pass --set callerArn=$(aws sts get-caller-identity --query Arn --output text) (see scripts/configure-access)" }}
{{- end }}
---
apiVersion: eks.aws.upbound.io/v1beta1
kind: AccessEntry
metadata:
  name: {{ $fullClusterName }}-access-entry
spec:
  forProvider:
    region: {{ .Values.region }}
    clusterNameRef:
      name: {{ $fullClusterName }}
    principalArn: {{ .Values.callerArn | quote }}
    tags:
      Name: {{ $fullClusterName }}-access-entry
---
apiVersion: eks.aws.upbound.io/v1beta1
kind: AccessPolicyAssociation
metadata:
  name: {{ $fullClusterName }}-access-admin
spec:
  forProvider:
    region: {{ .Values.region }}
    clusterNameRef:
      name: {{ $fullClusterName }}
    principalArn: {{ .Values.callerArn | quote }}
    policyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
    accessScope:
      type: cluster
