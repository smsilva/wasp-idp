image:
  repository: ghcr.io/mccutchen/go-httpbin
  tag: "2.21.0"
  pullPolicy: IfNotPresent

replicaCount: 2

# Porta do processo dentro do container. A imagem expõe 8080 e roda como usuário 65532 — porta
# baixa exigiria capability que o pod não tem.
containerPort: 8080

# Porta do Service. 80 porque é o que o VirtualService roteia.
servicePort: 80

# Host e referência do Gateway, ambos obrigatórios: sem eles a rota não existe.
host: ""
gateway: ""

routePrefix: /
