[project]
name = "wasp-platform"
version = "0.1.0"
description = "platform: CLI of the wasp-idp Platform API"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6",
  "wasp-templates",
  "rich>=13",
]

# The package cannot be named "platform": it would shadow the stdlib module of the same name.
[project.scripts]
platform = "wasp_platform.cli:app"

# The renderer shared with the CLI, the API and the component creation controller (#204).
[tool.uv.sources]
wasp-templates = { path = "../platform/libs/templates", editable = true }

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wasp_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
