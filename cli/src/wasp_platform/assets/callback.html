<!doctype html>
<html lang="{lang}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title} · platform-api</title>
<style>
/* The page at the end of `platform login` (#173). Inline only: no external assets. */
:root {{ --bg: #0a0b0e; --panel: #121418; --term: #08090b; --line: #23262d; --line-2: #2e323b; --fg: #e8eaee; --fg-2: #a4abb8; --fg-3: #707785; --fg-4: #4f5562;
  --accent: #5aa9ff; --ok: #7ee787; --err: #ff7b72; --hover: #171a20; color-scheme: dark; }}
* {{ box-sizing: border-box; }}
body {{ margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; padding: 0 24px; color: var(--fg); background: var(--bg);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; position: relative; }}
/* The name as the wall the page stands on, and a faint dot grid around the panel. */
.ghost {{ position: absolute; left: 50%; bottom: -0.18em; transform: translateX(-50%); font: 800 clamp(96px, 22vw, 300px)/1 system-ui, sans-serif; letter-spacing: -.06em;
  color: transparent; -webkit-text-stroke: 1px rgba(90, 169, 255, .07); background: linear-gradient(180deg, rgba(90, 169, 255, .06), transparent 70%);
  -webkit-background-clip: text; background-clip: text; white-space: nowrap; pointer-events: none; user-select: none; }}
body::before {{ content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, .055) 1px, transparent 1.2px); background-size: 14px 14px;
  -webkit-mask-image: radial-gradient(70% 60% at 50% 55%, #000, transparent); mask-image: radial-gradient(70% 60% at 50% 55%, #000, transparent); pointer-events: none; }}
/* Header and footer: glass bars edge to edge; the panel sits in the space between them. */
.bar {{ position: relative; z-index: 1; display: flex; align-items: center; width: calc(100% + 48px); margin: 0 -24px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, .018)); border: solid rgba(255, 255, 255, .07);
  -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%); }}
header.bar {{ border-width: 0 0 1px; gap: 12px; padding: 14px 28px; }}
header b {{ font: 700 18px ui-monospace, "JetBrains Mono", Consolas, monospace; letter-spacing: -.02em; }}
header b span {{ color: var(--fg-3); font-weight: 400; }}
header small {{ display: block; font-size: 12.5px; color: var(--fg-3); }}
footer.bar {{ border-width: 1px 0 0; align-self: end; }}
footer a {{ display: flex; flex-direction: column; gap: 2px; padding: 16px 28px; color: inherit; text-decoration: none; box-shadow: 1px 0 0 rgba(255, 255, 255, .06); transition: background-color .2s; }}
footer a b {{ font-weight: 600; font-size: 14.5px; color: var(--fg-2); transition: color .2s; }}
footer a small {{ font-size: 12.5px; color: var(--fg-4); }}
footer a:hover {{ background: rgba(255, 255, 255, .03); }}
footer a:hover b {{ color: var(--fg); }}
footer .note {{ margin-left: auto; padding: 0 28px; font-size: 12.5px; color: var(--fg-4); }}
main {{ position: relative; z-index: 1; align-self: center; width: 100%; max-width: 480px; margin: 28px 0; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); padding: 26px 22px 24px; }}
h1 {{ margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: -.01em; }}
.sub {{ margin: 4px 0 18px; color: var(--fg-3); font-size: 14px; }}
.term {{ background: var(--term); border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; }}
.tb {{ display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-bottom: 1px solid var(--line); }}
.tb i {{ width: 10px; height: 10px; border-radius: 50%; background: var(--line-2); display: block; }}
.tb b {{ margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: {dot}; }}
pre {{ margin: 0; padding: 16px 18px 14px; font: 15px/1.75 ui-monospace, "JetBrains Mono", Consolas, monospace; color: var(--fg-2); white-space: pre-wrap; }}
.p {{ color: var(--accent); }} .okc {{ color: var(--ok); }} .errc {{ color: var(--err); }}
/* The next commands copy themselves; once, after the page settles, each takes its hover state in turn. */
.cps {{ display: flex; flex-direction: column; padding: 2px 10px 14px; }}
.cps:empty {{ display: none; }}
.cp {{ all: unset; cursor: pointer; display: flex; gap: 6px; padding: 3px 8px; border-radius: 6px; font: 15px/1.75 ui-monospace, "JetBrains Mono", Consolas, monospace; color: var(--fg-3);
  transition: background-color .2s, color .2s; }}
.cp .tag {{ margin-left: auto; font: 12.5px system-ui, sans-serif; color: var(--fg-3); opacity: 0; transition: opacity .2s; }}
.cp .tag::after {{ content: "{copy}"; }}
.cp:hover, .cp:focus-visible, .cp.hint {{ background: var(--hover); color: var(--fg); }}
.cp:hover .tag, .cp:focus-visible .tag, .cp.hint .tag, .cp.done .tag {{ opacity: 1; }}
.cp.done .tag::after {{ content: "{copied} ✓"; color: var(--ok); }}
.cp:focus-visible, footer a:focus-visible {{ outline: 2px solid var(--accent); outline-offset: -2px; }}
@media (prefers-reduced-motion: reduce) {{ .cp, .cp .tag, footer a, footer a b {{ transition: none; }} }}
@media (max-width: 520px) {{
  body {{ padding: 0 14px; }} .bar {{ width: calc(100% + 28px); margin: 0 -14px; }}
  header.bar {{ padding: 12px 16px; }} header b {{ font-size: 16px; }}
  footer a {{ padding: 14px 16px; }} footer .note {{ display: none; }}
  main {{ padding: 22px 16px 18px; }} h1 {{ font-size: 24px; }}
}}
</style>
</head>
<body>
<div class="ghost" aria-hidden="true">platform-api</div>
<header class="bar"><svg viewBox="0 0 40 32" width="32" height="25" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#a48bff"/></linearGradient></defs><path d="M9 3c-3 0-4 1.5-4 4v4.5c0 2-1 3.5-3 4.5 2 1 3 2.5 3 4.5V25c0 2.5 1 4 4 4" fill="none" stroke="#a4abb8" stroke-width="2.4" stroke-linecap="round"/><path d="M31 3c3 0 4 1.5 4 4v4.5c0 2 1 3.5 3 4.5-2 1-3 2.5-3 4.5V25c0 2.5-1 4-4 4" fill="none" stroke="#a4abb8" stroke-width="2.4" stroke-linecap="round"/><path d="M20 7l9 5-9 5-9-5z" fill="url(#g)"/><path d="M11 16.5l9 5 9-5" fill="none" stroke="url(#g)" stroke-width="2.4" stroke-linejoin="round"/><path d="M11 21l9 5 9-5" fill="none" stroke="url(#g)" stroke-width="2.4" stroke-linejoin="round" opacity=".6"/></svg><div><b>platform-api<span>/v1</span></b><small>{tagline}</small></div></header>
<main>
  <h1>{heading}</h1>
  <p class="sub">{message}</p>
  <div class="term"><div class="tb"><i></i><i></i><i></i><b title="{status}"></b></div><pre><span class="p">$</span> platform login
{term}</pre><div class="cps">{commands}</div></div>
</main>
<footer class="bar">
  <a href="{docs_url}" target="_blank" rel="noopener"><b>{docs}</b><small>{docs_note}</small></a>
  <a href="{repo_url}" target="_blank" rel="noopener"><b>GitHub</b><small>{repo}</small></a>
  <span class="note">{note}</span>
</footer>
<script>
document.querySelectorAll('.cp').forEach((button) => button.addEventListener('click', async () => {{
  await navigator.clipboard.writeText(button.dataset.cmd).catch(() => {{}});
  button.classList.add('done');
  setTimeout(() => button.classList.remove('done'), 1400);
}}));
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {{
  document.querySelectorAll('.cp').forEach((button, index) => {{
    setTimeout(() => button.classList.add('hint'), 900 + index * 700);
    setTimeout(() => button.classList.remove('hint'), 1800 + index * 700);
  }});
}}
</script>
</body>
</html>
