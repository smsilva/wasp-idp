<!doctype html>
<html lang="{lang}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title} · platform-api</title>
<style>
/* The page at the end of `platform login` (#537): the Keycloak theme's card, alone. Inline only: no external assets. */
:root {{ --bg: #0a0b0e; --panel: #121418; --line: #23262d; --fg: #e8eaee; --fg-2: #a4abb8; --fg-3: #707785; --fg-4: #4f5562;
  --accent: #5aa9ff; --ok: #7ee787; --err: #ff7b72; color-scheme: dark; }}
* {{ box-sizing: border-box; }}
body {{ margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 20px;
  color: var(--fg); background: var(--bg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }}
.symbol {{ margin-bottom: 22px; line-height: 0; }}
main {{ width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px 26px 26px; text-align: center; }}
.badge {{ width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; }}
.badge.ok {{ color: var(--ok); border: 1.5px solid rgba(126, 231, 135, .45); background: rgba(126, 231, 135, .08); }}
.badge.fail {{ color: var(--err); border: 1.5px solid rgba(255, 123, 114, .45); background: rgba(255, 123, 114, .08); }}
h1 {{ margin: 0; font-size: 21px; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; }}
p {{ margin: 8px 0 0; color: var(--fg-2); font-size: 14px; }}
.error {{ margin-top: 14px; font: 12px ui-monospace, "JetBrains Mono", Consolas, monospace; color: var(--fg-4); overflow-wrap: anywhere; }}
.error:empty {{ display: none; }}
.under {{ margin-top: 18px; font-size: 12.5px; }}
.under a {{ color: var(--fg-3); text-decoration: none; border-bottom: 1px dotted var(--fg-4); }}
.under a:hover {{ color: var(--fg); }}
.under a:focus-visible {{ outline: 2px solid var(--accent); outline-offset: 2px; }}
@media (max-width: 520px) {{ body {{ padding: 32px 14px; justify-content: flex-start; }} main {{ padding: 22px 18px 22px; }} }}
</style>
</head>
<body>
<div class="symbol"><svg viewBox="0 0 40 32" width="44" height="35" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#a48bff"/></linearGradient></defs><path d="M9 3c-3 0-4 1.5-4 4v4.5c0 2-1 3.5-3 4.5 2 1 3 2.5 3 4.5V25c0 2.5 1 4 4 4" fill="none" stroke="#a4abb8" stroke-width="2.4" stroke-linecap="round"/><path d="M31 3c3 0 4 1.5 4 4v4.5c0 2 1 3.5 3 4.5-2 1-3 2.5-3 4.5V25c0 2.5-1 4-4 4" fill="none" stroke="#a4abb8" stroke-width="2.4" stroke-linecap="round"/><path d="M20 7l9 5-9 5-9-5z" fill="url(#g)"/><path d="M11 16.5l9 5 9-5" fill="none" stroke="url(#g)" stroke-width="2.4" stroke-linejoin="round"/><path d="M11 21l9 5 9-5" fill="none" stroke="url(#g)" stroke-width="2.4" stroke-linejoin="round" opacity=".6"/></svg></div>
<main>
  <div class="badge {state}" aria-hidden="true">{mark}</div>
  <h1>{heading}</h1>
  <p>{message}</p>
  <div class="error">{error}</div>
</main>
<div class="under"><a href="{docs_url}" target="_blank" rel="noopener">{docs}</a></div>
</body>
</html>
