<!doctype html>
<html lang="{lang}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title} · wasp platform</title>
<style>
/* Same look as the Keycloak theme `platform` (#173, variant B — Split). Inline only: no external assets. */
:root {{ --bg: #0a0e1a; --line: #1f2937; --line-2: #2b3648; --fg: #e6edf6; --fg-2: #9fb3c8; --fg-3: #6b7a8d; --accent: #4a9ef4; --ok: #7ee787; --err: #ff7b72; color-scheme: dark; }}
* {{ box-sizing: border-box; }}
body {{ margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 56px 24px; color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: radial-gradient(900px 480px at 20% 10%, rgba(74, 158, 244, .10), transparent 70%), radial-gradient(800px 420px at 85% 95%, rgba(124, 92, 255, .08), transparent 70%), var(--bg); }}
/* One panel sized by its content, centred: no empty half-screens on wide monitors */
.split {{ display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); width: 100%; max-width: 960px; min-height: 420px;
  border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: #0d1322; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .7); }}
.ctx {{ padding: 40px 44px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px;
  background: radial-gradient(520px 300px at 0% 0%, rgba(74, 158, 244, .16), transparent 70%), radial-gradient(420px 260px at 100% 100%, rgba(124, 92, 255, .12), transparent 70%), #080c17; }}
.brand {{ display: flex; align-items: center; gap: 10px; }}
.mark {{ width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), #7c5cff); color: #050912; font-weight: 700; }}
.name {{ font-weight: 600; }} .name span {{ color: var(--fg-3); font-weight: 400; }}
h1 {{ font-size: 30px; line-height: 1.2; margin: 20px 0 0; max-width: 22ch; text-wrap: balance; }}
h1 em {{ font-style: normal; color: var(--accent); }}
.term {{ background: #05080f; border: 1px solid var(--line-2); border-radius: 10px; margin-top: auto; overflow: hidden; }}
.term .tb {{ display: flex; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--line); }}
.term .tb i {{ width: 9px; height: 9px; border-radius: 50%; background: #2b3648; display: block; }}
.term pre {{ margin: 0; padding: 12px 14px; font: 12.5px/1.7 ui-monospace, "JetBrains Mono", Consolas, monospace; color: var(--fg-2); white-space: pre-wrap; }}
.p {{ color: var(--accent); }} .okc {{ color: var(--ok); }}
.form {{ padding: 40px; display: flex; flex-direction: column; justify-content: center; }}
.status {{ align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-3); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px 10px; margin-bottom: 14px; }}
.status i {{ width: 7px; height: 7px; border-radius: 50%; background: {dot}; display: block; }}
h2 {{ font-size: 22px; margin: 0; }}
.sub {{ color: var(--fg-2); margin: 6px 0 18px; }}
.cmds {{ border: 1px solid var(--line-2); border-radius: 10px; padding: 12px 14px; background: #0d1322; font: 12.5px/1.8 ui-monospace, Consolas, monospace; color: var(--fg-2); }}
@media (max-width: 860px) {{ body {{ padding: 0; place-items: stretch; }} .split {{ grid-template-columns: 1fr; min-height: 100vh; align-content: start; border: 0; border-radius: 0; box-shadow: none; }} .ctx {{ padding: 20px; border-right: 0; border-bottom: 1px solid var(--line); gap: 10px; }} h1 {{ font-size: 20px; margin-top: 8px; }} .term {{ display: none; }} .form {{ padding: 24px 20px; }} }}
</style>
</head>
<body>
<div class="split">
  <aside class="ctx">
    <div class="brand"><span class="mark">w</span><span class="name">wasp <span>· platform</span></span></div>
    <h1>{heading} <em>{heading_em}</em></h1>
    <div class="term"><div class="tb"><i></i><i></i><i></i></div><pre><span class="p">$</span> platform login
{term}</pre></div>
  </aside>
  <main class="form">
    <span class="status"><i></i>{status}</span>
    <h2>{title}</h2>
    <p class="sub">{message}</p>
    {extra}
  </main>
</div>
</body>
</html>
