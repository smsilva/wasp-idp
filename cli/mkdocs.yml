theme:
  name: material
  language: en
  icon:
    logo: material/console-line
    repo: fontawesome/brands/github
  palette:
    # Follows the OS preference until the reader picks one with the toggle.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: System theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Light theme
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow
validation:
  links:
    anchors: warn
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/diagram-zoom.js
  - javascripts/terminal.js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
