site_name: platform CLI
site_description: Primeiro Environment local com a CLI platform
site_url: https://smsilva.github.io/wasp-idp/cli/
repo_url: https://github.com/smsilva/wasp-idp
repo_name: smsilva/wasp-idp
edit_uri: edit/main/cli/docs/
docs_dir: docs
nav:
  - Início: index.md
  - Guia de uso:
      - Pré-requisitos: guide/01-prerequisites.md
      - Instalar a CLI: guide/02-install.md
      - Subir o control plane: guide/03-control-plane.md
      - Entrar: guide/04-login.md
      - Criar um ambiente: guide/05-create-environment.md
      - Usar o cluster do ambiente: guide/06-use-environment.md
      - Saída em JSON: guide/07-json-output.md
      - Apagar: guide/08-delete.md
      - Expiração: guide/09-expiration.md
      - "Por baixo: o CRD": guide/10-crd.md
      - Catálogo: guide/11-catalog.md
      - Times: guide/12-teams.md
      - Contas de nuvem: guide/13-cloud-accounts.md
      - Connections com plataformas de código: guide/14-scm-connections.md
      - Desmontar tudo: guide/15-teardown.md
  - Walkthrough:
      - walkthrough/index.md
      - Preparar o ambiente:
          - 0. Partir do zero: walkthrough/setup/00-from-scratch.md
          - 1. Pré-requisitos: walkthrough/setup/01-prerequisites.md
          - 2. Instalar a CLI: walkthrough/setup/02-install.md
          - 3. Credenciais do Google: walkthrough/setup/03-google-credentials.md
          - 4. Subir o control plane: walkthrough/setup/04-control-plane.md
      - Login:
          - 5. Sem login, a API recusa: walkthrough/login/05-refused.md
          - 6. Entrar: walkthrough/login/06-sign-in.md
          - 7. Quem sou eu: walkthrough/login/07-whoami.md
      - Ambientes:
          - 8. Criar um ambiente: walkthrough/environments/08-create.md
          - 9. O provider por dentro: walkthrough/environments/09-provider.md
          - 10. Usar o ambiente: walkthrough/environments/10-use.md
          - 11. Segundo ambiente, em paralelo: walkthrough/environments/11-second.md
          - 12. Trilha de auditoria: walkthrough/environments/12-audit-trail.md
      - Catálogo:
          - 13. Domínios, sistemas e recursos: walkthrough/catalog/13-entities.md
          - 14. Importar o catálogo do Backstage: walkthrough/catalog/14-backstage-import.md
      - 15. Times: walkthrough/15-teams.md
      - 16. Templates de component: walkthrough/16-templates.md
      - 17. Contas de nuvem: walkthrough/17-cloud-accounts.md
      - 18. Connection com o GitHub: walkthrough/18-scm-connection.md
      - 19. Limpar e sair: walkthrough/19-cleanup.md
      - Sem navegador: walkthrough/cli-smoke.md
theme:
  name: material
  language: pt-BR
  icon:
    logo: material/console-line
    repo: fontawesome/brands/github
  palette:
    # Follows the OS preference until the reader picks one with the toggle.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Tema do sistema
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Tema noturno
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Tema claro
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow
validation:
  links:
    anchors: warn
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/diagram-zoom.js
  - javascripts/terminal.js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
