# The Pod Security Standard baseline of every environment (#414, ADR 0041), enforced on the host. Every
# user of an environment is cluster-admin in its vcluster (ADR 0028) and could relabel a namespace there
# to privileged, so the boundary is this policy on the pods the vcluster syncs into env-<name>. The rules
# are baseline plus NET_ADMIN and NET_RAW, which the istio-init container of every pod with a sidecar
# needs (ADR 0035, no Istio CNI): with hostNetwork refused, they only reach the network namespace of
# the pod itself. Applied by `platform init`; the provider installs the same policy in each vcluster,
# with a binding of its own, so a refused pod fails at apply instead of staying Pending.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-environment-pod-security
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
    - name: ephemeralContainers
      expression: object.spec.?ephemeralContainers.orValue([])
    - name: allowedCapabilities
      expression: >-
        ['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD', 'NET_BIND_SERVICE',
        'SETFCAP', 'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT', 'NET_ADMIN', 'NET_RAW']
    - name: safeSysctls
      expression: >-
        ['kernel.shm_rmid_forced', 'net.ipv4.ip_local_port_range', 'net.ipv4.ip_unprivileged_port_start',
        'net.ipv4.tcp_syncookies', 'net.ipv4.ping_group_range', 'net.ipv4.ip_local_reserved_ports',
        'net.ipv4.tcp_keepalive_time', 'net.ipv4.tcp_fin_timeout', 'net.ipv4.tcp_keepalive_intvl',
        'net.ipv4.tcp_keepalive_probes']
    - name: seLinuxTypes
      expression: "['', 'container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t']"
  validations:
    - expression: >-
        !object.spec.?hostNetwork.orValue(false)
        && !object.spec.?hostPID.orValue(false)
        && !object.spec.?hostIPC.orValue(false)
      message: "hostNetwork, hostPID and hostIPC are not allowed in an environment"
      reason: Forbidden
    - expression: >-
        variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))
        && variables.ephemeralContainers.all(c, !c.?securityContext.?privileged.orValue(false))
      message: "privileged containers are not allowed in an environment"
      reason: Forbidden
    - expression: >-
        variables.containers.all(c, c.?securityContext.?capabilities.?add.orValue([]).all(cap, cap in variables.allowedCapabilities))
        && variables.ephemeralContainers.all(c, c.?securityContext.?capabilities.?add.orValue([]).all(cap, cap in variables.allowedCapabilities))
      message: "capabilities.add allows only the baseline set plus NET_ADMIN and NET_RAW in an environment"
      reason: Forbidden
    - expression: "object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))"
      message: "hostPath volumes are not allowed in an environment"
      reason: Forbidden
    - expression: >-
        variables.containers.all(c, c.?ports.orValue([]).all(p, p.?hostPort.orValue(0) == 0))
        && variables.ephemeralContainers.all(c, c.?ports.orValue([]).all(p, p.?hostPort.orValue(0) == 0))
      message: "hostPort is not allowed in an environment"
      reason: Forbidden
    - expression: >-
        !object.spec.?securityContext.?windowsOptions.?hostProcess.orValue(false)
        && variables.containers.all(c, !c.?securityContext.?windowsOptions.?hostProcess.orValue(false))
        && variables.ephemeralContainers.all(c, !c.?securityContext.?windowsOptions.?hostProcess.orValue(false))
      message: "hostProcess is not allowed in an environment"
      reason: Forbidden
    - expression: >-
        variables.containers.all(c, c.?securityContext.?procMount.orValue('Default') == 'Default')
        && variables.ephemeralContainers.all(c, c.?securityContext.?procMount.orValue('Default') == 'Default')
      message: "procMount other than Default is not allowed in an environment"
      reason: Forbidden
    - expression: >-
        object.spec.?securityContext.?seccompProfile.?type.orValue('') != 'Unconfined'
        && variables.containers.all(c, c.?securityContext.?seccompProfile.?type.orValue('') != 'Unconfined')
        && variables.ephemeralContainers.all(c, c.?securityContext.?seccompProfile.?type.orValue('') != 'Unconfined')
      message: "seccompProfile Unconfined is not allowed in an environment"
      reason: Forbidden
    - expression: >-
        object.spec.?securityContext.?appArmorProfile.?type.orValue('') != 'Unconfined'
        && variables.containers.all(c, c.?securityContext.?appArmorProfile.?type.orValue('') != 'Unconfined')
        && variables.ephemeralContainers.all(c, c.?securityContext.?appArmorProfile.?type.orValue('') != 'Unconfined')
        && object.metadata.?annotations.orValue({}).all(k, !k.startsWith('container.apparmor.security.beta.kubernetes.io/')
          || object.metadata.annotations[k] == 'runtime/default' || object.metadata.annotations[k].startsWith('localhost/'))
      message: "AppArmor Unconfined is not allowed in an environment"
      reason: Forbidden
    - expression: >-
        object.spec.?securityContext.?seLinuxOptions.?type.orValue('') in variables.seLinuxTypes
        && !object.spec.?securityContext.?seLinuxOptions.?user.hasValue()
        && !object.spec.?securityContext.?seLinuxOptions.?role.hasValue()
        && variables.containers.all(c, c.?securityContext.?seLinuxOptions.?type.orValue('') in variables.seLinuxTypes
          && !c.?securityContext.?seLinuxOptions.?user.hasValue() && !c.?securityContext.?seLinuxOptions.?role.hasValue())
        && variables.ephemeralContainers.all(c, c.?securityContext.?seLinuxOptions.?type.orValue('') in variables.seLinuxTypes
          && !c.?securityContext.?seLinuxOptions.?user.hasValue() && !c.?securityContext.?seLinuxOptions.?role.hasValue())
      message: "seLinuxOptions may set only the container types, never user or role, in an environment"
      reason: Forbidden
    - expression: "object.spec.?securityContext.?sysctls.orValue([]).all(s, s.name in variables.safeSysctls)"
      message: "only the safe sysctls of baseline are allowed in an environment"
      reason: Forbidden
---
# The pods the vcluster syncs to the host carry this label; the control plane of the vcluster does not. The
# syncer always sets it to `vcluster`, whatever the pod in the vcluster says, so a user cannot drop out of
# the binding. Excluding the control plane by its own labels (app=vcluster) instead would let one in: the
# syncer copies every other label of the pod as it is.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-environment-pod-security
spec:
  policyName: platform-environment-pod-security
  validationActions: [Deny]
  matchResources:
    objectSelector:
      matchExpressions:
        - key: vcluster.loft.sh/managed-by
          operator: Exists
