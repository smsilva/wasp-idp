{{- if .Values.providers.crossplaneAws.enabled }}
# The VPC of each environment (ec2.aws.upbound.io); the family provider (ProviderConfig in
# aws.upbound.io) comes in as its dependency. Applied once the Provider CRD of Crossplane exists.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-aws-ec2
spec:
  package: xpkg.upbound.io/upbound/provider-aws-ec2:v2.5.1
{{- end }}
