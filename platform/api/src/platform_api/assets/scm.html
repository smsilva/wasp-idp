<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title} · wasp platform</title>
<style>
/* Same look as the CLI login page (cli/src/wasp_platform/assets/callback.html). Inline only: no external assets. */
:root {{ --bg: #0a0e1a; --line: #1f2937; --line-2: #2b3648; --fg: #e6edf6; --fg-2: #9fb3c8; --fg-3: #6b7a8d; --accent: #4a9ef4; --ok: #7ee787; --err: #ff7b72; color-scheme: dark; }}
* {{ box-sizing: border-box; }}
body {{ margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: grid; place-items: center;
  background: radial-gradient(700px 360px at 0% 0%, rgba(74, 158, 244, .14), transparent 70%), radial-gradient(600px 300px at 100% 100%, rgba(124, 92, 255, .10), transparent 70%), var(--bg); }}
main {{ max-width: 480px; width: 100%; padding: 32px; }}
.brand {{ display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }}
.mark {{ width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), #7c5cff); color: #050912; font-weight: 700; }}
.name {{ font-weight: 600; }} .name span {{ color: var(--fg-3); font-weight: 400; }}
.status {{ display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-3); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px 10px; margin-bottom: 14px; }}
.status i {{ width: 7px; height: 7px; border-radius: 50%; background: {dot}; display: block; }}
h1 {{ font-size: 22px; margin: 0; }}
.sub {{ color: var(--fg-2); margin: 6px 0 18px; }}
.btn {{ display: inline-block; background: var(--accent); color: #050912; border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; margin-bottom: 16px; }}
.cmds {{ border: 1px solid var(--line-2); border-radius: 10px; padding: 12px 14px; background: #0d1322; font: 12.5px/1.8 ui-monospace, Consolas, monospace; color: var(--fg-2); }}
code {{ font: 13px ui-monospace, Consolas, monospace; color: var(--fg); }}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark">w</span><span class="name">wasp <span>· platform</span></span></div>
  <span class="status"><i></i>scm connection</span>
  <h1>{title}</h1>
  <p class="sub">{message}</p>
  {extra}
</main>
</body>
</html>
