apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-api
  namespace: platform-system
rules:
  - apiGroups: [platform.wasp.silvios.me]
    resources: [environments]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [platform.wasp.silvios.me]
    resources: [environments/status]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-api
  namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-api
subjects:
  - kind: ServiceAccount
    name: platform-api
    namespace: platform-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-api-journal
  namespace: platform-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform-system
spec:
  replicas: 1
  strategy:
    type: Recreate # single writer of the journal file
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
    spec:
      serviceAccountName: platform-api
      securityContext:
        fsGroup: 65532
      containers:
        - name: api
          image: platform-api:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PLATFORM_NAMESPACE
              value: platform-system
            - name: PLATFORM_JOURNAL
              value: /var/lib/platform/journal.jsonl
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: journal
              mountPath: /var/lib/platform
      volumes:
        - name: journal
          persistentVolumeClaim:
            claimName: platform-api-journal
---
# k3s servicelb publishes port 9080 on the load balancer; cluster-create maps it to 127.0.0.1:9090.
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform-system
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: platform-api
  ports:
    - name: http
      port: 9080
      targetPort: http
