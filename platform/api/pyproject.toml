[project]
name = "platform-api"
version = "0.1.0"
description = "Platform API: facade over the platform.wasp.silvios.me CRDs (ADR 0022)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "kubernetes>=31.0",
  "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
