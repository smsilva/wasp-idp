[project]
name = "wasp-templates"
version = "0.1.0"
description = "Component templates (ADR 0024): fetch at the registered ref, coerce parameters, render"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "jinja2>=3.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wasp_templates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
