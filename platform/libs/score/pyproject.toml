[project]
name = "wasp-score"
version = "0.1.0"
description = "The Score gate of the platform (#291): score.dev/v1b1 schema, resource types, resources in the catalog"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wasp_score"]

[tool.pytest.ini_options]
testpaths = ["tests"]
