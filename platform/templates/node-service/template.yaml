# Platform format (ADR 0024). The component's name, owner, system and description come from the
# platform; parameters declares only the extras, as JSON Schema. owner here is the template's owner.
name: node-service
type: service
owner: team-platform
description: Fastify service on Node.js with a home page, Swagger, a PostgreSQL check, CI to GHCR, Dockerfile and app-spec.yaml
parameters:
  type: object
  properties:
    port:
      type: integer
      description: Port the container listens on.
      default: 3000
    title:
      type: string
      description: Headline of the home page; the component name when not given.
    theme:
      type: string
      description: Color of the home page's header band.
      enum: [green, lime, sky, violet]
      default: green
# The workflows carry GitHub's ${{ }}, and the code and tests are JavaScript, rendered as they are.
copyWithoutRendering:
  - .github/workflows/*
  - src/*
  - test/*
