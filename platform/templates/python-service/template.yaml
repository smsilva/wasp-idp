# Platform format (ADR 0024). The component's name, owner, system and description come from the
# platform; parameters declares only the extras, as JSON Schema. owner here is the template's owner.
name: python-service
type: service
# The default template of its type on a fresh platform init (otherwise the first folder in name order).
default: true
owner: team-platform
description: FastAPI service with a home page, Swagger, a PostgreSQL check, CI to GHCR, Dockerfile and app-spec.yaml
parameters:
  type: object
  properties:
    port:
      type: integer
      description: Port the container listens on.
      default: 8000
    title:
      type: string
      description: Headline of the home page; the component name when not given.
    theme:
      type: string
      description: Accent color of the home page.
      enum: [indigo, teal, amber, rose]
      default: indigo
# The workflows carry GitHub's ${{ }} and the page carries Jinja blocks of its own: both stay as written.
copyWithoutRendering:
  - .github/workflows/*
  - app/templates/*
