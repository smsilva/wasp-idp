apiVersion: score.dev/v1b1

metadata:
  name: ${{ values.name }}

resources:
  db:
    type: postgres
  dns:
    type: dns
  route:
    type: route
    params:
      host: ${resources.dns.host}
      path: /
      port: 80

containers:
  api:
    image: .
    variables:
      APP_NAME: ${{ values.name }}
      DATABASE_HOST: ${resources.db.host}
      DATABASE_NAME: ${resources.db.name}
      DATABASE_USER: ${resources.db.username}
      DATABASE_PASSWORD: ${resources.db.password}
    # The denominator of saturation in platform workload signals (ADR 0040).
    resources:
      limits:
        cpu: 500m
        memory: 256Mi

service:
  ports:
    http:
      port: 80
      targetPort: ${{ values.port }}
