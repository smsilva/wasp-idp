# The Prometheus of the observability subsystem (ADR 0040, #411): scrapes the Istio sidecar of each
# workload pod in every environment and the cAdvisor of the kubelet; the Platform API reads the golden
# signals from it on demand (platform/api/src/platform_api/signals.py). Short retention, no volume.
# Installed by `platform init`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-prometheus
rules:
  # pods: the service discovery of the job sidecars; nodes and nodes/proxy: cAdvisor through the apiserver.
  - apiGroups: [""]
    resources: [pods, nodes, nodes/proxy, nodes/metrics]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: platform-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: platform-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
    scrape_configs:
      # The envoy of each workload pod, as vcluster syncs it to the host: env-<environment>, a pod named
      # <pod>-x-apps-x-vcluster with the labels of the pod in the vcluster. Never labelmap the annotations:
      # the synced pod carries ServiceAccount tokens in vcluster.loft.sh/token-*.
      - job_name: sidecars
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: env-.+
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_vcluster_loft_sh_namespace]
            regex: apps
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          # istio-proxy is a native sidecar (an initContainer) and declares 15090: one target per pod.
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "15090"
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: (.+);(.+)
            target_label: __address__
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: (.+)
            target_label: __metrics_path__
          # Istio knows only the vcluster-side names: the environment comes from the host namespace.
          - source_labels: [__meta_kubernetes_namespace]
            regex: env-(.+)
            target_label: environment
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            target_label: workload_instance
      # Usage and limits per container, from the kubelet through the apiserver: the denominator of saturation.
      - job_name: cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [namespace]
            regex: env-.+
            action: keep
          - source_labels: [__name__]
            regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_spec_cpu_quota|container_spec_cpu_period|container_spec_memory_limit_bytes
            action: keep
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: platform-system
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: platform-system
  # What `platform status` reads (ADR 0039): the provider and the capabilities it serves.
  labels:
    platform.wasp.silvios.me/provider: prometheus
    platform.wasp.silvios.me/capabilities: observability
spec:
  replicas: 1
  strategy:
    type: Recreate # one TSDB in an emptyDir
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
      annotations:
        # Replaced by `platform init` with a hash of this file: a changed scrape config rolls the pod.
        platform.wasp.silvios.me/config-hash: dev
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: data
          emptyDir: {}
