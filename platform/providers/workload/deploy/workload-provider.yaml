# Provider workload (ADR 0033): applies each WorkloadRevision in the vcluster of its Environment
# (with the admin kubeconfig of Environment.status) and keeps the WorkloadInstance. Works with any
# Environment that is Ready with kubeconfigData. Installed by `platform init`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-provider
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-provider
  namespace: platform-system
rules:
  - apiGroups: [platform.wasp.silvios.me]
    resources: [workloadrevisions]
    verbs: [get, list, watch]
  - apiGroups: [platform.wasp.silvios.me]
    resources: [workloadrevisions/status]
    verbs: [get, patch]
  - apiGroups: [platform.wasp.silvios.me]
    resources: [workloadinstances]
    verbs: [get, list, watch, create, delete] # delete: a remove revision
  - apiGroups: [platform.wasp.silvios.me]
    resources: [workloadinstances/status]
    verbs: [get, patch]
  - apiGroups: [platform.wasp.silvios.me]
    resources: [environments]
    verbs: [get]
  # The resources the Forager provisioned for a revision; a remove deletes them (the Forager undoes each).
  - apiGroups: [platform.wasp.silvios.me]
    resources: [resourcerequests]
    verbs: [get, list, delete]
  # The Workload Spec of each version (spec.appSpec).
  - apiGroups: [catalog.platform.wasp.silvios.me]
    resources: [versions]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-provider
  namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workload-provider
subjects:
  - kind: ServiceAccount
    name: workload-provider
    namespace: platform-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-provider
  namespace: platform-system
spec:
  replicas: 1
  strategy:
    type: Recreate # one reconciler at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: workload-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-provider
    spec:
      serviceAccountName: workload-provider
      containers:
        - name: provider
          image: workload-provider:dev
          imagePullPolicy: Never
          args: [--namespace, platform-system]
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
