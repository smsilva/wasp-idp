[project]
name = "workload-provider"
version = "0.1.0"
description = "Workload provider: applies each WorkloadRevision in the vcluster of its Environment and keeps the WorkloadInstance (ADR 0033)"
requires-python = ">=3.12"
dependencies = [
  "kubernetes>=31.0",
  "pyyaml>=6",
]

[project.scripts]
workload-provider = "workload_provider.main:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workload_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
