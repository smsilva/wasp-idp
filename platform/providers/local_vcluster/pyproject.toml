[project]
name = "local-vcluster-provider"
version = "0.1.0"
description = "Local Environment provider: one vcluster per platform.wasp.silvios.me Environment, inside platform-local"
requires-python = ">=3.12"
dependencies = [
  "kubernetes>=31.0",
  "pyyaml>=6",
]

[project.scripts]
local-vcluster-provider = "local_vcluster_provider.main:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_vcluster_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
