# RENDERED FROM platform/chart/platform-control-plane/templates/providers/traefik.yaml: platform init no longer reads this file directly.
# The shared entry point of every environment (ADR 0036): Traefik on host port 7080 (platform init maps
# 127.0.0.1:7080), routing *.<environment>.localhost to the Gateway of that environment's vcluster through
# the Ingress the local_vcluster provider writes in env-<name>. Installed by the helm-controller of k3s,
# which runs even with the built-in Traefik disabled (cluster-create), so platform init needs no helm.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: platform-ingress
  namespace: kube-system
spec:
  repo: https://traefik.github.io/charts
  chart: traefik
  version: 41.7.1
  targetNamespace: platform-ingress
  createNamespace: true
  valuesContent: |-
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: platform
    providers:
      kubernetesIngress:
        enabled: true
      kubernetesCRD:
        enabled: false
    ports:
      web:
        exposedPort: 7080
      websecure:
        expose:
          default: false
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
