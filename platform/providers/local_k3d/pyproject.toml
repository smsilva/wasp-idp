[project]
name = "local-k3d-provider"
version = "0.1.0"
description = "Local Environment provider: one k3d cluster per platform.wasp.silvios.me Environment"
requires-python = ">=3.11"
dependencies = [
  "kubernetes>=31.0",
]

[project.scripts]
local-k3d-provider = "local_k3d_provider.main:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_k3d_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
