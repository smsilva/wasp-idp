[project]
name = "registry-provider"
version = "0.1.0"
description = "Registry provider: checks that each platform.wasp.silvios.me OCIRegistry answers (ADR 0037)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "kubernetes>=31.0",
]

[project.scripts]
registry-provider = "registry_provider.main:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/registry_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
