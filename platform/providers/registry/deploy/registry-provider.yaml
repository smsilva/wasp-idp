# Provider registry (ADR 0037, #365): checks that each OCIRegistry answers the OCI Distribution API
# (https://<host>/v2/) and sets Ready. Installed by `platform init`. Pull credentials come with #367.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-provider
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-provider
  namespace: platform-system
rules:
  - apiGroups: [platform.wasp.silvios.me]
    resources: [ociregistries]
    verbs: [get, list, watch]
  - apiGroups: [platform.wasp.silvios.me]
    resources: [ociregistries/status]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-provider
  namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-provider
subjects:
  - kind: ServiceAccount
    name: registry-provider
    namespace: platform-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-provider
  namespace: platform-system
spec:
  replicas: 1
  strategy:
    type: Recreate # one reconciler at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-provider
    spec:
      serviceAccountName: registry-provider
      containers:
        - name: provider
          image: registry-provider:dev
          imagePullPolicy: Never
          args: [--namespace, platform-system]
          resources:
            requests:
              memory: 48Mi
            limits:
              memory: 128Mi
