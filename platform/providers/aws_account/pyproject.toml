[project]
name = "aws-account-provider"
version = "0.1.0"
description = "Cloud account provider: verifies the trust of each AWS platform.wasp.silvios.me CloudAccount (ADR 0029)"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "kubernetes>=31.0",
]

[project.scripts]
aws-account-provider = "aws_account_provider.main:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_account_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
