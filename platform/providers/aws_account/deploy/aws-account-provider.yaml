# Provider aws_account (#193, ADR 0029): verifies the trust of each AWS CloudAccount from the
# platform base credential (Secret aws-base-credential). Installed by `platform init --aws-profile`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-account-provider
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-account-provider
  namespace: platform-system
rules:
  - apiGroups: [platform.wasp.silvios.me]
    resources: [cloudaccounts]
    verbs: [get, list, watch]
  - apiGroups: [platform.wasp.silvios.me]
    resources: [cloudaccounts/status]
    verbs: [get, patch, update]
  # create cannot be limited by name; the other verbs only reach the base identity ConfigMap.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [aws-base-identity]
    verbs: [get, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-account-provider
  namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aws-account-provider
subjects:
  - kind: ServiceAccount
    name: aws-account-provider
    namespace: platform-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-account-provider
  namespace: platform-system
spec:
  replicas: 1
  strategy:
    type: Recreate # one reconciler at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-account-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aws-account-provider
    spec:
      serviceAccountName: aws-account-provider
      containers:
        - name: provider
          image: aws-account-provider:dev
          imagePullPolicy: Never
          args: [--namespace, platform-system]
          # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and, for a temporary credential, AWS_SESSION_TOKEN.
          envFrom:
            - secretRef:
                name: aws-base-credential
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 256Mi
