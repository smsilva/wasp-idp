# RENDERED FROM platform/chart/platform-control-plane/templates/providers/scm-github-provider.yaml: platform init no longer reads this file directly.
# Provider scm_github (#199): validates each GitHub ScmConnection with the App's key and records the
# installation, and runs each ComponentCreation (#279) and each Build (#206). Installed by `platform
# init`. The only reader of the credential Secrets (ADR 0025).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scm-github-provider
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scm-github-provider
  namespace: platform-system
rules:
  - apiGroups: [platform.wasp.silvios.me]
    resources: [scmconnections]
    verbs: [get, list, watch, patch] # patch: appSlug and installationId
  - apiGroups: [platform.wasp.silvios.me]
    resources: [scmconnections/status]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [platform.wasp.silvios.me]
    resources: [componentcreations]
    verbs: [get, list, watch, delete] # delete: 24 h after Ready, or after a final failure
  - apiGroups: [platform.wasp.silvios.me]
    resources: [componentcreations/status]
    verbs: [get, patch]
  # The component index: written in the Registered step, a read mirror for the API (ADR 0023).
  - apiGroups: [catalog.platform.wasp.silvios.me]
    resources: [components]
    verbs: [get, create, update]
  - apiGroups: [platform.wasp.silvios.me]
    resources: [builds]
    verbs: [get, list, watch, delete] # delete: 24 h after Ready, or after a final failure
  - apiGroups: [platform.wasp.silvios.me]
    resources: [builds/status]
    verbs: [get, patch]
  # The version index, written when a build ends Ready (#206); resources: the ids an app-spec.yaml uses.
  - apiGroups: [catalog.platform.wasp.silvios.me]
    resources: [versions]
    verbs: [get, create]
  - apiGroups: [catalog.platform.wasp.silvios.me]
    resources: [resources]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scm-github-provider
  namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scm-github-provider
subjects:
  - kind: ServiceAccount
    name: scm-github-provider
    namespace: platform-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scm-github-provider
  namespace: platform-system
  # What `platform status` reads (ADR 0039): the provider, the capabilities it serves and its vendor.
  labels:
    platform.wasp.silvios.me/provider: scm_github
    platform.wasp.silvios.me/capabilities: scm.build
    platform.wasp.silvios.me/vendor: github
spec:
  replicas: 1
  strategy:
    type: Recreate # one reconciler at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: scm-github-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scm-github-provider
    spec:
      serviceAccountName: scm-github-provider
      containers:
        - name: provider
          image: scm-github-provider:dev
          imagePullPolicy: Never
          args: [--namespace, platform-system, --workdir, /work]
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        # The rendered content of the creations: rendered again after a restart (fixed ref, same result).
        - name: work
          emptyDir:
            sizeLimit: 512Mi
