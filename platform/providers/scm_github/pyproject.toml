[project]
name = "scm-github-provider"
version = "0.1.0"
description = "GitHub SCM connection controller: validates each platform.wasp.silvios.me ScmConnection against its GitHub App"
requires-python = ">=3.12"
dependencies = [
  "kubernetes>=31.0",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.9",
]

[project.scripts]
scm-github-provider = "scm_github_provider.main:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scm_github_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
