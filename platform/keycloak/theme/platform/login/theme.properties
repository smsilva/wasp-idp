# Theme `platform` (#537, variant D — Card + trail): keycloak.v2 forms in one centred card.
# Only template.ftl, card.ftl (sentence, badge and device-flow trail per page) and the CSS are ours; every form partial
# (field.ftl, buttons.ftl, social-providers.ftl…) is inherited, which keeps upgrades cheap.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/platform.css
scripts=js/platform.js

darkMode=false
locales=pt-BR,en
