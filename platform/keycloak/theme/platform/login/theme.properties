# Theme `platform` (#173, variant B — Split): keycloak.v2 forms inside a two-column layout.
# Only template.ftl, the context column per page and the CSS are ours; every form partial
# (field.ftl, buttons.ftl, social-providers.ftl…) is inherited, which keeps upgrades cheap.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/platform.css
scripts=js/platform.js

darkMode=false
locales=pt-BR,en
