# platform theme (#173). Keys platform.* are the context column; the rest override keycloak.v2 texts.
platform.ctx.login.title=Good to see you again.
platform.ctx.login.em=Sign in and keep building.
platform.ctx.login.text=The same login works for the CLI, the portal and the API. Who you are and what you can do come from the platform groups.
platform.ctx.login.cmd=platform whoami
platform.ctx.deviceLogin.title=Connecting
platform.ctx.deviceLogin.em=a terminal.
platform.ctx.deviceLogin.text=Sign in with the account you use on the platform. The terminal is waiting.
platform.ctx.deviceLogin.cmd=platform login --use-device-code
platform.ctx.device.title=Connecting
platform.ctx.device.em=a terminal.
platform.ctx.device.text=Check that the code matches the one shown in the terminal where you ran the command. If it does not, close this tab.
platform.ctx.device.cmd=platform login --use-device-code
platform.ctx.grant.title=This terminal will act
platform.ctx.grant.em=on your behalf.
platform.ctx.grant.text=It will be able to create and delete environments, as you would. Access lasts until you run platform logout.
platform.ctx.grant.cmd=platform login --use-device-code
platform.ctx.profile.title=Glad you're here.
platform.ctx.profile.em=Check your details.
platform.ctx.profile.text=Name and e-mail came from Google. You join the platform-users group; the platform admins can grant you more access.
platform.ctx.error.title=Something went wrong
platform.ctx.error.em=along the way.
platform.ctx.error.text=Your terminal is still waiting. Try again; if the error persists, send the details below to the platform admins.
platform.ctx.done.title=All set.
platform.ctx.done.em=Back to the terminal.
platform.ctx.done.text=You can close this tab.
platform.ctx.done.cmd=platform whoami
