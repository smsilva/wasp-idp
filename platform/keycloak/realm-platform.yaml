# Realm `platform` as code, applied by keycloak-config-cli (deploy/realm-import.yaml) on every `platform init`.
# $(env:…) is resolved by keycloak-config-cli from Secrets, so no credential lives here.
# `platform init` drops identityProviders/identityProviderMappers when GOOGLE_CLIENT_ID is not set,
# and turns the bootstrap-admin mapper into one mapper per --admin e-mail (none without --admin).
realm: platform
enabled: true
displayName: wasp platform
# Theme `platform` (theme/platform, #173); texts in pt-BR and en, picked from the browser language.
loginTheme: platform
internationalizationEnabled: true
supportedLocales:
  - pt-BR
  - en
defaultLocale: en
defaultGroups:
  - /platform-users
groups:
  - name: platform-admins
  - name: platform-users

clientScopes:
  - name: platform-groups
    protocol: openid-connect
    attributes:
      include.in.token.scope: "false"
    protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          claim.name: groups
          full.path: "false"
          access.token.claim: "true"
          id.token.claim: "true"
          userinfo.token.claim: "true"
      # What the Platform API authorizes on: full paths, so /teams/team-alpha and /platform-admins
      # cannot be impersonated by a homonym group elsewhere in the realm (ADR 0026).
      - name: group-paths
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          claim.name: group_paths
          full.path: "true"
          access.token.claim: "true"
          id.token.claim: "false"
          userinfo.token.claim: "false"
  - name: platform-api-audience
    protocol: openid-connect
    attributes:
      include.in.token.scope: "false"
    protocolMappers:
      - name: audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.client.audience: platform-api
          access.token.claim: "true"

clients:
  - clientId: platform-cli
    name: platform CLI
    publicClient: true
    standardFlowEnabled: true # Authorization Code + PKCE, the CLI default
    directAccessGrantsEnabled: false
    redirectUris:
      - http://127.0.0.1/*
    attributes:
      pkce.code.challenge.method: S256
      oauth2.device.authorization.grant.enabled: "true" # platform login --use-device-code
    defaultClientScopes:
      - basic
      - profile
      - email
      - platform-groups
      - platform-api-audience
  - clientId: platform-api
    name: Platform API
    bearerOnly: true
  # The Platform API's own access to the realm admin API, for teams (ADR 0026, #231).
  # The secret is generated by `platform init` (Secret platform-api-keycloak).
  - clientId: platform-api-admin
    name: Platform API (realm admin)
    publicClient: false
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    secret: $(env:PLATFORM_API_ADMIN_SECRET)

# Service account of platform-api-admin: read-only roles. Its writes (teams and memberships) come from
# fine-grained admin permissions that `platform init` applies (bootstrap/admin_permissions.py, #238):
# never platform-admins nor platform-users, never a user's credentials or roles.
users:
  - username: service-account-platform-api-admin
    enabled: true
    serviceAccountClientId: platform-api-admin
    clientRoles:
      realm-management:
        - view-users
        - query-users
        - query-groups

identityProviders:
  - alias: google
    providerId: google
    displayName: Google
    enabled: true
    trustEmail: true
    config:
      clientId: $(env:GOOGLE_CLIENT_ID)
      clientSecret: $(env:GOOGLE_CLIENT_SECRET)
      defaultScope: openid profile email
      syncMode: IMPORT

identityProviderMappers:
  - name: bootstrap-admin
    identityProviderAlias: google
    identityProviderMapper: oidc-advanced-group-idp-mapper
    config:
      syncMode: INHERIT
      claims: '[{"key":"email","value":"$(env:PLATFORM_ADMIN_EMAIL)"}]'
      group: /platform-admins
