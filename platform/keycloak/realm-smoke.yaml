# Test identities for scripts/demo/cli-smoke (#179). Only `platform init --target local` merges this
# into realm-platform.yaml; nothing here ever reaches another target.
#
# Password grant is discouraged (OAuth 2.1) and stays off in platform-cli. It is acceptable here
# because the client is dedicated, local-only and test-only: it lets the CLI flow run without a
# browser or a Google account. The passwords are random, generated by init into the Secret
# keycloak-smoke-user and resolved by keycloak-config-cli through $(env:…).
clients:
  - clientId: platform-smoke
    name: platform CLI smoke test (local only)
    publicClient: true
    standardFlowEnabled: false
    directAccessGrantsEnabled: true
    defaultClientScopes:
      - basic
      - profile
      - email
      - platform-groups
      - platform-api-audience

users:
  - username: platform-smoke
    email: platform-smoke@platform.local
    emailVerified: true
    firstName: Platform
    lastName: Smoke
    enabled: true
    groups:
      - /platform-users
    credentials:
      - type: password
        value: $(env:SMOKE_USER_PASSWORD)
  - username: platform-smoke-admin
    email: platform-smoke-admin@platform.local
    emailVerified: true
    firstName: Platform
    lastName: Smoke Admin
    enabled: true
    groups:
      - /platform-admins
      - /platform-users
    credentials:
      - type: password
        value: $(env:SMOKE_ADMIN_PASSWORD)
