apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudaccounts.platform.wasp.silvios.me
spec:
  group: platform.wasp.silvios.me
  scope: Namespaced
  names:
    kind: CloudAccount
    listKind: CloudAccountList
    plural: cloudaccounts
    singular: cloudaccount
    shortNames: [ca]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Vendor
          type: string
          jsonPath: .spec.vendor
        - name: Account
          type: string
          jsonPath: .status.accountId
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [vendor]
              properties:
                vendor:
                  type: string
                  enum: [aws]
                aws:
                  description: Role the platform assumes from its base credential (ADR 0029).
                  type: object
                  required: [roleArn, externalId]
                  properties:
                    roleArn:
                      type: string
                    externalId:
                      description: Generated by the Platform API, never accepted from the client; the role trust policy must require it.
                      type: string
                    regions:
                      type: array
                      items:
                        type: string
            status:
              type: object
              properties:
                accountId:
                  type: string
                callerArn:
                  description: The identity obtained by assuming the role.
                  type: string
                lastValidated:
                  type: string
                  format: date-time
                observedVerifyRequest:
                  description: The verify-requested-at annotation the last validation answered.
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
