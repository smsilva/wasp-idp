apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: resources.catalog.platform.wasp.silvios.me
spec:
  group: catalog.platform.wasp.silvios.me
  scope: Namespaced
  names:
    kind: Resource
    listKind: ResourceList
    plural: resources
    singular: resource
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: System
          type: string
          jsonPath: .spec.system
        - name: Owner
          type: string
          jsonPath: .spec.owner
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [owner, type, system]
              properties:
                owner:
                  description: Owner team (free text until groups exist in Keycloak, #186).
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
                description:
                  type: string
                type:
                  description: Role of the resource (database, topic, queue, bucket), never a cloud service.
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
                system:
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
