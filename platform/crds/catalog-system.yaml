apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: systems.catalog.platform.wasp.silvios.me
spec:
  group: catalog.platform.wasp.silvios.me
  scope: Namespaced
  names:
    kind: System
    listKind: SystemList
    plural: systems
    singular: system
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Domain
          type: string
          jsonPath: .spec.domain
        - name: Owner
          type: string
          jsonPath: .spec.owner
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [owner, domain]
              properties:
                owner:
                  description: Owner team (free text until groups exist in Keycloak, #186).
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
                description:
                  type: string
                domain:
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
