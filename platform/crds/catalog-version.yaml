# The version index (#206, ADR 0030). A READ MIRROR: a version is an image the platform built from a
# branch, whose app-spec.yaml passed the Score gate. Written only by the scm_github provider when a Build
# ends Ready; named <component>.<version>, never overwritten (VersionConflict).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: versions.catalog.platform.wasp.silvios.me
spec:
  group: catalog.platform.wasp.silvios.me
  scope: Namespaced
  names:
    kind: Version
    listKind: VersionList
    plural: versions
    singular: version
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Component
          type: string
          jsonPath: .spec.component
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Branch
          type: string
          jsonPath: .spec.branch
        - name: Created
          type: date
          jsonPath: .spec.createdAt
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [component, version, image, digest, commit, branch, createdAt]
              properties:
                component:
                  type: string
                version:
                  type: string
                image:
                  description: The repository, without the tag; the tag is the version.
                  type: string
                digest:
                  type: string
                commit:
                  type: string
                branch:
                  type: string
                createdAt:
                  type: string
                  format: date-time
                build:
                  description: The Build that registered it (removed after 24 h).
                  type: string
