apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scmconnections.platform.wasp.silvios.me
spec:
  group: platform.wasp.silvios.me
  scope: Namespaced
  names:
    kind: ScmConnection
    listKind: ScmConnectionList
    plural: scmconnections
    singular: scmconnection
    shortNames: [scm]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Vendor
          type: string
          jsonPath: .spec.vendor
        - name: Org
          type: string
          jsonPath: .spec.github.org
        - name: Default
          type: boolean
          jsonPath: .spec.default
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              description: A connection with a code platform (ADR 0025); the credential lives in the SecretStore, never here.
              type: object
              required: [vendor]
              properties:
                vendor:
                  type: string
                  enum: [github]
                default:
                  description: The connection used when none is named; at most one.
                  type: boolean
                github:
                  type: object
                  required: [org]
                  properties:
                    org:
                      type: string
                      pattern: '^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$'
                    appId:
                      description: Written by the API, after the manifest flow or from --app-id.
                      type: integer
                    appSlug:
                      description: Written by the API (manifest flow) or by the controller (--app-id).
                      type: string
                    installationId:
                      description: Written by the controller, once it finds the App's installation on the org.
                      type: integer
                credentialRef:
                  description: Name of the Secret holding the credential, never its content.
                  type: string
            status:
              type: object
              properties:
                permissions:
                  description: Permissions the installation has, as GitHub reports them.
                  type: object
                  additionalProperties:
                    type: string
                repositorySelection:
                  type: string
                lastValidated:
                  type: string
                  format: date-time
                observedVerifyRequest:
                  description: The verify-requested-at annotation the controller last answered.
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
