apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: environments.platform.wasp.silvios.me
spec:
  group: platform.wasp.silvios.me
  scope: Namespaced
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    singular: environment
    shortNames: [env]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Profile
          type: string
          jsonPath: .spec.profile
        - name: Account
          type: string
          jsonPath: .spec.cloudAccount
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Expires
          type: string
          format: date-time
          jsonPath: .spec.expiresAt
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [profile]
              # On spec, not on the field: a rule on the field runs only when both sides have it, so adding or removing it would pass.
              x-kubernetes-validations:
                - rule: has(self.cloudAccount) == has(oldSelf.cloudAccount) && (!has(self.cloudAccount) || self.cloudAccount == oldSelf.cloudAccount)
                  message: cloudAccount is immutable
              properties:
                profile:
                  type: string
                  enum: [ephemeral, shared]
                expiresAt:
                  type: string
                  format: date-time
                cloudAccount:
                  description: CloudAccount the environment is provisioned in (#435); absent means a local vcluster. Immutable.
                  type: string
                sharedWith:
                  description: Teams whose members use the environment (ADR 0026); empty means private to the owner.
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                kubeconfigData:
                  description: Kubeconfig of the environment, for providers that run inside the cluster (local_vcluster); the CLI writes it locally.
                  type: string
                port:
                  description: Host port of the environment API server (provider local_vcluster).
                  type: integer
                mesh:
                  description: Versions of the mesh installed in the environment (ADR 0035); absent while it is being installed.
                  type: object
                  properties:
                    istio:
                      type: string
                    gatewayAPI:
                      type: string
                ingress:
                  description: Where the workloads of the environment are reached from outside (ADR 0036); absent while its Gateway is being created.
                  type: object
                  properties:
                    domain:
                      description: Workloads get hosts under *.<domain>.
                      type: string
                    port:
                      description: Host port of the shared entry point.
                      type: integer
                podSecurity:
                  description: Version of the pod policy installed in the environment (ADR 0041); absent while it is being installed.
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
