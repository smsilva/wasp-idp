# A build of a component from a branch (#206): the Platform API writes it after the synchronous checks,
# and the scm_github provider dispatches the repo's platform-build workflow, follows the run, reads the
# platform-build artifact, validates app-spec.yaml at the built commit (Score), and registers the version
# in the index (versions.catalog). Dispatched, Running, Succeeded and SpecValidated, then Ready.
# Removed 24 h after Ready or a final failure; the version index stays.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: builds.platform.wasp.silvios.me
spec:
  group: platform.wasp.silvios.me
  scope: Namespaced
  names:
    kind: Build
    listKind: BuildList
    plural: builds
    singular: build
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Component
          type: string
          jsonPath: .spec.component
        - name: Branch
          type: string
          jsonPath: .spec.branch
        - name: Version
          type: string
          jsonPath: .status.result.version
        - name: Registry
          type: string
          jsonPath: .spec.registry
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [component, branch, requestId, repo, scmConnection]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: a build is immutable
              properties:
                component:
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
                branch:
                  type: string
                  maxLength: 255
                version:
                  description: The version the CI must use; without it, the CI computes one (Commitizen).
                  type: string
                  pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
                requestId:
                  description: Generated by the API; the run is found by its run-name, platform-build <requestId>.
                  type: string
                repo:
                  description: <org>/<name>, from the component index, resolved by the API.
                  type: string
                scmConnection:
                  description: The connection of the repo's org, resolved by the API.
                  type: string
                registry:
                  description: The OCIRegistry the CI pushes to (ADR 0037), resolved by the API; absent on builds before #365.
                  type: string
                image:
                  description: <host>/<namespace>/<component>, sent to the workflow as the input image; the result must name it.
                  type: string
            status:
              type: object
              properties:
                runUrl:
                  type: string
                run:
                  type: object
                  properties:
                    id:
                      type: integer
                    headSha:
                      type: string
                result:
                  description: The content of platform-build.json, the run's artifact.
                  type: object
                  properties:
                    version:
                      type: string
                    image:
                      type: string
                    digest:
                      type: string
                    commit:
                      type: string
                    branch:
                      type: string
                    requestId:
                      type: string
                appSpec:
                  description: What app-spec.yaml declares at the built commit, for the CLI summary.
                  type: object
                  properties:
                    resources:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          type:
                            type: string
                errors:
                  description: Why app-spec.yaml is invalid (InvalidSpec), one field and reason each.
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                      reason:
                        type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
