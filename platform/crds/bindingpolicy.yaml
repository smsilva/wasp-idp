# Binding policy (ADR 0022, 0031): which mode makes a resource of the Score, as an ordered list of
# provisioners. Layers: the policies of the environment (spec.environment), then those of its profile
# (spec.profile, #329), then the platform default (neither); by name within a layer, by position
# within a policy. The first
# item that matches type, class and id wins. The branch layer is not a policy: it is the class a
# revision asks for. Read by the Forager.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bindingpolicies.platform.wasp.silvios.me
spec:
  group: platform.wasp.silvios.me
  scope: Namespaced
  names:
    kind: BindingPolicy
    listKind: BindingPolicyList
    plural: bindingpolicies
    singular: bindingpolicy
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Environment
          type: string
          jsonPath: .spec.environment
        - name: Profile
          type: string
          jsonPath: .spec.profile
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [provisioners]
              x-kubernetes-validations:
                - rule: "!(has(self.environment) && has(self.profile))"
                  message: a policy is of an environment or of a profile, not both
              properties:
                environment:
                  description: Empty, with profile empty too, the platform default.
                  type: string
                profile:
                  description: The profile whose environments this policy applies to (#329).
                  type: string
                provisioners:
                  type: array
                  items:
                    type: object
                    required: [type, mode]
                    properties:
                      type:
                        type: string
                      class:
                        description: Matches only a request with this class; without it, only a request without class.
                        type: string
                      id:
                        description: Matches only the resource with this id in the Score.
                        type: string
                      mode:
                        type: string
                        enum: [provision, compose, bind]
                      params:
                        description: Input of the provisioner (the shared instance, the existing Secret).
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
